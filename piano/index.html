<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Trainer</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e2e0da;
  --accent: #2563eb; --accent-soft: #dbe7fd; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  --rh: #2563eb; --lh: #a16207;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --panel: #222226; --ink: #ececef; --muted: #9a9aa3; --line: #34343a;
    --accent: #6ea0ff; --accent-soft: #24324d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; border-color: transparent; }
button:disabled { opacity: .5; cursor: default; }
select, input[type=number] { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 6px; }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
h2 { font-size: 20px; } h3 { font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .brand { font-weight: 700; font-size: 17px; margin-right: 8px; }
header.top nav { display: flex; gap: 4px; }
header.top .chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
/* The piano key that does the same as a button, shown on the button. */
.pkey { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 16px;
  font-weight: 600; color: var(--muted); border: 1px solid var(--line); background: var(--bg); vertical-align: 1px; }
button.primary .pkey { color: #fff; border-color: rgba(255, 255, 255, .5); background: transparent; }
.pkeys { display: flex; gap: 4px 14px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.pkeys .pkey { margin: 0 4px 0 0; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.on { color: var(--ok); border-color: var(--ok); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip.vol { display: inline-flex; align-items: center; gap: 6px; }
.chip.vol input { width: 90px; }

main { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 200px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.levels { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.lvl { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; padding: 6px 10px; }
.lvl .n { width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .t { flex: 1; }
.lvl .stars { color: #e0a800; letter-spacing: 1px; font-size: 13px; }
.lvl.locked { opacity: .55; }
.lvl.current { border-color: var(--accent); background: var(--accent-soft); }

.session li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.session li:last-child { border-bottom: 0; }
.session ol { list-style: none; margin: 0; padding: 0; }
.session .done { color: var(--ok); font-weight: 700; width: 18px; }

.drill-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.sel { background: var(--accent); color: #fff; }
.status { font-size: 16px; min-height: 24px; margin: 8px 0; }
.status b { color: var(--accent); }
.score-wrap { background: #fff; border-radius: 10px; border: 1px solid var(--line); overflow: auto; max-height: 58vh; position: relative; }
.score-wrap svg { display: block; }
.label-card { color: #111; text-align: center; padding: 40px 10px; }
.label-card .big { font-size: 64px; font-weight: 700; }
.label-card .sub { color: #666; }
.theory { border-left: 4px solid var(--accent); }
.theory p, .theory ul { margin: 6px 0; }
.results { border: 2px solid var(--line); }
.results.pass { border-color: var(--ok); }
.results.fail { border-color: var(--warn); }
.results .big { font-size: 28px; font-weight: 700; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 8px 0; }
.stats div span { display: block; font-size: 12px; color: var(--muted); }

#kbd-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 8px 8px; }
#kbd-dock .kbd-info { display: flex; gap: 12px; font-size: 12px; color: var(--muted); padding: 0 4px 4px; }
#kbd-dock .kbd-info { align-items: center; }
#kbd-toggle { padding: 2px 8px; }
#kbd svg { display: block; width: 100%; touch-action: none; user-select: none; }
.k { stroke: #555; stroke-width: 1; }
.k.w { fill: #fff; } .k.b { fill: #222; }
/* Hints are pale with a strong outline in the hand's colour; feedback is solid colour.
   Held keys are grey, so a held wrong key never looks like a blue right-hand hint. */
.k.hint-rh { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2.5; } .k.b.hint-rh { fill: #3b67b8; stroke: #93c5fd; }
.k.hint-lh { fill: #fef08a; stroke: #a16207; stroke-width: 2.5; } .k.b.hint-lh { fill: #ca8a04; stroke: #fde047; }
.k.down { fill: #d1d5db; } .k.b.down { fill: #6b7280; }
.k.good { fill: #4ade80; stroke: #15803d; stroke-width: 2; } .k.b.good { fill: #16a34a; }
.k.bad { fill: #dc2626; stroke: #450a0a; stroke-width: 3; } .k.b.bad { fill: #ef4444; stroke: #450a0a; }
.nav-focus { outline: 3px solid var(--accent); outline-offset: 2px; }
.klabel { font-size: 10px; fill: #888; pointer-events: none; }

#load-error { background: #fee2e2; color: #7f1d1d; padding: 12px 16px; border-bottom: 1px solid #fca5a5; }
.toast { position: fixed; top: 60px; right: 16px; z-index: 10; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; }
table.set { border-collapse: collapse; width: 100%; }
table.set td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.set td:first-child { width: 40%; }
</style>
</head>
<body>
<div id="load-error" hidden></div>
<header class="top">
  <span class="brand">🎹 Piano Trainer</span>
  <nav>
    <button class="ghost" data-nav="home">Home</button>
    <button class="ghost" data-nav="echo">Echo</button>
    <button class="ghost" data-nav="record">Record</button>
    <button class="ghost" data-nav="theory">Theory</button>
    <button class="ghost" data-nav="settings">Settings</button>
  </nav>
  <div class="chips">
    <label class="chip vol" id="chip-vol" hidden title="Piano volume, sent over MIDI">Piano 🔊 <input type="range" id="piano-vol" min="0" max="1" step="0.05"></label>
    <span class="chip on" id="chip-awake" hidden title="The screen will not dim or lock while you play">☀ Screen stays on</span>
    <span class="chip on" id="chip-nav" hidden>Navigate: F7 ◀◀ · G7 ◀ · G♯7 press · A7 ▶ · B7 ▶▶ · E7 Home · C8 done</span>
    <span class="chip" id="chip-midi">MIDI: –</span>
    <span class="chip" id="chip-pedal" hidden>Pedal</span>
    <span class="chip" id="chip-mic" hidden>Mic</span>
  </div>
</header>
<main id="view"></main>
<div id="kbd-dock">
  <div class="kbd-info"><span id="kbd-held">&nbsp;</span><span class="spacer"></span><span id="kbd-qwerty"></span><button class="ghost small" id="kbd-toggle"></button></div>
  <div id="kbd"></div>
</div>

<script>
'use strict';

/* =========================================================================
   Utilities
   ========================================================================= */
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mod = (a, n) => ((a % n) + n) % n;
const today = () => new Date().toLocaleDateString('sv-SE');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : String(kid));
  }
  return el;
}

function toast(msg, ms = 2200) {
  const t = h('div', { class: 'toast' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

/* =========================================================================
   Music theory
   ========================================================================= */
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const ACC_OFFSET = { '': 0, '#': 1, '##': 2, 'b': -1, 'bb': -2, 'n': 0 };
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const NAT_MINOR = [0, 2, 3, 5, 7, 8, 10];
const SHARP_ORDER = 'FCGDAEB';
const FLAT_ORDER = 'BEADGCF';
const KEY_COUNT = { C: 0, G: 1, D: 2, A: 3, E: 4, B: 5, F: -1, Bb: -2, Eb: -3, Ab: -4, Db: -5,
  Am: 0, Em: 1, Bm: 2, Dm: -1, Gm: -2, Cm: -3 };

function parsePitch(name) {
  const m = /^([A-G])(##|#|bb|b|n)?(-?\d)$/.exec(name);
  if (!m) throw new Error('Bad pitch: ' + name);
  const acc = m[2] === 'n' ? '' : (m[2] || '');
  return { letter: m[1], acc, oct: +m[3], midi: (+m[3] + 1) * 12 + LETTER_PC[m[1]] + ACC_OFFSET[acc] };
}
const midiOf = name => parsePitch(name).midi;
const isBlack = m => [1, 3, 6, 8, 10].includes(mod(m, 12));
const handOf = m => (m < 60 ? 'lh' : 'rh');
const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const midiName = m => SHARP_NAMES[mod(m, 12)] + (Math.floor(m / 12) - 1);
const pretty = s => String(s).replace(/#/g, '♯').replace(/([A-G])b/g, '$1♭');

function keyAccMap(key) {
  const n = KEY_COUNT[key] || 0;
  const map = {};
  for (const L of LETTERS) map[L] = '';
  if (n > 0) for (let i = 0; i < n; i++) map[SHARP_ORDER[i]] = '#';
  if (n < 0) for (let i = 0; i < -n; i++) map[FLAT_ORDER[i]] = 'b';
  return map;
}

/** Spell a 7-note scale with one letter per degree, so G major gets F# (not Gb). */
function spellScale(tonic, steps = MAJOR) {
  const t = /^([A-G])(#|b)?$/.exec(tonic);
  const li = LETTERS.indexOf(t[1]);
  const tpc = mod(LETTER_PC[t[1]] + ACC_OFFSET[t[2] || ''], 12);
  return steps.map((s, i) => {
    const L = LETTERS[(li + i) % 7];
    let d = mod(tpc + s - LETTER_PC[L], 12);
    if (d > 6) d -= 12;
    return L + { '-2': 'bb', '-1': 'b', '0': '', '1': '#', '2': '##' }[d];
  });
}

/** Ascending run of scale notes with octaves, e.g. scaleRun('G', 4, 5) -> G4 A4 B4 C5 D5. */
function scaleRun(tonic, oct, count, steps = MAJOR) {
  const sc = spellScale(tonic, steps);
  const li = LETTERS.indexOf(tonic[0]);
  const out = [];
  for (let i = 0; i < count; i++) out.push(sc[i % 7] + (oct + Math.floor((li + i) / 7)));
  return out;
}

/** Give each pitch class an octave so the notes rise from `oct`. */
function stackUp(pcs, oct) {
  const out = [];
  let prev = -Infinity;
  for (const pc of pcs) {
    let o = oct;
    while (midiOf(pc + o) <= prev) o++;
    out.push(pc + o);
    prev = midiOf(pc + o);
  }
  return out;
}
function placeBelow(pc, ref) { for (let o = 9; o >= 0; o--) if (midiOf(pc + o) < ref) return pc + o; }
function placeAbove(pc, ref) { for (let o = 0; o <= 9; o++) if (midiOf(pc + o) > ref) return pc + o; }

function triad(root, minor = false) {
  const sc = spellScale(root, minor ? NAT_MINOR : MAJOR);
  return [sc[0], sc[2], sc[4]];
}

/** Left-hand I, IV and V7 in "close" position, as taught in beginner books (C: C-E-G, C-F-A, B-F-G). */
function lhProgression(key, oct) {
  const sc = spellScale(key);
  const I = stackUp([sc[0], sc[2], sc[4]], oct);
  const root = midiOf(I[0]);
  const f4 = placeAbove(sc[3], root);
  const IV = [I[0], f4, placeAbove(sc[5], midiOf(f4))];
  const V7 = [placeBelow(sc[6], root), f4, placeAbove(sc[4], midiOf(f4))];
  return { I, IV, V7 };
}

/* =========================================================================
   Score format
   Voice string: tokens separated by spaces, bars by "|".
     E4q  quarter E4        C3+E3+G3h  chord (half)      rq  quarter rest
     D4q. dotted quarter    E4q:3      finger 3          xq  any key (rhythm)
     gq   invisible spacer  C4+E4h"Maj_3rd"  label below/above the note (_ = space)
     C4h~ tied to the next note in the same hand, which is then held, not played again
   ========================================================================= */
const DUR_BEATS = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25 };

function parseVoice(str) {
  const measures = [[]];
  for (const tok of str.trim().split(/\s+/)) {
    if (!tok) continue;
    if (tok === '|') { measures.push([]); continue; }
    const m = /^(.+?)([whqes])(\.?)(~?)(?::([\d,]+))?(?:"([^"]*)")?$/.exec(tok);
    if (!m) throw new Error('Bad token: ' + tok);
    const ev = { dur: m[2], dots: m[3] ? 1 : 0 };
    ev.beats = DUR_BEATS[ev.dur] * (ev.dots ? 1.5 : 1);
    if (m[4]) ev.tie = true;
    if (m[5]) ev.fingers = m[5].split(',').map(Number);
    if (m[6]) ev.label = m[6].replace(/_/g, ' ');
    if (m[1] === 'r') ev.rest = true;
    else if (m[1] === 'g') ev.ghost = true;
    else if (m[1] === 'x') ev.any = true;
    else {
      ev.names = m[1].split('+').sort((a, b) => midiOf(a) - midiOf(b));
      ev.keys = ev.names.map(midiOf);
    }
    measures[measures.length - 1].push(ev);
  }
  if (measures.length > 1 && measures[measures.length - 1].length === 0) measures.pop();
  return measures;
}

function makeScore({ key = 'C', time = '4/4', rh = '', lh = '', staves = 'grand', title, numbers = false }) {
  const R = rh ? parseVoice(rh) : [];
  const L = lh ? parseVoice(lh) : [];
  const [num, den] = time.split('/').map(Number);
  const barBeats = num * 4 / den;
  const n = Math.max(R.length, L.length);
  const measures = [];
  for (let i = 0; i < n; i++) {
    const m = { number: i + 1, rh: R[i] || [], lh: L[i] || [] };
    for (const hand of ['rh', 'lh']) {
      if (!m[hand].length) m[hand] = [{ rest: true, dur: 'w', dots: 0, beats: barBeats }];
      if (m[hand].length === 1 && m[hand][0].rest) m[hand][0].fullBar = true;
      let pos = i * barBeats;
      for (const ev of m[hand]) { ev.hand = hand; ev.start = pos; pos += ev.beats; }
    }
    measures.push(m);
  }
  return linkTies({ key, time, num, den, barBeats, measures, staves, title, numbers });
}

/** Point each tied note at its continuation. Re-run after slicing, which copies events. */
function linkTies(score) {
  for (const hand of ['rh', 'lh']) {
    let prev = null;
    for (const ev of score.measures.flatMap(m => m[hand])) {
      delete ev.tieTo; delete ev.tiedFrom;
      if (ev.ghost) continue;
      if (prev && prev.tie && ev.keys) { prev.tieTo = ev; ev.tiedFrom = prev; }
      prev = ev;
    }
  }
  return score;
}

function sliceScore(score, from, to) {
  const off = (from - 1) * score.barBeats;
  const measures = score.measures.slice(from - 1, to).map(m => ({
    number: m.number,
    rh: m.rh.map(e => ({ ...e, start: e.start - off })),
    lh: m.lh.map(e => ({ ...e, start: e.start - off })),
  }));
  return linkTies({ ...score, measures });
}

const allEvents = score => score.measures.flatMap(m => [...m.rh, ...m.lh]);

/** Group note onsets into steps: everything that starts at the same beat is one step. */
function buildSteps(score, hands = 'both') {
  const map = new Map();
  for (const ev of allEvents(score)) {
    ev.inactive = hands !== 'both' && ev.hand !== hands && !ev.rest && !ev.ghost;
    if (ev.rest || ev.ghost || ev.inactive || ev.tiedFrom) continue;
    const k = ev.start.toFixed(4);
    if (!map.has(k)) map.set(k, { start: ev.start, bar: Math.floor(ev.start / score.barBeats + 1e-9), events: [], expect: [] });
    const st = map.get(k);
    st.events.push(ev);
    if (ev.any) st.expect.push({ any: true, hand: ev.hand, ev });
    // Both hands can share a key at the same beat (e.g. voices crossing in a canon); it's one key press.
    else for (const midi of ev.keys) if (!st.expect.some(e => e.midi === midi)) st.expect.push({ midi, hand: ev.hand, ev });
  }
  return [...map.values()].sort((a, b) => a.start - b.start);
}

function entryMatches(e, midi, ex) {
  if (e.any) return !ex.splitHands || handOf(midi) === e.hand;
  if (ex.matchPc) return mod(e.midi, 12) === mod(midi, 12);
  return e.midi === midi;
}

/* =========================================================================
   Exercise generators
   ========================================================================= */
const BASIC = ['q q q q', 'h q q', 'q q h', 'h h', 'q h q'];
const EIGHTHS = ['e e q q q', 'q e e q q', 'q q e e q', 'e e e e h', 'q e e h'];
const ENDINGS = ['w', 'h h', 'q q h'];
const TONIC_KEY = { C: 'C', G: 'G', F: 'F', D: 'D', A: 'A' };
const LH_OCT = { C: 3, G: 2, F: 3, D: 3 };

function walk(idx) {
  const r = Math.random();
  const d = r < 0.55 ? pick([-1, 1]) : r < 0.8 ? pick([-2, 2]) : 0;
  let n = idx + d;
  if (n < 0 || n > 4) n = idx - d;
  return clamp(n, 0, 4);
}
function nearest(tones, idx) {
  let best = tones[0];
  for (const t of tones) if (Math.abs(t - idx) < Math.abs(best - idx) || (Math.abs(t - idx) === Math.abs(best - idx) && Math.random() < 0.5)) best = t;
  return best;
}

/** Five-finger melody as bars of {idx 0..4, dur}. */
function melody(bars, patterns, { chordTones = null, endOn = 0, endings = ENDINGS } = {}) {
  let idx = 0;
  const out = [];
  for (let b = 0; b < bars; b++) {
    const last = b === bars - 1;
    const pat = (last ? pick(endings) : pick(patterns)).split(' ');
    out.push(pat.map((dur, j) => {
      if (dur[0] === 'r') return { rest: true, dur: dur.slice(1) };
      if (j === 0 && chordTones) idx = nearest(chordTones[b], idx);
      else if (b > 0 || j > 0) idx = walk(idx);
      if (last && j === pat.length - 1) idx = endOn;
      return { idx, dur };
    }));
  }
  return out;
}

function melodyTokens(mel, pos, hand, mirror = false) {
  return mel.map(bar => bar.map(n => {
    if (n.rest) return 'r' + n.dur;
    const i = mirror ? 4 - n.idx : n.idx;
    return `${pos[i]}${n.dur}:${hand === 'rh' ? i + 1 : 5 - i}`;
  }).join(' ')).join(' | ');
}

function genReading({ pool, key = 'C', count = 12, keys }) {
  const k = keys ? pick(keys) : key;
  const src = typeof pool === 'function' ? pool(k) : pool;
  const rh = [], lh = [];
  let prev = null;
  for (let i = 0; i < count; i++) {
    let item;
    do { item = pick(src); } while (src.length > 1 && item === prev);
    prev = item;
    const [name, staff] = item.split('@');
    const s = staff || (midiOf(name) >= 60 ? 'rh' : 'lh');
    (s === 'rh' ? rh : lh).push(name + 'q');
    (s === 'rh' ? lh : rh).push('gq');
    if (i % 4 === 3 && i < count - 1) { rh.push('|'); lh.push('|'); }
  }
  return { score: makeScore({ key: k, rh: rh.join(' '), lh: lh.join(' ') }), speed: true };
}

function genDyads(count = 12) {
  const tre = scaleRun('C', 4, 12), bas = scaleRun('C', 2, 12);
  const rh = [], lh = [];
  for (let i = 0; i < count; i++) {
    rh.push(pick(tre) + 'q'); lh.push(pick(bas) + 'q');
    if (i % 4 === 3 && i < count - 1) { rh.push('|'); lh.push('|'); }
  }
  return { score: makeScore({ rh: rh.join(' '), lh: lh.join(' ') }), speed: true };
}

function inKeyPool(lo, hi) {
  return k => {
    const sc = spellScale(k);
    const out = [];
    for (let o = 1; o <= 6; o++) for (const pc of sc) {
      const n = pc + o;
      if (midiOf(n) >= midiOf(lo) && midiOf(n) <= midiOf(hi)) out.push(n);
    }
    return out;
  };
}

function genOneHand({ tonic, hand, patterns = BASIC, bars = 4 }) {
  const pos = scaleRun(tonic, hand === 'rh' ? 4 : LH_OCT[tonic], 5);
  const voice = melodyTokens(melody(bars, patterns), pos, hand);
  return { score: makeScore({ key: TONIC_KEY[tonic], [hand]: voice }) };
}

function genTogether(kind, { tonic = 'C', bars = 4 } = {}) {
  const posR = scaleRun(tonic, 4, 5), posL = scaleRun(tonic, LH_OCT[tonic], 5);
  const key = TONIC_KEY[tonic];
  const bar = (arr) => arr.join(' | ');
  if (kind === 'turns') {
    const rh = [], lh = [];
    for (let b = 0; b < bars; b++) {
      const mel = melody(1, BASIC, { endings: b === bars - 1 ? ENDINGS : BASIC, endOn: 0 });
      if (b % 2 === 0) { rh.push(melodyTokens(mel, posR, 'rh')); lh.push('rw'); }
      else { lh.push(melodyTokens(mel, posL, 'lh')); rh.push('rw'); }
    }
    return { score: makeScore({ key, rh: bar(rh), lh: bar(lh) }) };
  }
  if (kind === 'hold') {
    const mel = melody(bars, BASIC);
    const lh = [];
    for (let b = 0; b < bars; b++) { const i = b === bars - 1 ? 0 : pick([0, 0, 4]); lh.push(`${posL[i]}w:${5 - i}`); }
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: bar(lh) }) };
  }
  if (kind === 'parallel' || kind === 'contrary') {
    const mel = melody(bars, BASIC);
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: melodyTokens(mel, posL, 'lh', kind === 'contrary') }) };
  }
  if (kind === 'fifths') {
    const mel = melody(bars, BASIC);
    const d = `${posL[0]}+${posL[4]}h:5,1`;
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: bar(Array(bars).fill(`${d} ${d}`)) }) };
  }
  // Chord-based kinds: RH melody lands on a chord tone at the start of each bar.
  const prog = bars === 8 ? ['I', 'IV', 'I', 'V7', 'I', 'IV', 'V7', 'I'] : ['I', 'IV', 'V7', 'I'];
  const ch = lhProgression(tonic, LH_OCT[tonic]);
  const tones = { I: [0, 2, 4], IV: [0, 3], V7: [1, 3, 4] };
  const chordTones = prog.map(p => tones[p]);
  if (kind === 'block') {
    const mel = melody(bars, BASIC, { chordTones });
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: bar(prog.map(p => `${ch[p].join('+')}w"${p}"`)) }) };
  }
  if (kind === 'broken') {
    const mel = melody(bars, ['h h', 'w'], { chordTones, endings: ['w'] });
    const lh = prog.map(p => {
      const [a, b, c] = ch[p];
      const f = p === 'I' ? [5, 1, 3, 1] : [5, 1, 2, 1];
      const one = `${a}e:${f[0]} ${c}e:${f[1]} ${b}e:${f[2]} ${c}e:${f[3]}`;
      return `${one} ${one.replace(/:\d/g, '')}`;
    });
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: bar(lh) }) };
  }
  if (kind === 'eighthsOver') {
    const mel = melody(bars, EIGHTHS, { chordTones });
    return { score: makeScore({ key, rh: melodyTokens(mel, posR, 'rh'), lh: bar(prog.map(p => `${ch[p].join('+')}h ${ch[p].join('+')}h`)) }) };
  }
  throw new Error('Unknown kind ' + kind);
}

function genRhythm(patterns, { time = '4/4', bars = 4 } = {}) {
  const toks = [];
  for (let b = 0; b < bars; b++) {
    toks.push(pick(patterns).split(' ').map(t => (t[0] === 'r' ? t : 'x' + t)).join(' '));
  }
  return { score: makeScore({ time, rh: toks.join(' | '), staves: 'treble' }), anyPitch: true };
}

function genRhythmHands(bars = 4) {
  const pairs = [
    { rh: 're xe re xe re xe re xe', lh: 'xq xq xq xq' },
    { rh: 'xq xq xq xq', lh: 'xh xh' },
    { rh: 'xe xe xe xe xe xe xe xe', lh: 'xq xq xq xq' },
    { rh: 'xq. xe xh', lh: 'xq xq xq xq' },
    { rh: 'xh xh', lh: 'xq xq xq xq' },
  ];
  const rh = [], lh = [];
  for (let b = 0; b < bars; b++) { const p = pick(pairs); rh.push(p.rh); lh.push(p.lh); }
  return { score: makeScore({ rh: rh.join(' | '), lh: lh.join(' | ') }), anyPitch: true, splitHands: true };
}

function genIntervals(count = 8) {
  const names = ['', 'unison', '2nd', '3rd', '4th', '5th', '6th', '7th', 'octave'];
  const toks = [];
  const white = scaleRun('C', 4, 5);
  for (let i = 0; i < count; i++) {
    const lo = pick(white);
    const n = 2 + rand(7);
    const li = LETTERS.indexOf(lo[0]) + n - 1;
    const hi = LETTERS[li % 7] + (4 + Math.floor(li / 7));
    toks.push(`${lo}+${hi}h"${names[n]}"`);
    if (i % 2 === 1 && i < count - 1) toks.push('|');
  }
  return { score: makeScore({ rh: toks.join(' '), staves: 'treble' }) };
}

function genTriads({ roots, minor = false, mixed = false, inversions = false, count = 8 }) {
  const toks = [];
  for (let i = 0; i < count; i++) {
    const root = pick(roots);
    const isMin = mixed ? Math.random() < 0.5 : minor;
    let notes = triad(root, isMin);
    let label = root + (isMin ? 'm' : '');
    if (inversions) {
      const inv = rand(3);
      notes = [...notes.slice(inv), ...notes.slice(0, inv)];
      if (inv) label += '/' + notes[0];
    }
    toks.push(`${stackUp(notes, 4).join('+')}h"${pretty(label)}"`);
    if (i % 2 === 1 && i < count - 1) toks.push('|');
  }
  return { score: makeScore({ rh: toks.join(' '), staves: 'treble' }) };
}

function genChordNames(count = 12) {
  const roots = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'Bb', 'Eb', 'Ab'];
  const toks = [];
  for (let i = 0; i < count; i++) {
    const root = pick(roots);
    // A-flat minor needs C-flat, which only confuses at this stage.
    const isMin = root !== 'Ab' && Math.random() < 0.5;
    const label = pretty(root) + (isMin ? ' minor' : ' major');
    toks.push(`${stackUp(triad(root, isMin), 4).join('+')}q"${label.replace(/ /g, '_')}"`);
    if (i % 4 === 3 && i < count - 1) toks.push('|');
  }
  return { score: makeScore({ rh: toks.join(' '), staves: 'treble' }), display: 'label', matchPc: true };
}

function genProgression(keys) {
  const k = pick(keys);
  const ch = lhProgression(k, LH_OCT[k]);
  const one = `${ch.I.join('+')}h"I" ${ch.IV.join('+')}h"IV" | ${ch.V7.join('+')}h"V7" ${ch.I.join('+')}h"I"`;
  return { score: makeScore({ key: k, lh: `${one} | ${one}`, staves: 'bass' }) };
}

const SCALE_FINGERS = {
  std: { rh: [1, 2, 3, 1, 2, 3, 4, 5], lh: [5, 4, 3, 2, 1, 3, 2, 1] },
  F: { rh: [1, 2, 3, 4, 1, 2, 3, 4], lh: [5, 4, 3, 2, 1, 3, 2, 1] },
};
function genScale({ tonic, hands, key, minor = false, lhOct, rhOct = 4 }) {
  const fing = SCALE_FINGERS[tonic === 'F' ? 'F' : 'std'];
  const voice = (hand, oct) => {
    const up = scaleRun(tonic, oct, 8, minor ? NAT_MINOR : MAJOR);
    const f = fing[hand];
    const tok = (i, d) => `${up[i]}${d}:${f[i]}`;
    return [
      [0, 1, 2, 3].map(i => tok(i, 'q')).join(' '),
      [4, 5, 6, 7].map(i => tok(i, 'q')).join(' '),
      [6, 5, 4, 3].map(i => tok(i, 'q')).join(' '),
      `${tok(2, 'q')} ${tok(1, 'q')} ${tok(0, 'h')}`,
    ].join(' | ');
  };
  const opts = { key: key || tonic };
  if (hands !== 'lh') opts.rh = voice('rh', rhOct);
  if (hands !== 'rh') opts.lh = voice('lh', lhOct);
  return { score: makeScore(opts) };
}

/* =========================================================================
   Technique: short fixed patterns, repeated so the fingers learn them
   ========================================================================= */
const RH_FIVE = [1, 2, 3, 4, 5], LH_FIVE = [5, 4, 3, 2, 1];

/** One voice from bars of [scale index, finger] pairs, all eighths, ending on a whole note. */
function eighthBars(notes, bars, end) {
  const tok = ([i, f]) => `${notes[i]}e:${f}`;
  return [...bars.map(b => b.map(tok).join(' ')), `${notes[end[0]]}w:${end[1]}`].join(' | ');
}

function genTechnique(kind, { hands = 'rh', tonic = 'C' } = {}) {
  const key = TONIC_KEY[tonic];
  const voices = {};
  for (const hand of hands === 'both' ? ['rh', 'lh'] : [hands]) {
    const rh = hand === 'rh';
    const oct = rh ? 4 : LH_OCT[tonic];
    const fing = rh ? RH_FIVE : LH_FIVE;
    if (kind === 'five') {
      const pos = scaleRun(tonic, oct, 5);
      const bar = [0, 1, 2, 3, 4, 3, 2, 1].map(i => [i, fing[i]]);
      voices[hand] = eighthBars(pos, [bar, bar, bar], [0, fing[0]]);
    } else if (kind === 'pairs') {
      // Fingers 1-2, 2-3, 3-4, 4-5 in turn: the weak 4-5 pair gets the same work as the strong ones.
      const pos = scaleRun(tonic, oct, 5);
      const bars = [0, 1, 2, 3].map(a => Array.from({ length: 8 }, (_, n) => { const i = a + n % 2; return [i, fing[i]]; }));
      voices[hand] = eighthBars(pos, bars, [0, fing[0]]);
    } else if (kind === 'thumb') {
      // Right hand goes up and the left hand comes down, so the thumb always passes under finger 3.
      const f = [1, 2, 3, 1, 2, 1, 3, 2];
      const notes = rh ? scaleRun('C', 4, 5) : scaleRun('C', 3, 5).reverse();
      const bar = [0, 1, 2, 3, 4, 3, 2, 1].map((i, n) => [i, f[n]]);
      voices[hand] = eighthBars(notes, [bar, bar, bar], [0, 1]);
    } else if (kind === 'hanon') {
      // Hanon No. 1: up the white keys from C, then the mirrored shape back down to C.
      const notes = scaleRun('C', oct, 14);
      const up = [0, 2, 3, 4, 5, 4, 3, 2], upF = rh ? [1, 2, 3, 4, 5, 4, 3, 2] : [5, 4, 3, 2, 1, 2, 3, 4];
      const downF = rh ? [5, 4, 3, 2, 1, 2, 3, 4] : [1, 2, 3, 4, 5, 4, 3, 2];
      const bars = [0, 1, 2, 3].map(d => up.map((i, n) => [d + i, upF[n]]))
        .concat([7, 6, 5].map(t => up.map((i, n) => [t - i, downF[n]])));
      voices[hand] = eighthBars(notes, bars, [0, rh ? 1 : 5]);
    } else if (kind === 'broken') {
      // C, F, G, C, each spread over an octave: up to the top note and back.
      const roots = rh ? ['C4', 'F4', 'G4'] : ['C3', 'F2', 'G2'];
      const f = rh ? [1, 2, 3, 5, 3, 2, 1, 2] : [5, 3, 2, 1, 2, 3, 5, 3];
      const bar = r => {
        const [a, b, c] = triad(r.slice(0, -1));
        const ns = stackUp([a, b, c, a], +r.slice(-1));
        return [0, 1, 2, 3, 2, 1, 0, 1].map((i, n) => `${ns[i]}e:${f[n]}`).join(' ');
      };
      const home = stackUp(triad('C'), rh ? 4 : 3).join('+');
      voices[hand] = [...roots.map(bar), `${home}w:${rh ? '1,3,5' : '5,3,1'}`].join(' | ');
    } else throw new Error('Unknown kind ' + kind);
  }
  return { score: makeScore({ key, ...voices }) };
}

/* =========================================================================
   Transcription: recorded notes, in beats from the first downbeat, to the score format
   ========================================================================= */
const NOTE_VALUES = [[4, 'w'], [3, 'h.'], [2, 'h'], [1.5, 'q.'], [1, 'q'], [0.75, 'e.'], [0.5, 'e'], [0.25, 's']];
// Ordered by number of sharps/flats, so a tie goes to the simpler key.
const KEY_CANDIDATES = ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb', 'E', 'Ab'];
const FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const EPS = 1e-6;

function detectKey(midis) {
  const counts = Array(12).fill(0);
  for (const m of midis) counts[mod(m, 12)]++;
  let best = 'C', bestScore = -1;
  for (const k of KEY_CANDIDATES) {
    const score = spellScale(k).reduce((a, n) => a + counts[mod(midiOf(n + '4'), 12)], 0);
    if (score > bestScore) { best = k; bestScore = score; }
  }
  return best;
}

/** Name a MIDI note the way the key spells it; notes outside the key follow the key's sharp/flat side. */
function spellMidi(m, key) {
  const pc = mod(m, 12);
  let name = spellScale(key).find(n => mod(midiOf(n + '4'), 12) === pc);
  if (!name) name = ((KEY_COUNT[key] || 0) < 0 ? FLAT_NAMES : SHARP_NAMES)[pc];
  const o = Math.floor(m / 12) - 1;
  for (const oct of [o, o + 1, o - 1]) if (midiOf(name + oct) === m) return name + oct;
  return midiName(m);
}

const onGrid = (b, step) => Math.abs(b / step - Math.round(b / step)) < EPS;

/**
 * Split a length inside one bar into written values. Rests break at every beat. Off-beat notes
 * may cross one beat (quarter), or end on a beat (dotted quarter): the usual way to write syncopation.
 */
function splitValues(start, len, rest = false) {
  const out = [];
  while (len > EPS) {
    const onBeat = onGrid(start, 1);
    const toBeat = Math.floor(start + EPS) + 1 - start;
    const ok = v => v <= len + EPS && (onBeat || v <= toBeat + EPS
      || (!rest && (v <= 1 + EPS || (v <= 1.5 + EPS && onGrid(start + v, 1)))));
    const hit = NOTE_VALUES.find(([v]) => ok(v)) || NOTE_VALUES[NOTE_VALUES.length - 1];
    out.push(hit);
    start += hit[0]; len -= hit[0];
  }
  return out;
}

/**
 * raw: [{ m, on, off }] with on/off in beats from the first downbeat.
 * grid: smallest note value in beats. split: lowest MIDI note played by the right hand.
 */
function transcribe(raw, { time = '4/4', grid = 0.5, key = 'auto', split = 60 } = {}) {
  const [num, den] = time.split('/').map(Number);
  const barBeats = num * 4 / den;
  const q = b => Math.round(b / grid) * grid;
  const notes = raw.filter(n => n.on > -grid).map(n => {
    const on = Math.max(0, q(n.on));
    return { m: n.m, on, off: Math.max(on + grid, q(n.off)) };
  });
  if (!notes.length) return null;
  const k = key === 'auto' ? detectKey(notes.map(n => n.m)) : key;
  const bars = Math.max(1, Math.ceil(Math.max(...notes.map(n => n.off)) / barBeats - EPS));
  const total = bars * barBeats;

  const voice = hand => {
    const groups = [];
    for (const n of notes.filter(x => (x.m < split) === (hand === 'lh')).sort((a, b) => a.on - b.on)) {
      const g = groups[groups.length - 1];
      if (g && Math.abs(g.on - n.on) < EPS) { if (!g.ms.includes(n.m)) g.ms.push(n.m); g.off = Math.max(g.off, n.off); }
      else groups.push({ on: n.on, off: n.off, ms: [n.m] });
    }
    if (!groups.length) return '';
    const segs = [];
    let cur = 0;
    groups.forEach((g, i) => {
      const next = i + 1 < groups.length ? groups[i + 1].on : total;
      let end = Math.min(g.off, next);
      // Releases come early, and more so on long notes. Without this a held whole note
      // reads as "dotted half, tied eighth, rest". Stretch to the next note or a beat nearby.
      if (i + 1 < groups.length && next - end <= 0.5 + EPS) end = next;
      else {
        const toBeat = Math.min(next, Math.floor(end + Math.max(0.5, 0.35 * (end - g.on)) + EPS));
        if (toBeat > end) end = toBeat;
      }
      if (g.on > cur + EPS) segs.push({ start: cur, len: g.on - cur });
      segs.push({ start: g.on, len: end - g.on, name: g.ms.sort((a, b) => a - b).map(m => spellMidi(m, k)).join('+') });
      cur = end;
    });
    if (cur < total - EPS) segs.push({ start: cur, len: total - cur });

    const barToks = Array.from({ length: bars }, () => []);
    for (const sg of segs) {
      const pieces = [];
      let s = sg.start, left = sg.len;
      while (left > EPS) {
        const bi = Math.floor(s / barBeats + EPS);
        const inBar = Math.min(left, (bi + 1) * barBeats - s);
        for (const [v, tok] of splitValues(s - bi * barBeats, inBar, !sg.name)) pieces.push({ bi, tok }), s += v, left -= v;
      }
      pieces.forEach((p, i) => barToks[p.bi].push(sg.name ? sg.name + p.tok + (i < pieces.length - 1 ? '~' : '') : 'r' + p.tok));
    }
    return barToks.map(b => b.join(' ')).join(' | ');
  };
  return { key: k, time, rh: voice('rh'), lh: voice('lh'), bars };
}

/* Ear training: each bar is one question. Nothing is drawn; the app plays the bar and you play it back. */
function noRepeatPicks(pool, count) {
  const out = [];
  while (out.length < count) {
    const n = pick(pool);
    if (pool.length < 2 || n !== out[out.length - 1]) out.push(n);
  }
  return out;
}
const EAR = { display: 'ear', reference: [60] };

function genEarNotes(pool, { count = 10, refEach = true } = {}) {
  const rh = noRepeatPicks(pool, count).map(n => n + 'h').join(' | ');
  return { ...EAR, refEach, score: makeScore({ rh }) };
}

function genEarMelody(len, { count = 8, pool = scaleRun('C', 4, 5), first = null } = {}) {
  const bars = [];
  for (let i = 0; i < count; i++) {
    const notes = noRepeatPicks(pool, len);
    if (first) notes[0] = first;
    bars.push(notes.map(n => n + 'q').join(' '));
  }
  return { ...EAR, refEach: !first, score: makeScore({ rh: bars.join(' | ') }) };
}

function genEarChords(roots, { count = 10, minorShare = 0.5 } = {}) {
  const bars = [];
  for (let i = 0; i < count; i++) {
    const root = pick(roots);
    const isMin = root !== 'Ab' && Math.random() < minorShare;
    bars.push(`${stackUp(triad(root, isMin), 3).join('+')}w"${pretty(root)}_${isMin ? 'minor' : 'major'}"`);
  }
  return { ...EAR, reference: null, matchPc: true, score: makeScore({ rh: bars.join(' | ') }) };
}

function genEarProgression(count = 10) {
  const ch = lhProgression('C', 3);
  const bars = [];
  for (let i = 0; i < count; i++) { const p = pick(['I', 'IV', 'V7']); bars.push(`${ch[p].join('+')}w"${p}"`); }
  return { ...EAR, reference: ch.I.map(midiOf), refEach: true, matchPc: true, score: makeScore({ rh: bars.join(' | ') }) };
}

const THEORY = {
  ear: { title: 'Training your ear', html: `
    <p>Few people have perfect pitch, but everyone can learn <b>relative pitch</b>: hearing a note in relation to one you know. That is why the app plays a reference C first.</p>
    <ul><li><b>Sing or hum</b> the note before you look for it. If you can sing it, you can find it.</li>
    <li>Ask: is it higher or lower than C? Near or far? Each note of the scale has its own feel: E sounds settled, B pulls up to C.</li>
    <li>Guess freely. A wrong key costs nothing and teaches you what that note sounds like. After three misses, the keyboard shows the answer.</li></ul>` },
  earChords: { title: 'Hearing chords', html: `
    <p><b>Major</b> chords sound bright and settled. <b>Minor</b> chords sound darker or sadder. Only the middle note differs, by one half step.</p>
    <p>Find the lowest note (the root) first. Then try the major chord on it. If that sounds wrong, lower the middle note.</p>
    <p>In a key, <b>I</b> feels like home, <b>IV</b> like moving away, and <b>V7</b> like tension that wants to go back to I.</p>` },
  staff: { title: 'The grand staff', html: `
    <p>Piano music uses two staves joined by a brace. The <b>treble clef</b> (top) is usually the right hand. The <b>bass clef</b> (bottom) is usually the left hand.</p>
    <p><b>Middle C</b> (C4) sits on a short ledger line between the staves. It is the C nearest the middle of the keyboard.</p>
    <ul><li>Treble lines, bottom to top: E G B D F. Spaces: F A C E.</li>
    <li>Bass lines, bottom to top: G B D F A. Spaces: A C E G.</li></ul>
    <p>Learn a few landmark notes (treble G on line 2, middle C, bass F on line 4). Read other notes as steps (line to space) or skips (line to line) from a landmark. Speed comes from recognising patterns, not counting.</p>` },
  ledger: { title: 'Ledger lines', html: `
    <p>Short <b>ledger lines</b> extend the staff up or down. Middle C is one ledger line below the treble staff <i>and</i> one above the bass staff: the same key, written in two places.</p>
    <p>Just below the treble staff: D4 (space under the bottom line), C4 (1 ledger line), B3, A3 (2 lines). Above the treble staff: G5 (space), A5 (1 line), B5, C6 (2 lines).</p>` },
  accidentals: { title: 'Sharps, flats and naturals', html: `
    <p>A <b>sharp ♯</b> raises a note by one half step (the very next key to the right, often black). A <b>flat ♭</b> lowers it one half step. A <b>natural ♮</b> cancels a sharp or flat.</p>
    <p>An accidental lasts until the end of the bar, for that line or space only. The next bar starts fresh.</p>
    <p>E♯ is F, and C♭ is B: not every sharp or flat is a black key.</p>` },
  keysig: { title: 'Key signatures', html: `
    <p>A <b>key signature</b> at the start of each line lists the sharps or flats that apply to every such note, in every octave, for the whole piece.</p>
    <ul><li>Sharps always come in the order F C G D A E B. The key is a half step above the last sharp. G major: F♯. D major: F♯ C♯. A major: F♯ C♯ G♯.</li>
    <li>Flats always come in the order B E A D G C F. The key is the second-last flat. F major has one flat (B♭). B♭ major: B♭ E♭. E♭ major: B♭ E♭ A♭.</li></ul>
    <p>Before you play, say the key signature out loud, for example "F sharp, C sharp".</p>` },
  fingers: { title: 'Finger numbers and five-finger positions', html: `
    <p>Both hands number fingers from the thumb: <b>1</b> thumb, 2 index, 3 middle, 4 ring, <b>5</b> little finger.</p>
    <p>A <b>five-finger position</b> puts one finger on each of five neighbouring white keys (plus black keys the key needs). In C position the right thumb is on middle C. The left little finger is on the C an octave lower, so the left thumb is on G.</p>
    <p>Keep your fingers curved and your wrist level. Look at the music, not your hands. The position does the finding for you.</p>` },
  rhythm: { title: 'Note values and counting', html: `
    <p>In 4/4 time there are four quarter-note beats per bar. Count out loud: "1 2 3 4".</p>
    <ul><li>Whole note = 4 beats, half note = 2, quarter = 1, eighth = ½ (count "1 & 2 &").</li>
    <li>A <b>dot</b> adds half the value again: a dotted quarter is 1½ beats, usually followed by an eighth.</li>
    <li>Rests are silences of the same lengths. Keep counting through them.</li></ul>
    <p>In 3/4 time there are three beats per bar (a waltz or minuet).</p>` },
  together: { title: 'Playing hands together', html: `
    <p>The brain learns two hands by building one combined pattern, not by splitting attention. So:</p>
    <ul><li>Go <b>slow</b> enough to play without stopping. Wait mode is your friend.</li>
    <li>Read <b>vertically</b>: at each beat, look at what both hands play together.</li>
    <li>The left hand often holds or repeats. Let it be the anchor and let the right hand move.</li>
    <li>If one spot keeps failing, loop just that bar.</li></ul>` },
  intervals: { title: 'Intervals', html: `
    <p>An <b>interval</b> is the distance between two notes, counted by letter names including both ends. C to E is a 3rd (C D E). C to G is a 5th.</p>
    <p>On the staff: 2nds are line-to-space neighbours. 3rds are line-to-line (or space-to-space). 5ths skip two lines. You can see the shape without naming each note.</p>` },
  triads: { title: 'Triads', html: `
    <p>A <b>triad</b> is three notes stacked in 3rds: root, 3rd and 5th. In root position it looks like a snowman: line-line-line or space-space-space.</p>
    <ul><li><b>Major</b>: root + 4 half steps + 3 half steps (C E G). Sounds bright.</li>
    <li><b>Minor</b>: root + 3 half steps + 4 half steps (C E♭ G). Sounds darker.</li></ul>
    <p>Use fingers 1-3-5 (right hand) or 5-3-1 (left hand).</p>` },
  inversions: { title: 'Inversions', html: `
    <p>An inversion uses the same three notes with a different one at the bottom. C major: C-E-G (root position), E-G-C (1st inversion), G-C-E (2nd inversion).</p>
    <p>A chord symbol like C/E means "C major with E in the bass". Inversions let the hand move less between chords.</p>` },
  progression: { title: 'I – IV – V', html: `
    <p>Chords are numbered by the scale note they are built on. In C major: I = C, IV = F, V = G. Most folk and pop songs can be played with these three.</p>
    <p>Beginner left-hand positions keep the thumb almost still: I = C-E-G, IV = C-F-A, V7 = B-F-G. Only one or two fingers move.</p>
    <p>The <b>circle of fifths</b> (C G D A E B, and C F B♭ E♭ A♭) orders keys by how many sharps or flats they have. Neighbours share most of their notes.</p>` },
  technique: { title: 'Technique exercises', html: `
    <p>These patterns train the fingers, not the eyes. The same bar repeats so you can stop reading and listen to how even it sounds.</p>
    <ul><li><b>Slow and even</b> beats fast and bumpy. Every note equally loud, every gap equally long.</li>
    <li>Keep your fingers curved and your wrist loose. If your hand gets tense, stop and shake it out.</li>
    <li>Start in <b>Wait for me</b> to learn the notes, then use <b>In tempo</b>. Raise the tempo by 5 only when it feels easy.</li></ul>` },
  hanon: { title: 'Hanon No. 1', html: `
    <p>Charles-Louis Hanon wrote these exercises in 1873 and pianists still use them. The same eight-note shape climbs one white key per bar, then comes back down.</p>
    <p>Your hand keeps its shape and shifts as a unit. Fingers 4 and 5 are the weakest; listen for them.</p>` },
  scales: { title: 'Scales', html: `
    <p>A major scale follows the pattern whole-whole-half-whole-whole-whole-half steps. On C that uses only white keys.</p>
    <p>Right hand C, G, D, A and E major: 1 2 3, <b>thumb under</b> to 1 2 3 4 5. Left hand going up: 5 4 3 2 1, <b>finger 3 crosses over</b>, 3 2 1. Going down reverses it. F major right hand is 1 2 3 4, 1 2 3 4, because of the B♭.</p>
    <p>Pass the thumb smoothly without moving your elbow. Speed comes later.</p>` },
};
