    for (let m = this.lo; m <= this.hi; m++) if (!isBlack(m)) whites.push(m);
    const W = Math.max(300, this.el.clientWidth || 800);
    const ww = W / whites.length, wh = Math.min(150, Math.max(70, ww * 5)), bw = ww * 0.6, bh = wh * 0.62;
    let s = `<svg viewBox="0 0 ${W} ${wh}" height="${wh}">`;
    whites.forEach((m, i) => {
      s += `<rect class="k w" data-midi="${m}" x="${i * ww}" y="0" width="${ww}" height="${wh}" rx="3"/>`;
      if (mod(m, 12) === 0 && ww > 11) s += `<text class="klabel" x="${i * ww + ww / 2}" y="${wh - 6}" text-anchor="middle">${m === 60 ? '●C4' : 'C' + (m / 12 - 1)}</text>`;
    });
    whites.forEach((m, i) => {
      if (m + 1 <= this.hi && isBlack(m + 1)) s += `<rect class="k b" data-midi="${m + 1}" x="${(i + 1) * ww - bw / 2}" y="0" width="${bw}" height="${bh}" rx="2"/>`;
    });
    this.el.innerHTML = s + '</svg>';
    fitDock();
    this.rects = {};
    for (const r of this.el.querySelectorAll('rect')) this.rects[r.dataset.midi] = r;
    for (let m = this.lo; m <= this.hi; m++) this.paint(m);
  },
  paint(m) {
    const r = this.rects[m];
    if (!r) return;
    let cls = 'k ' + (isBlack(m) ? 'b' : 'w');
    if (this.hints[m]) cls += ' hint-' + this.hints[m];
    if (this.down.has(m)) cls += ' down';
    if (this.flashes[m]) cls += ' ' + this.flashes[m];
    r.setAttribute('class', cls);
  },
  setDown(m, v) {
    if (v) this.down.add(m); else this.down.delete(m);
    if (!v && this.flashes[m] === 'bad' && performance.now() - this.flashAt[m] >= 350) delete this.flashes[m];
    this.paint(m);
  },
  /** Feedback shows for at least 350 ms; a wrong key stays red for as long as it is held. */
  flash(m, cls) {
    this.flashes[m] = cls; this.flashAt[m] = performance.now(); this.paint(m);
    clearTimeout(this['t' + m]);
    this['t' + m] = setTimeout(() => { if (cls === 'bad' && this.down.has(m)) return; delete this.flashes[m]; this.paint(m); }, 350);
  },
  setHints(list) {
    const old = Object.keys(this.hints);
    this.hints = {};
    for (const { midi, hand } of list) this.hints[midi] = hand;
    for (const m of old) this.paint(+m);
    for (const m of Object.keys(this.hints)) this.paint(+m);
  },
};

/* =========================================================================
   Notation (VexFlow)
   ========================================================================= */
const COLORS = { current: '#2563eb', ok: '#16a34a', late: '#d97706', err: '#d97706', bad: '#dc2626', inactive: '#b0b0b8' };
const vfKey = name => { const p = parsePitch(name); return `${p.letter.toLowerCase()}${p.acc}/${p.oct}`; };

// The grand-staff brace is drawn ~15 px left of the staves, so they need room on the left.
const PAD_L = 28;
function renderScore(wrap, score, { current = new Set(), cursorEvents = [] } = {}) {
  const VF = Vex.Flow;
  fitScoreHeight(wrap);
  // Keep the old drawing until the new one is in place: emptying the container first makes the
  // page shrink for a moment, which resets both this box's and the window's scroll position.
  const prevScroll = wrap.scrollTop;
  const old = [...wrap.childNodes];
  const div = h('div');
  wrap.append(div);
  const LW = Math.max(wrap.clientWidth || 800, 620);
  const grand = score.staves === 'grand', hasT = score.staves !== 'bass', hasB = score.staves !== 'treble';
  const sysH = grand ? 250 : 150;
  const keyN = Math.abs(KEY_COUNT[score.key] || 0);
  const header = 45 + keyN * 11;

  const minW = m => {
    const n = Math.max(m.rh.length, m.lh.length);
    const accs = [...m.rh, ...m.lh].filter(e => e.names && e.names.some(x => /[#b]/.test(x.slice(1)))).length;
    return 60 + n * 30 + accs * 8;
  };
  const lines = [];
  let line = [], used = 0;
  score.measures.forEach((m, i) => {
    const w = minW(m) + (line.length ? 0 : header + (i === 0 ? 30 : 0));
    if (line.length && (used + w > LW - PAD_L - 10 || line.length >= 4)) {
      lines.push(line); line = []; used = 0;
      used += minW(m) + header;
    } else used += w;
    line.push(i);
  });
  if (line.length) lines.push(line);

  const LH = lines.length * sysH + 10;
  const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
  renderer.resize(LW, LH);
  const ctx = renderer.getContext();
  const lastIdx = score.measures.length - 1;
  const [num, den] = [score.num, score.den];
  const cursorRects = [];

  lines.forEach((idxs, li) => {
    const y = 5 + li * sysH;
    const widths = idxs.map((i, j) => minW(score.measures[i]) + (j === 0 ? header + (i === 0 ? 30 : 0) : 0));
    const total = widths.reduce((a, b) => a + b, 0);
    const stretch = li === lines.length - 1 && total < (LW - PAD_L - 10) * 0.6 ? 1 : (LW - PAD_L - 10) / total;
    let x = PAD_L;
    idxs.forEach((mi, j) => {
      const m = score.measures[mi];
      const w = widths[j] * stretch;
      const staves = [];
      const mk = (clef, yy) => {
        const s = new VF.Stave(x, yy, w);
        if (j === 0) { s.addClef(clef).addKeySignature(score.key); if (mi === 0) s.addTimeSignature(score.time); }
        if (mi === lastIdx) s.setEndBarType(VF.Barline.type.END);
        if (score.numbers && clef === (hasT ? 'treble' : 'bass') && j === 0) s.setMeasure(m.number);
        return s;
      };
      const sT = hasT ? mk('treble', y) : null;
      const sB = hasB ? mk('bass', grand ? y + 110 : y) : null;
      const pairs = [];
      if (sT) pairs.push([sT, m.rh, 'treble']);
      if (sB) pairs.push([sB, m.lh, 'bass']);
      const sx = Math.max(...pairs.map(([s]) => s.getNoteStartX()));
      for (const [s] of pairs) { s.setNoteStartX(sx); s.setContext(ctx).draw(); staves.push(s); }
      if (grand) {
        if (j === 0) {
          new VF.StaveConnector(sT, sB).setType(VF.StaveConnector.type.BRACE).setContext(ctx).draw();
          new VF.StaveConnector(sT, sB).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(ctx).draw();
        }
        new VF.StaveConnector(sT, sB).setType(mi === lastIdx ? VF.StaveConnector.type.BOLD_DOUBLE_RIGHT : VF.StaveConnector.type.SINGLE_RIGHT).setContext(ctx).draw();
      }

      const voices = [], beams = [];
      for (const [stave, evs, clef] of pairs) {
        const notes = evs.map(ev => makeNote(VF, ev, clef, score.key, current));
        applyAccidentals(VF, evs, notes, score.key);
        notes.forEach(n => n.setStave(stave));
        const v = new VF.Voice({ num_beats: num, beat_value: den });
        v.setMode(VF.Voice.Mode.SOFT);
        v.addTickables(notes);
        voices.push([v, stave]);
        if (evs.some(e => (e.dur === 'e' || e.dur === 's') && !e.ghost)) {
          try { beams.push(...VF.Beam.generateBeams(notes, { groups: VF.Beam.getDefaultBeamGroups(score.time) })); } catch (e) { /* unbeamed is still readable */ }
        }
      }
      const fmt = new VF.Formatter();
      voices.forEach(([v]) => fmt.joinVoices([v]));
      fmt.format(voices.map(([v]) => v), Math.max(20, x + w - sx - 15));
      voices.forEach(([v, s]) => v.draw(ctx, s));
      beams.forEach(b => b.setContext(ctx).draw());

      for (const ev of cursorEvents) {
        if (ev._vf && [...m.rh, ...m.lh].includes(ev)) cursorRects.push({ x: ev._vf.getAbsoluteX(), y });
      }
      for (const ev of [...m.rh, ...m.lh]) ev._line = li;
      x += w;
    });
  });

  // Ties across a line break are drawn as two halves: one leaving, one arriving.
  for (const ev of allEvents(score)) {
    const nx = ev.tieTo;
    if (!nx || !ev._vf || !nx._vf) continue;
    const idx = ev.keys.map((_, i) => i);
    const tie = ev._line === nx._line
      ? [{ first_note: ev._vf, last_note: nx._vf, first_indices: idx, last_indices: idx }]
      : [{ first_note: ev._vf, first_indices: idx }, { last_note: nx._vf, last_indices: idx }];
    for (const t of tie) new VF.StaveTie(t).setContext(ctx).draw();
  }
  const svg = div.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${LW} ${LH}`);
  svg.setAttribute('width', '100%');
  svg.removeAttribute('height');
  svg.style.height = 'auto';
  old.forEach(n => n.remove());
  if (cursorRects.length) {
    const cx = Math.min(...cursorRects.map(r => r.x)), cy = cursorRects[0].y;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', cx - 7); r.setAttribute('y', cy + 25);
    r.setAttribute('width', 26); r.setAttribute('height', sysH - 60);
    r.setAttribute('rx', 5); r.setAttribute('fill', 'rgba(37,99,235,0.12)');
    svg.insertBefore(r, svg.firstChild);
    const scale = (svg.clientWidth || LW) / LW;
    wrap.scrollTop = prevScroll;
    // Keep the current row at the top, so the next row is already in view while you play this one.
    const target = clamp(cy * scale - 10, 0, Math.max(0, wrap.scrollHeight - wrap.clientHeight));
    if (Math.abs(target - wrap.scrollTop) > 4) wrap.scrollTo({ top: target, behavior: 'smooth' });
  } else wrap.scrollTop = prevScroll;
}

/** Size the score box to the space between its top and the fixed keyboard, so the page itself never needs to scroll. */
function fitScoreHeight(wrap) {
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  // Use main's actual bottom padding (set from the dock height) so the page ends exactly at the window edge.
  const pad = parseFloat(getComputedStyle(document.querySelector('main')).paddingBottom) || 0;
  wrap.style.maxHeight = Math.max(240, Math.floor(window.innerHeight - top - pad) - 1) + 'px';
}

// Staff position (and demo pitch) for pitchless rhythm notes and rests.
const RHYTHM_NOTE = { rh: 'B4', lh: 'D3' };
// VexFlow accepts w/h/q as names but needs numbers for shorter notes.
const VF_DUR = { w: 'w', h: 'h', q: 'q', e: '8', s: '16' };
function makeNote(VF, ev, clef, key, current) {
  const restKey = vfKey(clef === 'treble' ? RHYTHM_NOTE.rh : RHYTHM_NOTE.lh);
  const d = VF_DUR[ev.dur] + (ev.dots ? 'd' : '');
  let n;
  if (ev.ghost) n = new VF.GhostNote({ duration: d });
  else if (ev.rest) n = new VF.StaveNote({ clef, keys: [restKey], duration: (ev.fullBar ? 'w' : d) + 'r', align_center: !!ev.fullBar });
  else n = new VF.StaveNote({ clef, keys: ev.any ? [restKey] : ev.names.map(vfKey), duration: d, auto_stem: true });
  if (ev.dots && !ev.ghost && !ev.fullBar) VF.Dot.buildAndAttach([n], { all: true });
  if (!ev.ghost && !ev.rest) {
    const c = ev.inactive ? COLORS.inactive : ev.result ? COLORS[ev.result] : current.has(ev) ? COLORS.current : null;
    if (c) n.setStyle({ fillStyle: c, strokeStyle: c });
    const top = VF.Annotation.VerticalJustify.TOP, bottom = VF.Annotation.VerticalJustify.BOTTOM;
    const fingerSide = clef === 'treble' ? top : bottom, otherSide = clef === 'treble' ? bottom : top;
    if (settings.showFingers && ev.fingers && ev.fingers.length === 1) {
      n.addModifier(new VF.Annotation(String(ev.fingers[0])).setFont('Arial', 11, 'bold').setVerticalJustification(fingerSide), 0);
    }
    if (ev.label) n.addModifier(new VF.Annotation(pretty(ev.label)).setFont('Arial', 12).setVerticalJustification(otherSide), 0);
    else if (settings.showNames && ev.names) {
      n.addModifier(new VF.Annotation(ev.names.map(x => pretty(x.replace(/\d/, ''))).join(' ')).setFont('Arial', 10).setVerticalJustification(otherSide), 0);
    }
  }
  ev._vf = n;
  return n;
}

/** Accidentals: show one only when the note differs from the key signature or an earlier accidental in the bar. */
function applyAccidentals(VF, evs, notes, key) {
  const sig = keyAccMap(key);
  const state = {};
  evs.forEach((ev, i) => {
    if (!ev.names) return;
    ev.names.forEach((name, k) => {
      const p = parsePitch(name);
      const slot = p.letter + p.oct;
      const cur = slot in state ? state[slot] : sig[p.letter];
      if (p.acc !== cur) {
        notes[i].addModifier(new VF.Accidental(p.acc === '' ? 'n' : p.acc), k);
        state[slot] = p.acc;
      }
    });
  });
}

/* =========================================================================
   Drill engine
   ========================================================================= */
let D = null;          // the running drill, or null
let session = null;    // today's suggested session while working through it

/** True when every generated exercise is the same, so "New exercise" would change nothing. */
function isFixed() { return D.level.fixed ?? !!D.track.fixed; }
function nextExerciseBtn(cls = '') {
  return D.idx + 1 < D.track.levels.length ? h('button', { class: cls, onclick: () => openLevel(D.track.id, D.idx + 1), title: 'Piano: C1' }, 'Next exercise →', pkey('C1')) : null;
}
const pkey = name => h('span', { class: 'pkey', 'aria-hidden': 'true' }, name);
/** Every piano shortcut on the exercise page, including the ones without a button. */
function pianoKeysLegend() {
  const items = [['A0', 'Restart'], ['A♯0', D.ex.display === 'ear' ? 'Play again' : 'Listen'], ['B0', 'Previous exercise'], ['C1', 'Next exercise'], ['C8', 'Navigate mode']];
  if (D.ex.display === 'label') items.splice(1, 1);
  return h('div', { class: 'pkeys muted small' }, 'On the piano:', items.map(([k, what]) => h('span', {}, pkey(k), what)));
}

function openLevel(trackId, idx) {
  echoStop();
  stopRun();
  const track = TRACK_BY_ID[trackId];
  const level = track.levels[idx];
  D = { track, level, idx, key: levelKey(trackId, level),
    modes: level.modes || ['wait', 'tempo'], bpm: level.bpm || 70,
    hands: 'both', from: 1, to: null, accompany: true };
  D.mode = D.modes[0];
  const rec = Store.level(D.key);
  if (rec.bestTempo && D.modes.includes('tempo')) D.bpm = rec.bestTempo;
  currentView = 'drill';
  newExercise(true);
}

function newExercise(fresh) {
  stopRun();
  if (fresh || !D.base) D.base = D.level.gen();
  const n = D.base.score.measures.length;
  if (D.to == null || D.to > n) D.to = n;
  D.from = clamp(D.from, 1, D.to);
  const score = D.level.piece ? sliceScore(D.base.score, D.from, D.to) : D.base.score;
  D.ex = { ...D.base, score };
  resetRun();
  renderView();
}

function resetRun() {
  for (const ev of allEvents(D.ex.score)) delete ev.result;
  D.steps = buildSteps(D.ex.score, D.hands);
  D.i = 0; D.errors = 0; D.wrong = 0; D.clean = 0; D.times = [];
  D.running = null; D.finished = null; D.startedAt = null; D.lastT = null;
  D.earStarted = false; D.reveal = null; D.earBusyUntil = 0; clearTimeout(D.earTimer);
  for (const s of D.steps) { s.err = false; s.errs = 0; s.done = false; for (const e of s.expect) { e.hit = false; e.dt = null; } }
  const notes = allEvents(D.ex.score).filter(e => e.keys).flatMap(e => e.keys);
  if (D.ex.display === 'label') Keyboard.setRange(48, 84);
  else if (!notes.length) Keyboard.setRange(48, 72);
  else Keyboard.setRange(Math.min(...notes) - 2, Math.max(...notes) + 2);
  if (D.mode === 'wait') { D.running = 'wait'; }
  updateHints();
}

function stopRun() {
  if (!D) return;
  cancelAnimationFrame(D.raf);
  clearTimeout(D.earTimer);
  Sound.stopAll();
  D.running = null;
  Keyboard.setHints([]);
}

function curStep() { return D && D.steps[D.i]; }

function updateHints() {
  if (!D) return Keyboard.setHints([]);
  const st = curStep();
  const show = D.running === 'wait' && st && (D.ex.display === 'ear'
    ? settings.hints !== 'never' && st.errs >= 3
    : settings.hints === 'always' || (settings.hints === 'after-error' && st.err));
  if (!show) return Keyboard.setHints([]);
  Keyboard.setHints(st.expect.filter(e => !e.hit && !e.any).map(e => ({ midi: D.ex.matchPc ? 60 + mod(e.midi, 12) : e.midi, hand: e.hand })));
}

// The lowest keys, far below any exercise. In Echo, A0 means "play again" and B0 "easier".
const DRILL_KEYS = { 21: 'restart', 22: 'listen', 23: 'prev', 24: 'next' };

function onInput(ev) {
  if (Nav.handle(ev)) return;
  const action = currentView === 'drill' && D && DRILL_KEYS[ev.midi];
  if (action) {
    if (ev.type !== 'on') return;
    const to = D.idx + (action === 'next' ? 1 : -1);
    if (action === 'restart') restartRun();
    else if (action === 'listen') listen();
    else if (to >= 0 && to < D.track.levels.length) openLevel(D.track.id, to);
    return;
  }
  if (currentView === 'record') return recNote(ev);
  if (currentView === 'echo' && ev.type === 'on') return echoNote(ev);
  if (!D || currentView !== 'drill' || ev.type !== 'on') return;
  if (D.running === 'wait') waitNote(ev);
  else if (D.running === 'tempo') tempoNote(ev);
}

function earPlay(withRef) {
  const st = curStep();
  if (!st) return;
  const first = !D.earStarted;
  D.earStarted = true;
  const mpb = 60000 / D.bpm;
  let t = performance.now() + 150;
  if (withRef && D.ex.reference) {
    for (const m of D.ex.reference) Sound.tone(m, t, 800);
    t += 1200;
  }
  const bar = D.steps.filter(s => s.bar === st.bar).flatMap(s => s.events);
  const base = st.bar * D.ex.score.barBeats;
  let end = t;
  for (const ev of bar) {
    const at = t + (ev.start - base) * mpb, len = ev.beats * mpb * 0.9;
    for (const m of ev.keys) Sound.tone(m, at, len);
    end = Math.max(end, at + len);
  }
  // Ignore keys while the question plays, so playing along (or the mic hearing it) doesn't count.
  D.earBusyUntil = end - 100;
  if (first) renderView(); else drawDrill();
}

function earReveal(bar) {
  const steps = D.steps.filter(s => s.bar === bar);
  const evs = steps.flatMap(s => s.events);
  const text = evs.some(e => e.label) ? evs.map(e => e.label).join(' → ') : evs.map(e => pretty(e.names.join(' '))).join('  ');
  D.reveal = { text, ok: steps.every(s => !s.err) };
}

function waitNote(ev) {
  const st = curStep();
  if (!st) return;
  // Arrival time, not ev.t: Bluetooth MIDI timestamps can lag real time.
  if (D.ex.display === 'ear' && (!D.earStarted || performance.now() < D.earBusyUntil)) return;
  if (D.startedAt == null) { D.startedAt = ev.t; D.lastT = ev.t; }
  const e = st.expect.find(x => !x.hit && entryMatches(x, ev.midi, D.ex));
  if (e) {
    e.hit = true;
    Keyboard.flash(ev.midi, 'good');
    if (st.expect.every(x => x.hit)) {
      st.done = true;
      if (!st.err) D.clean++;
      for (const x of st.events) x.result = st.err ? 'err' : 'ok';
      D.times.push(ev.t - D.lastT);
      D.lastT = ev.t;
      D.i++;
      if (D.ex.display === 'ear' && (D.i >= D.steps.length || D.steps[D.i].bar !== st.bar)) {
        earReveal(st.bar);
        if (D.i < D.steps.length) {
          D.earBusyUntil = Infinity;
          D.earTimer = setTimeout(() => earPlay(D.ex.refEach), 1100);
        }
      }
      if (D.i >= D.steps.length) return finishRun();
    }
  } else if (!st.expect.some(x => entryMatches(x, ev.midi, D.ex))) {
    Keyboard.flash(ev.midi, 'bad');
    D.wrong++;
    st.err = true;
    st.errs++;
  }
  updateHints();
  drawDrill();
}

function startTimeline(demo) {
  stopRun();
  resetRun();
  Sound.ctx();
  const mpb = 60000 / D.bpm;
  const bar = D.ex.score.barBeats;
  const countIn = demo ? 0 : bar;
  const t0 = performance.now() + 500 + countIn * mpb;
  const totalBeats = D.ex.score.measures.length * bar;
  D.t0 = t0; D.mpb = mpb; D.running = demo ? 'demo' : 'tempo'; D.statusShown = null; D.demoHintKey = null;
  D.endT = t0 + totalBeats * mpb + settings.okMs + 100;
  D.startedAt = performance.now();
  for (let b = -countIn; b < totalBeats; b++) Sound.click(t0 + b * mpb, mod(b, bar) === 0);
  // One tone per pitch and onset, as long as the longest note: on a MIDI piano the shorter
  // copy's note-off would otherwise cut the longer one.
  const tones = new Map();
  for (const ev of allEvents(D.ex.score)) {
    if (ev.rest || ev.ghost || ev.tiedFrom || !(demo || (ev.inactive && D.accompany))) continue;
    // Rhythm notes have no pitch; demo them on a fixed note per hand.
    const keys = ev.any ? [midiOf(RHYTHM_NOTE[ev.hand])] : ev.keys;
    let beats = ev.beats;
    for (let t = ev.tieTo; t; t = t.tieTo) beats += t.beats;
    for (const m of keys) {
      const k = `${m}@${ev.start}`;
      tones.set(k, { m, start: ev.start, beats: Math.max(beats, tones.has(k) ? tones.get(k).beats : 0) });
    }
  }
  for (const { m, start, beats } of tones.values()) Sound.tone(m, t0 + start * mpb, beats * mpb);
  for (const s of D.steps) s.time = t0 + s.start * mpb + settings.latencyMs;
  D.cursor = -1;
  D.raf = requestAnimationFrame(tick);
  renderView();
}

function stopAndReset() { stopRun(); resetRun(); D.finished = null; renderView(); }
/** The Listen button, or Play again in ear training. Pressing it while the demo plays stops it. */
function listen() {
  if (D.ex.display === 'ear') return earPlay(D.ex.refEach || !D.earStarted);
  if (D.ex.display === 'label' || D.running === 'tempo') return;
  if (D.running === 'demo') stopAndReset(); else startTimeline(true);
}
/** Reset and go straight on: count in for tempo mode, play the first question for ear training. */
function restartRun() {
  if (D.mode === 'tempo') return startTimeline(false);
  stopAndReset();
  if (D.ex.display === 'ear') earPlay(true);
}

function tick() {
  if (!D || !D.running || D.running === 'wait') return;
  const now = performance.now();
  let dirty = false;
  let cur = -1;
  for (let i = 0; i < D.steps.length; i++) { if (D.steps[i].time - 40 <= now) cur = i; else break; }
  if (cur !== D.cursor) { D.cursor = cur; D.i = Math.max(0, cur); dirty = true; }
  if (D.running === 'demo') demoHints(now);
  if (D.running === 'tempo') {
    for (const s of D.steps) {
      if (s.done || s.time + settings.okMs >= now) continue;
      s.done = true;
      const allHit = s.expect.every(e => e.hit);
      const allGood = s.expect.every(e => e.hit && Math.abs(e.dt) <= settings.goodMs);
      for (const ev of s.events) ev.result = !allHit ? 'bad' : allGood ? 'ok' : 'late';
      dirty = true;
    }
  }
  const status = document.getElementById('status');
  if (status && now < D.t0) {
    const left = Math.ceil((D.t0 - now) / D.mpb);
    status.innerHTML = `Count-in: <b>${left}</b>`;
  } else if (status && D.statusShown !== 'play') {
    status.textContent = D.running === 'demo' ? 'Listening…' : 'Play!';
    D.statusShown = 'play';
  }
  if (dirty) drawScoreOnly();
  if (now > D.endT) {
    if (D.running === 'demo') { stopRun(); resetRun(); D.statusShown = null; renderView(); }
    else finishRun();
    return;
  }
  D.raf = requestAnimationFrame(tick);
}

/** While Listen plays, light up the keys that sound right now, in each hand's colour. */
function demoHints(now) {
  const beat = (now - D.t0) / D.mpb;
  const list = [];
  for (const ev of allEvents(D.ex.score)) {
    if (ev.rest || ev.ghost || !(ev.keys || ev.any)) continue;
    // Released a little early, so a repeated note lights up again.
    if (beat < ev.start || beat >= ev.start + ev.beats * 0.9) continue;
    for (const midi of ev.any ? [midiOf(RHYTHM_NOTE[ev.hand])] : ev.keys) list.push({ midi, hand: ev.hand });
  }
  const key = list.map(x => x.midi + x.hand).join();
  if (key === D.demoHintKey) return;
  D.demoHintKey = key;
  Keyboard.setHints(list);
}

function tempoNote(ev) {
  let best = null;
  for (const s of D.steps) {
    const dt = ev.t - s.time;
    if (Math.abs(dt) > settings.okMs) continue;
    const e = s.expect.find(x => !x.hit && entryMatches(x, ev.midi, D.ex));
    if (e && (!best || Math.abs(dt) < Math.abs(best.dt))) best = { e, dt };
  }
  if (best) {
    best.e.hit = true; best.e.dt = best.dt;
    Keyboard.flash(ev.midi, Math.abs(best.dt) <= settings.goodMs ? 'good' : 'down');
  } else {
    D.wrong++;
    Keyboard.flash(ev.midi, 'bad');
  }
}

function finishRun() {
  const mode = D.running;
  cancelAnimationFrame(D.raf);
  D.running = null;
  Keyboard.setHints([]);
  const res = { mode, bpm: D.bpm };
  if (mode === 'wait') {
    res.acc = D.clean / D.steps.length;
    if (D.ex.speed && D.times.length > 1) res.speed = D.times.slice(1).reduce((a, b) => a + b, 0) / (D.times.length - 1) / 1000;
  } else {
    const entries = D.steps.flatMap(s => s.expect);
    const hits = entries.filter(e => e.hit);
    res.acc = hits.length / (entries.length + D.wrong);
    res.hits = hits.length; res.total = entries.length;
    res.good = hits.filter(e => Math.abs(e.dt) <= settings.goodMs).length;
    res.meanDt = hits.length ? hits.reduce((a, e) => a + e.dt, 0) / hits.length : 0;
  }
  res.wrong = D.wrong;
  res.pass = res.acc >= 0.9;
  const secs = D.startedAt ? (performance.now() - D.startedAt) / 1000 : 0;
  // Practising one hand of a piece or a looped section counts as time, not as a level pass.
  const partial = D.level.piece && (D.hands !== 'both' || D.from !== 1 || D.to !== D.base.score.measures.length);
  Store.record(D.key, partial ? { ...res, pass: false } : res, secs);
  res.partial = partial;
  D.finished = res;
  renderView();
}

/* =========================================================================
   Echo: hands-free call and response. The app plays a melody, you play it back,
   and difficulty adapts. Built to be used away from the screen, so all feedback
   is sound and all controls are piano keys.
   ========================================================================= */
const whiteKeys = (lo, hi) => scaleRun('C', 1, 50).filter(n => midiOf(n) >= midiOf(lo) && midiOf(n) <= midiOf(hi));
const allKeys = (lo, hi) => Array.from({ length: midiOf(hi) - midiOf(lo) + 1 }, (_, i) => midiName(midiOf(lo) + i));
const ECHO_STEPS = [
  // Single notes: the 4th octave first, then outwards, then black keys.
  { len: 1, pool: whiteKeys('C4', 'E4') },
  { len: 1, pool: whiteKeys('C4', 'G4') },
  { len: 1, pool: whiteKeys('C4', 'B4') },
  { len: 1, pool: whiteKeys('C4', 'C5') },
  { len: 1, pool: whiteKeys('G3', 'G5') },
  { len: 1, pool: whiteKeys('C3', 'C6') },
  { len: 1, pool: allKeys('C4', 'B4') },
  { len: 1, pool: allKeys('C3', 'C5') },
  // Melodies.
  { len: 2, pool: scaleRun('C', 4, 3), leaps: false },
  { len: 3, pool: scaleRun('C', 4, 3), leaps: false },
  { len: 3, pool: scaleRun('C', 4, 5), leaps: false },
  { len: 4, pool: scaleRun('C', 4, 5), leaps: false },
  { len: 4, pool: scaleRun('C', 4, 5), leaps: true },
  { len: 4, pool: scaleRun('C', 4, 8), leaps: false },
  { len: 5, pool: scaleRun('C', 4, 8), leaps: false },
  { len: 5, pool: scaleRun('C', 4, 8), leaps: true },
  { len: 6, pool: scaleRun('C', 4, 8), leaps: true },
  { len: 5, pool: whiteKeys('G3', 'D5'), leaps: true },
  { len: 6, pool: whiteKeys('G3', 'D5'), leaps: true },
  { len: 4, pool: allKeys('C4', 'C5'), leaps: false },
  { len: 5, pool: allKeys('C4', 'C5'), leaps: true },
  { len: 7, pool: whiteKeys('G3', 'D5'), leaps: true },
  { len: 8, pool: scaleRun('C', 4, 8), leaps: true },
];
// Piano keys used as controls; far from anything a melody uses.
const ECHO_KEYS = { replay: 21, easier: 23 };
const ECHO_REPLAYS_WHEN_IDLE = 2;
let E = null;

function echoMelody(step) {
  const pool = step.pool.map(midiOf);
  let i = rand(pool.length);
  const out = [];
  for (let n = 0; n < step.len; n++) {
    if (n > 0) {
      if (step.leaps) { let j; do { j = rand(pool.length); } while (j === i); i = j; }
      else {
        // Bounce off the edge of the range instead of clamping, which repeated the edge note.
        const d = pick([-1, 1, 1, -2, 2]);
        let j = i + d;
        if (j < 0 || j >= pool.length) j = i - d;
        i = clamp(j, 0, pool.length - 1);
      }
    }
    out.push(pool[i]);
  }
  return out;
}

// Rhythm cells in beats; 'e e' and 'q. e' add two notes at once.
const ECHO_CELLS = [[1], [1], [0.5, 0.5], [2], [1.5, 0.5]];
const BEAT_SYMBOL = { 0.5: '♪', 1: '♩', 1.5: '♩.', 2: '𝅗𝅥' };

/** Note lengths in beats. Without rhythm every note is a quarter. */
function echoDurations(len) {
  if (!settings.echoRhythm) return Array(len).fill(1);
  let out;
  // Reject all-quarter results: the point of the option is to hear a rhythm.
  do {
    out = [];
    while (out.length < len) out.push(...pick(ECHO_CELLS));
    out = out.slice(0, len);
    if (out[len - 1] === 0.5) out[len - 1] = 1;
  } while (len > 2 && out.slice(0, -1).every(d => d === 1));
  return out;
}

/** Compare the gaps between your notes with the melody's, allowing any overall tempo. */
function echoRhythmOk(durs, times) {
  const want = durs.slice(0, -1), got = times.slice(1).map((t, i) => t - times[i]);
  if (want.length < 2) return true;
  const scale = got.reduce((a, b) => a + b, 0) / want.reduce((a, b) => a + b, 0);
  return want.every((d, i) => Math.abs(got[i] / scale - d) <= 0.12 + d * 0.18);
}

function echoStart() {
  Sound.ctx();
  const stored = Store.data.echo;
  // v2 added single-note steps in front, so older saved levels no longer line up.
  const saved = stored && stored.v === 2 ? stored : { level: 0, best: 0 };
  E = { level: clamp(saved.level, 0, ECHO_STEPS.length - 1), best: saved.best, streak: 0, running: true,
    melody: null, pos: 0, fails: 0, busyUntil: 0, timers: [], idleReplays: 0, last: null, startedAt: performance.now() };
  echoNew();
}

function echoStop() {
  if (!E) return;
  E.timers.forEach(clearTimeout);
  Sound.stopAll();
  echoSaveTime();
  E = null;
}

function echoLater(fn, ms) { E.timers.push(setTimeout(() => { if (E && E.running) fn(); }, ms)); }

/** Play notes back to back; returns when the last one ends (performance time). */
function echoPlayNotes(notes, t, noteMs, vel = 80, durs = null) {
  let at = t;
  notes.forEach((m, i) => {
    const len = (durs ? durs[i] : 1) * noteMs;
    Sound.tone(m, at, len * 0.9, vel);
    at += len;
  });
  return at;
}

function echoPlay() {
  E.timers.forEach(clearTimeout); E.timers = [];
  Sound.stopAll();
  const noteMs = 60000 / settings.echoBpm;
  let t = performance.now() + 300;
  // A single C4 got heard as the melody's first note (melodies often start on C), so the
  // reference is a soft, low chord: it sets the key but can't be mistaken for the tune.
  if (settings.echoReference) {
    for (const m of [48, 52, 55]) Sound.tone(m, t, 900, 55);
    E.refUntil = t + 900;
    t += 1600;
  }
  const end = echoPlayNotes(E.melody, t, noteMs, 80, E.durs);
  E.pos = 0; E.times = [];
  const lastOnset = end - E.durs[E.durs.length - 1] * noteMs;
  // Answers often start while the last note still rings, so listen from its onset.
  // The microphone would hear that note itself, so it waits until the melody ends.
  E.busyUntil = Mic.stream ? end - 80 : lastOnset + 120;
  E.state = 'playing';
  if (settings.echoReference) echoLater(renderEcho, E.refUntil - performance.now());
  echoLater(() => { E.state = 'listening'; renderEcho(); }, end - performance.now());
  // No answer at all: replay a couple of times, then wait quietly.
  echoLater(() => { if (E.pos === 0 && E.idleReplays < ECHO_REPLAYS_WHEN_IDLE) { E.idleReplays++; echoPlay(); } }, end - performance.now() + 12000);
  renderEcho();
}

function echoNew() {
  const prev = E.melody ? E.melody.join() : '';
  let tries = 0;
  do { E.melody = echoMelody(ECHO_STEPS[E.level]); } while (E.melody.join() === prev && ++tries < 10);
  E.durs = echoDurations(E.melody.length);
  E.fails = 0; E.idleReplays = 0;
  echoPlay();
}

function echoSaveTime() {
  const secs = (performance.now() - E.startedAt) / 1000;
  E.startedAt = performance.now();
  const d = Store.data.days[today()] = Store.data.days[today()] || { secs: 0, exercises: 0 };
  d.secs += Math.min(secs, 600);
  Store.data.echo = { v: 2, level: E.level, best: E.best };
  Store.save();
}

function echoNote(ev) {
  if (!E || !E.running) return;
  const m = ev.midi;
  if (m === ECHO_KEYS.replay) { E.idleReplays = 0; echoPlay(); return; }
  if (m === ECHO_KEYS.easier) { E.level = Math.max(0, E.level - 1); E.streak = 0; echoCue('down'); echoLater(echoNew, 900); return; }
  // Compare arrival time, not ev.t: Bluetooth MIDI timestamps can lag real time, which made the
  // first answer note look as if it was played during the melody.
  if (performance.now() < E.busyUntil || E.state === 'result') return;
  if (E.state === 'playing') E.state = 'listening';
  const rhythmMiss = m === E.melody[E.pos] && E.pos === E.melody.length - 1 && settings.echoRhythm
    && !echoRhythmOk(E.durs, [...E.times, ev.t]);
  if (m === E.melody[E.pos] && !rhythmMiss) {
    Keyboard.flash(m, 'good');
    E.times.push(ev.t);
    E.pos++;
    if (E.pos < E.melody.length) { renderEcho(); return; }
    E.streak++;
    E.last = { ok: true, melody: E.melody, durs: E.durs };
    const up = E.level < ECHO_STEPS.length - 1;
    if (up) E.level++;
    E.best = Math.max(E.best, E.level);
    E.state = 'result';
    echoCue('ok');
    echoSaveTime();
    echoLater(echoNew, 1500);
  } else {
    Keyboard.flash(m, rhythmMiss ? 'good' : 'bad');
    E.fails++;
    E.streak = 0;
    E.last = { ok: false, rhythm: rhythmMiss, melody: E.melody, durs: E.durs };
    E.state = 'result';
    if (E.fails >= 3) {
      E.level = Math.max(0, E.level - 1);
      echoCue('down');
      echoSaveTime();
      echoLater(echoNew, 1500);
    } else {
      echoCue('bad');
      echoLater(() => { E.idleReplays = 0; echoPlay(); }, 1300);
    }
  }
  renderEcho();
}

function echoCue(kind) {
  const t = performance.now() + 250;
  if (kind === 'ok') echoPlayNotes([72, 76, 79, 84], t, 90, 70);
  else if (kind === 'bad') { Sound.tone(40, t, 350, 70); Sound.tone(41, t, 350, 70); }
  else if (kind === 'down') echoPlayNotes([67, 64, 60], t, 140, 60);
  else if (kind === 'pause') echoPlayNotes([72, 60], t, 200, 60);
}

function echoPause() {
  E.timers.forEach(clearTimeout); E.timers = [];
  E.running = false;
  echoCue('pause');
  echoSaveTime();
  renderEcho();
}

function echoResume() { E.running = true; E.startedAt = performance.now(); echoNew(); }

function renderEcho() { if (currentView === 'echo') renderView(); }

function echoView() {
  Keyboard.setRange(48, 84);
  const root = h('div');
  const step = E ? ECHO_STEPS[E.level] : null;
  root.append(h('div', { class: 'card' },
    h('h2', {}, 'Echo'),
    h('p', { class: 'muted' }, 'The piano plays a soft C chord to set the key, then a melody. Play the melody back. Get it right and the next one is a little harder; three misses and it gets easier. Everything is sound, so you can practise away from the screen.'),
    h('p', { class: 'small' }, h('b', {}, 'Controls on the piano: '), 'lowest key (A0) = play again · B0 = easier · highest key (C8) = pause and navigate.'),
    Midi.out && settings.demoSound === 'piano' ? null : h('p', { class: 'small', style: `color:${COLORS.late}` }, 'No MIDI output: melodies play on this computer, not the piano.'),
    h('div', { class: 'row' },
      !E ? h('button', { class: 'primary', onclick: () => { echoStart(); renderEcho(); } }, '▶ Start')
        : E.running ? h('button', { class: 'primary', onclick: echoPause }, '❚❚ Pause')
          : h('button', { class: 'primary', onclick: echoResume }, '▶ Resume'),
      E && E.running ? h('button', { onclick: () => { E.idleReplays = 0; echoPlay(); } }, '🔊 Play again') : null,
      h('label', { class: 'row' }, 'Tempo', h('input', { type: 'range', min: 50, max: 160, step: 5, value: settings.echoBpm,
        oninput: e => { settings.echoBpm = +e.target.value; Store.save(); e.target.nextSibling.textContent = `${settings.echoBpm} bpm`; } }), h('span', {}, `${settings.echoBpm} bpm`)),
      h('label', { class: 'row small' }, h('input', { type: 'checkbox', checked: settings.echoReference,
        onchange: e => { settings.echoReference = e.target.checked; Store.save(); } }), 'Play a C chord first (sets the key)'),
      h('label', { class: 'row small', title: 'Melodies get mixed note lengths, and your rhythm must match (any tempo).' },
        h('input', { type: 'checkbox', checked: settings.echoRhythm,
          onchange: e => { settings.echoRhythm = e.target.checked; Store.save(); if (E && E.running) echoNew(); } }), 'Rhythm'))));
  if (E) {
    const statusText = !E.running ? 'Paused' : E.state === 'playing' ? (performance.now() < (E.refUntil || 0) ? 'Key chord…' : 'Listen…') : E.state === 'result' ? (E.last.ok ? '✓ Correct' : E.last.rhythm ? 'Right notes, rhythm off' : 'Not quite, listen again') : `Your turn · note ${E.pos + 1} of ${E.melody.length}`;
    root.append(h('div', { class: 'card' },
      h('div', { class: 'stats' },
        h('div', {}, h('span', {}, 'Level'), `${E.level + 1} of ${ECHO_STEPS.length}`),
        h('div', {}, h('span', {}, 'Notes'), step.len),
        h('div', {}, h('span', {}, 'Streak'), E.streak),
        h('div', {}, h('span', {}, 'Best level'), E.best + 1)),
      h('div', { class: 'label-card', style: 'color:inherit;padding:20px 0' }, h('div', { class: 'big', style: 'font-size:40px' }, statusText),
        E.last ? h('div', { class: 'sub' }, (E.last.ok ? 'Last melody: ' : 'The melody was: ') + E.last.melody.map((x, i) => pretty(midiName(x)) + (settings.echoRhythm ? ' ' + BEAT_SYMBOL[E.last.durs[i]] : '')).join('  ')) : null)));
  }
  return root;
}

/* =========================================================================
   Record: play along with a metronome; the app writes down what you played.
   Recordings are kept as raw notes in beats, so the notation options can change later.
   ========================================================================= */
const R = { phase: 'idle', raw: [], open: new Map(), timers: [], clickTimer: null, bpm: 80, title: '', loadedId: null, result: null, score: null };
const REC_SPLITS = ['F3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F4', 'G4'];
const REC_KEYS = ['C', 'G', 'D', 'A', 'E', 'F', 'Bb', 'Eb', 'Ab'];
const recBarBeats = () => { const [n, d] = settings.recTime.split('/').map(Number); return n * 4 / d; };

function recStart() {
  recStopSound();
  Sound.ctx();
  R.raw = []; R.open = new Map(); R.result = null; R.score = null; R.loadedId = null; R.title = '';
  R.bpm = settings.recBpm;
  R.mpb = 60000 / R.bpm;
  const bar = recBarBeats();
  R.t0 = performance.now() + 400 + bar * R.mpb;
  R.nextBeat = -bar;
  R.phase = 'countin';
  // Clicks are scheduled a little ahead in a loop, since the length of a take isn't known up front.
  R.clickTimer = setInterval(recClicks, 100);
  recClicks();
  R.timers.push(setTimeout(() => { if (R.phase === 'countin') { R.phase = 'recording'; renderRecord(); } }, R.t0 - performance.now()));
  renderRecord();
}

function recClicks() {
  const bar = recBarBeats(), now = performance.now();
  while (R.t0 + R.nextBeat * R.mpb < now + 400) {
    if (settings.recClick || R.nextBeat < 0) Sound.click(R.t0 + R.nextBeat * R.mpb, mod(R.nextBeat, bar) === 0);
    R.nextBeat++;
  }
  const el = document.getElementById('rec-status');
  if (!el) return;
  if (R.phase === 'countin') el.innerHTML = `Count-in: <b>${Math.ceil((R.t0 - now) / R.mpb)}</b>`;
  else if (R.phase === 'recording') el.innerHTML = `● Recording · bar <b>${Math.floor((now - R.t0) / R.mpb / bar) + 1}</b> · ${R.raw.length + R.open.size} notes`;
}

function recNote(ev) {
  if (R.phase !== 'countin' && R.phase !== 'recording') return;
  // Same offset as tempo mode, so one setting corrects both.
  const beat = (ev.t - settings.latencyMs - R.t0) / R.mpb;
  if (ev.type === 'on') R.open.set(ev.midi, { m: ev.midi, on: beat });
  else if (R.open.has(ev.midi)) {
    const n = R.open.get(ev.midi);
    R.open.delete(ev.midi);
    n.off = beat;
    R.raw.push(n);
  }
}

function recStop() {
  clearInterval(R.clickTimer); R.clickTimer = null;
  R.timers.forEach(clearTimeout); R.timers = [];
  if (R.phase === 'countin' || R.phase === 'recording') {
    const beat = (performance.now() - settings.latencyMs - R.t0) / R.mpb;
    for (const n of R.open.values()) { n.off = beat; R.raw.push(n); }
    R.open.clear();
    R.raw = R.raw.map(n => ({ m: n.m, on: +n.on.toFixed(3), off: +n.off.toFixed(3) })).sort((a, b) => a.on - b.on);
    R.phase = R.raw.some(n => n.on > -settings.recGrid) ? 'done' : 'idle';
    recTranscribe();
  }
  Sound.stopAll();
}

function recStopSound() { Sound.stopAll(); }

function recTranscribe() {
  R.result = R.raw.length ? transcribe(R.raw, { time: settings.recTime, grid: settings.recGrid, key: settings.recKey, split: midiOf(settings.recSplit) }) : null;
  R.score = R.result ? makeScore({ ...R.result, numbers: true }) : null;
  if (!R.result) R.phase = 'idle';
}

function recPlay(asPlayed) {
  Sound.stopAll();
  Sound.ctx();
  const mpb = 60000 / R.bpm, t0 = performance.now() + 300;
  if (asPlayed) {
    for (const n of R.raw) if (n.on > -settings.recGrid) Sound.tone(n.m, t0 + Math.max(0, n.on) * mpb, (n.off - n.on) * mpb);
    return;
  }
  for (const ev of allEvents(R.score)) {
    if (!ev.keys || ev.tiedFrom) continue;
    let beats = ev.beats;
    for (let t = ev.tieTo; t; t = t.tieTo) beats += t.beats;
    for (const m of ev.keys) Sound.tone(m, t0 + ev.start * mpb, beats * mpb);
  }
}

function recSave(asNew) {
  const list = Store.data.recordings;
  const entry = { title: R.title.trim() || `Recording ${new Date().toLocaleString('sv-SE').slice(0, 16)}`, date: today(),
    bpm: R.bpm, time: settings.recTime, grid: settings.recGrid, key: settings.recKey, split: settings.recSplit, raw: R.raw };
  const existing = !asNew && R.loadedId && list.find(r => r.id === R.loadedId);
  if (existing) Object.assign(existing, entry);
  else { entry.id = 'r' + Date.now(); list.push(entry); R.loadedId = entry.id; }
  R.title = entry.title;
  Store.save();
  refreshMine();
  toast('Saved to My recordings');
  renderRecord();
}

function recLoad(rec) {
  recStop();
  Object.assign(settings, { recTime: rec.time, recGrid: rec.grid, recKey: rec.key, recSplit: rec.split });
  R.raw = rec.raw; R.bpm = rec.bpm; R.title = rec.title; R.loadedId = rec.id; R.phase = 'done';
  recTranscribe();
  renderRecord();
  window.scrollTo(0, 0);
}

/** "My recordings" is a track whose levels are the saved recordings, so they open like any piece. */
function refreshMine() {
  const t = TRACK_BY_ID.mine;
  t.levels = Store.data.recordings.map(rec => ({
    id: rec.id, name: rec.title, piece: true, bpm: rec.bpm, desc: `Recorded ${rec.date} at ${rec.bpm} bpm.`,
    gen: () => ({ score: makeScore({ ...transcribe(rec.raw, { time: rec.time, grid: rec.grid, key: rec.key, split: midiOf(rec.split) }), numbers: true }) }),

function renderView() {

/* =========================================================================
   Keep the screen on while playing
   ========================================================================= */
const Wake = {
  lock: null, pending: false,
  /** An open exercise counts even when idle: in wait mode the screen sits still while you read. */
  wanted() {
    return document.visibilityState === 'visible' && ((currentView === 'drill' && !!D) || Nav.playing());
  },
  async update() {
    if (!navigator.wakeLock || this.pending) return;
    if (this.wanted() && !this.lock) {
      this.pending = true;
      try {
        const lock = await navigator.wakeLock.request('screen');
        this.lock = lock;
        // The browser drops the lock when the tab is hidden or the battery is low.
        lock.addEventListener('release', () => { if (this.lock === lock) this.lock = null; this.show(); });
      } catch (e) { /* refused (battery saver, permissions): the chip stays hidden, which is the truth */ }
      this.pending = false;
      if (!this.wanted()) return this.update();
    } else if (!this.wanted() && this.lock) {
      const lock = this.lock;
      this.lock = null;
      lock.release().catch(() => {});
    }
    this.show();
  },
  show() { document.getElementById('chip-awake').hidden = !this.lock; },
};

/* =========================================================================
   URL: the hash names the page, so a reload or the Back button lands in the same place.
     #home  #echo  #record  #theory  #settings  #drill/<track>/<level>
   ========================================================================= */
function currentRoute() {
  if (currentView === 'drill' && D) return `drill/${D.track.id}/${encodeURIComponent(D.level.id)}`;
  return currentView;
}
function syncRoute() {
  const r = '#' + currentRoute();
  // Assigning the hash adds a history entry; openRoute then sees the page already matches and does nothing.
  if (location.hash !== r) location.hash = r;
}
function openRoute() {
  const r = location.hash.slice(1);
  if (r === currentRoute() && document.getElementById('view').childElementCount) return;
  const [view, trackId, rawLevel = ''] = r.split('/');
  const levelId = decodeURIComponent(rawLevel);
  if (view === 'drill') {
    const track = TRACK_BY_ID[trackId];
    const idx = track ? track.levels.findIndex(l => l.id === levelId) : -1;
    if (idx >= 0) { session = null; return openLevel(trackId, idx); }
  }
  go(['echo', 'record', 'theory', 'settings'].includes(view) ? view : 'home');
}

/* =========================================================================
   Navigate the UI from the piano
   ========================================================================= */
// C8 toggles the mode from anywhere; it is never part of an exercise or a melody.
// The other keys sit just below it, so one hand can stay at the top of the piano.
// Press is the black key between one-step back and forward.
const NAV_KEYS = { toggle: 108, sectionNext: 107, next: 105, press: 104, prev: 103, sectionPrev: 101, home: 100 };
const Nav = {
  on: false, el: null, idx: 0,
  targets() {
    return [...document.querySelectorAll('header button, #view button, #view select, #view input[type=checkbox], #kbd-toggle')]
      .filter(el => !el.disabled && el.getClientRects().length);
  },
  playing() {
    if (currentView === 'drill') return !!(D && D.running);
    if (currentView === 'echo') return !!(E && E.running);
    if (currentView === 'record') return R.phase === 'countin' || R.phase === 'recording';
    return false;
  },
  handle(ev) {
    if (ev.midi === NAV_KEYS.toggle) { if (ev.type === 'on') this.set(!this.on); return true; }
    if (!this.on) return false;
    if (ev.type !== 'on') return true;
    if (ev.midi === NAV_KEYS.prev) this.move(-1);
    else if (ev.midi === NAV_KEYS.next) this.move(1);
    else if (ev.midi === NAV_KEYS.sectionPrev) this.moveSection(-1);
    else if (ev.midi === NAV_KEYS.sectionNext) this.moveSection(1);
    else if (ev.midi === NAV_KEYS.press) this.press();
    else if (ev.midi === NAV_KEYS.home) { go('home'); this.focus(this.firstTarget()); }
    return true;
  },
  set(on) {
    this.on = on;
    document.getElementById('chip-nav').hidden = !on;
    if (on) {
      // Pause whatever runs in time, so the clock doesn't count the time spent navigating.
      if (currentView === 'echo' && E && E.running) echoPause();
      else if (currentView === 'drill' && D && D.running && D.running !== 'wait') { stopRun(); resetRun(); renderView(); }
      else if (currentView === 'record' && this.playing()) { recStop(); renderView(); }
      this.focus(this.firstTarget());
      Keyboard.setHints(Object.values(NAV_KEYS).filter(m => m !== NAV_KEYS.toggle).map(midi => ({ midi, hand: 'rh' })));
    } else {
      this.focus(null);
      if (currentView === 'drill') updateHints(); else Keyboard.setHints([]);
    }
  },
  /** The main action of the page, such as Start, rather than the header. */
  firstTarget() {
    const list = this.targets();
    return document.querySelector('#view button.primary:not(:disabled)') || list.find(el => el.closest('#view')) || list[0];
  },
  focus(el) {
    if (this.el) this.el.classList.remove('nav-focus');
    this.el = el || null;
    if (!this.el) return;
    this.el.classList.add('nav-focus');
    this.idx = Math.max(0, this.targets().indexOf(this.el));
    this.el.scrollIntoView({ block: 'nearest' });
  },
  move(d) {
    const list = this.targets();
    if (!list.length) return;
    const i = list.indexOf(this.el);
    this.focus(list[i < 0 ? 0 : mod(i + d, list.length)]);
  },
  /** A card, the header, the keyboard dock, or a top-level block of the page. */
  section(el) {
    const view = document.getElementById('view');
    let top = el;
    while (top.parentElement && top.parentElement.parentElement !== view) top = top.parentElement;
    return el.closest('header, .card, #kbd-dock') || top;
  },
  /** Jump to the first button of the next or previous section. */
  moveSection(d) {
    const list = this.targets();
    if (!list.length) return;
    const n = list.length, sec = el => this.section(el);
    let i = list.indexOf(this.el);
    if (i < 0) return this.focus(list[0]);
    const start = sec(list[i]);
    if (d > 0) {
      let k = 1;
      while (k < n && sec(list[mod(i + k, n)]) === start) k++;
      return this.focus(list[mod(i + k, n)]);
    }
    // Back to the start of the current section first, then one more step back lands in the previous one.
    let k = 1;
    while (k < n && sec(list[mod(i - k, n)]) === start) k++;
    const prev = sec(list[mod(i - k, n)]);
    while (k < n && sec(list[mod(i - k - 1, n)]) === prev) k++;
    this.focus(list[mod(i - k, n)]);
  },
  press() {
    const el = this.el;
    if (!el || !el.isConnected) return this.focus(this.firstTarget());
    const view = currentView, wasPlaying = this.playing();
    if (el.tagName === 'SELECT') {
      el.selectedIndex = mod(el.selectedIndex + 1, el.options.length);
      el.dispatchEvent(new Event('change', { bubbles: true }));
    } else el.click();
    // Starting to play ends the mode, so the next notes count as music.
    if (!wasPlaying && this.playing()) return this.set(false);
    if (currentView !== view) this.focus(this.firstTarget());
  },
  /** A re-render replaces the elements, so find the focused one again by its position. */
  refresh() {
    if (!this.on || (this.el && this.el.isConnected)) return;
    const list = this.targets();
    this.focus(list[clamp(this.idx, 0, list.length - 1)]);
  },
};

function go(v) {

function resultsCard(res) {
  const pct = Math.round(res.acc * 100);
  const stats = [h('div', {}, h('span', {}, 'Accuracy'), `${pct}%`)];
  if (res.speed) stats.push(h('div', {}, h('span', {}, 'Reading speed'), `${res.speed.toFixed(2)} s per note`));
  if (res.mode === 'tempo') {
    stats.push(h('div', {}, h('span', {}, 'Notes hit'), `${res.hits} / ${res.total}`));
    stats.push(h('div', {}, h('span', {}, `Right on time (±${settings.goodMs} ms)`), `${res.good}`));
    const dt = Math.round(res.meanDt);
    stats.push(h('div', {}, h('span', {}, 'Average timing'), Math.abs(dt) < 15 ? 'spot on' : dt < 0 ? `${-dt} ms early` : `${dt} ms late`));
  }
  stats.push(h('div', {}, h('span', {}, 'Wrong notes'), res.wrong));
  let msg;
  if (res.partial) msg = 'Section practice saved. Play the whole piece with both hands to pass the level.';
  else if (res.pass) msg = res.mode === 'wait' && D.modes.includes('tempo') ? 'Passed! Next challenge: try it in tempo.' : 'Passed!';
  else msg = res.mode === 'tempo' ? 'Not quite. Lower the tempo, or practise it in wait mode first.' : 'Not quite. Try again. Accuracy matters more than speed.';
  const inSession = session && session.items[session.n] && session.items[session.n].track === D.track && session.n + 1 < session.items.length;
  return h('div', { class: 'card results ' + (res.pass ? 'pass' : 'fail'), style: 'margin-top:12px' },
    h('div', { class: 'big' }, res.pass ? '✓ ' + msg : msg),
    h('div', { class: 'stats' }, stats),
    h('div', { class: 'row' },
      h('button', { onclick: restartRun }, 'Same again', pkey('A0')),
      !isFixed() && !D.level.piece ? h('button', { class: res.pass ? '' : 'primary', onclick: () => newExercise(true) }, 'New exercise') : null,
      nextExerciseBtn(res.pass && !inSession ? 'primary' : ''),
      inSession ? h('button', { class: 'primary', onclick: () => { session.n++; const it = session.items[session.n]; openLevel(it.track.id, it.idx); } }, 'Next in session →') : null));
}

function drawDrill() {
  drawScoreOnly();
  const status = document.getElementById('status');
  if (!status || !D) return;
  if (D.finished) { status.textContent = ''; return; }
  if (D.running === 'wait') {
    const st = curStep();
    if (D.ex.display === 'ear') {
      const nBars = D.ex.score.measures.length;
      status.innerHTML = !D.earStarted ? 'Press <b>Start</b> to hear the first question.'
        : `Play what you hear · question <b>${Math.min(st.bar + 1, nBars)}</b> / ${nBars}` + (D.wrong ? ` · ${D.wrong} wrong` : '');
      return;
    }
    const what = D.ex.display === 'label' ? 'Play the chord' : D.ex.anyPitch ? 'Tap any key' : 'Play the blue note' + (st && st.expect.length > 1 ? 's' : '');
    status.innerHTML = `${what} · <b>${D.i + 1}</b> / ${D.steps.length}` + (D.wrong ? ` · ${D.wrong} wrong` : '');
  } else if (!D.running) {
    status.textContent = D.mode === 'tempo' ? `Press Start. You get one bar of count-in at ${D.bpm} bpm.` : '';
  }
}

function drawScoreOnly() {
  const wrap = document.getElementById('score');
  if (!wrap || !D) return;
  if (!window.Vex) { wrap.innerHTML = '<p style="padding:16px;color:#b91c1c">Notation library not loaded. See the message at the top.</p>'; return; }
  const st = D.running && D.running !== 'wait' ? D.steps[D.cursor] : curStep();
  if (D.ex.display === 'ear') {
    const nQ = st ? D.steps.filter(s => s.bar === st.bar).length : 0;
    const sub = D.ex.matchPc ? 'Any octave, any inversion' : nQ > 1 ? `${nQ} notes, in order` : 'One note';
    wrap.innerHTML = '';
    wrap.append(h('div', { class: 'label-card' },
      D.reveal ? h('div', { class: 'sub', style: `color:${D.reveal.ok ? COLORS.ok : COLORS.late}` }, (D.reveal.ok ? '✓ ' : 'Got there: ') + D.reveal.text) : h('div', { class: 'sub' }, ' '),
      h('div', { class: 'big' }, D.finished ? '✓' : '?'),
      h('div', { class: 'sub' }, D.finished ? '' : sub)));
    return;
  }
  if (D.ex.display === 'label') {
    const label = st ? st.events[0].label : '✓';
    wrap.innerHTML = '';
    wrap.append(h('div', { class: 'label-card' }, h('div', { class: 'big' }, label), h('div', { class: 'sub' }, 'Any octave, any inversion')));
    return;
  }
  const current = new Set(st && !D.finished ? st.events : []);
  try {
    renderScore(wrap, D.ex.score, { current, cursorEvents: [...current] });
  } catch (e) {
    console.error(e);
    wrap.innerHTML = `<p style="padding:16px;color:#b91c1c">Could not draw this exercise: ${e.message}</p>`;
  }
}

function theoryView() {
  return h('div', {}, h('h2', {}, 'Theory'), h('p', { class: 'muted' }, 'Short notes on what the exercises use. Each card also appears the first time you open a level that needs it.'),
    h('div', { class: 'grid' }, Object.values(THEORY).map(c => h('div', { class: 'card theory' }, h('h3', {}, c.title), h('div', { html: c.html })))));
}

function settingsView() {
  const set = (k, v) => { settings[k] = v; Store.save(); if (k === 'midiOut' || k === 'midiIn') Midi.refresh(); if (k === 'qwerty') qwertyInfo(); if (k === 'showKeys') applyShowKeys(); };
  const sel = (k, opts) => h('select', { onchange: e => set(k, e.target.value) }, opts.map(([v, t]) => h('option', { value: v, selected: settings[k] === v }, t)));
  const chk = k => h('input', { type: 'checkbox', checked: settings[k], onchange: e => set(k, e.target.checked) });
  const numIn = (k, min, max, step = 1) => h('input', { type: 'number', min, max, step, value: settings[k], style: 'width:80px', onchange: e => set(k, +e.target.value) });
  const row = (label, ctl, help) => h('tr', {}, h('td', {}, h('b', {}, label), help ? h('div', { class: 'muted small' }, help) : null), h('td', {}, ctl));
  const importInput = h('input', { type: 'file', accept: 'application/json', hidden: true, onchange: e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || typeof d.levels !== 'object') throw new Error('not a Piano Trainer export');
      localStorage.setItem(STORE_KEY, JSON.stringify(d));
      Store.load(); applyShowKeys(); toast('Progress imported'); renderView();
    }).catch(err => toast('Import failed: ' + err.message));
  } });
  let resetArmed = false;
  const resetBtn = h('button', { onclick: () => {
    if (!resetArmed) { resetArmed = true; resetBtn.textContent = 'Click again to erase all progress'; return; }
    Store.data = null; localStorage.removeItem(STORE_KEY); Store.load(); applyShowKeys(); toast('Progress reset'); renderView();
  } }, 'Reset progress');

  return h('div', {}, h('h2', {}, 'Settings'),
    h('div', { class: 'card' }, h('h3', {}, 'Input'), h('table', { class: 'set' },
      row('MIDI input', sel('midiIn', [['all', 'All devices'], ...Midi.inputs().map(i => [i.id, i.name])]),
        'Roland FP-10: connect USB (USB-B on the piano) or pair Bluetooth in Audio MIDI Setup. Use Chrome or Edge.'),
      row('Microphone', h('button', { disabled: !Mic.stream && Midi.connectedInputs().length > 0,
          onclick: async () => { if (Mic.stream) Mic.stop(); else await Mic.start(); renderView(); } }, Mic.stream ? 'Turn off' : 'Turn on'),
        Midi.connectedInputs().length ? 'Not needed while the piano is connected over MIDI, so it is off.'
          : 'For pianos without MIDI. Detects one note at a time: fine for reading drills, unreliable for chords.'),
      row('Navigate with the piano', h('span', { class: 'muted small' }, 'Always on'),
        'In an exercise, A0 restarts it, A♯0 plays Listen, B0 goes to the previous one and C1 to the next. Highest key (C8) turns navigate mode on and off. Then G7 and A7 step between buttons, F7 and B7 jump between sections, G♯7 presses, E7 goes Home. Starting an exercise turns it off.'),
      row('Computer keyboard as piano', chk('qwerty'), 'A W S E D F T G … play notes. Z and X change octave. Space and V tap rhythms.'),
      row('Timing offset (ms)', numIn('latencyMs', -200, 200, 5), 'If tempo mode always says you are late, raise this by that amount.'),
      row('"Right on time" window (ms)', numIn('goodMs', 30, 250, 10)),
      row('Counted-as-hit window (ms)', numIn('okMs', 80, 400, 10)))),
    h('div', { class: 'card' }, h('h3', {}, 'Sound'), h('table', { class: 'set' },
      row('Demo notes play on', sel('demoSound', [['piano', 'The piano (MIDI out), if connected'], ['computer', 'This computer']])),
      row('MIDI output', sel('midiOut', [['auto', 'Automatic'], ['none', 'None'], ...Midi.outputs().map(o => [o.id, o.name])])),
      row('Sound for on-screen and computer keys', chk('keySound'), 'Plays on the piano when MIDI out is connected, otherwise on this computer.'),
      row('App notes volume', h('input', { type: 'range', min: 0.1, max: 1, step: 0.05, value: settings.appVol, oninput: e => set('appVol', +e.target.value) }),
        'Demos, ear-training questions and on-screen keys. Works for both the piano and this computer.'),
      row('Piano volume method', sel('pianoVolMethod', [['sysex', 'Master volume (SysEx)'], ['cc7', 'Channel volume (CC7)']]),
        'Used by the Piano 🔊 slider in the header. If one method does nothing on your piano, try the other.'),
      row('Metronome volume', h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: settings.metroVol, oninput: e => set('metroVol', +e.target.value) })))),
    h('div', { class: 'card' }, h('h3', {}, 'Display and help'), h('table', { class: 'set' },
      row('Show on-screen keyboard', chk('showKeys'), 'Hide it to give the music more room. MIDI and computer keys still work.'),
      row('Show finger numbers', chk('showFingers')),
      row('Show note names', chk('showNames'), 'Helpful at first. Turn it off once you can read the notes.'),
      row('Highlight keys to press', sel('hints', [['after-error', 'After a wrong note'], ['always', 'Always'], ['never', 'Never']])))),
    h('div', { class: 'card' }, h('h3', {}, 'Progress'),
      h('p', { class: 'muted small' }, 'Progress is saved in this browser only. Export now and then as a backup, or to move it to another computer.'),
      h('div', { class: 'row' },
        h('button', { onclick: () => {
          const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' })), download: `piano-trainer-${today()}.json` });
          a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } }, 'Export'),
        h('button', { onclick: () => importInput.click() }, 'Import'), importInput, resetBtn)));
}

/* =========================================================================
   Boot
   ========================================================================= */
function boot() {
  Store.load();
  if (window.__vfFailed || !window.Vex) {
    const el = document.getElementById('load-error');
    el.hidden = false;
    el.textContent = 'The notation library (VexFlow) did not load. Either you are offline, or the file failed its integrity check (SRI). Exercises need it to draw music.';
  }
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav)));
  Keyboard.mount(document.getElementById('kbd'));
  document.getElementById('kbd-toggle').addEventListener('click', () => { settings.showKeys = !settings.showKeys; Store.save(); applyShowKeys(); });
  applyShowKeys();
  Input.on(onInput);
  window.addEventListener('keydown', e => onKey(e, true));
  window.addEventListener('keyup', e => onKey(e, false));
  window.addEventListener('resize', () => { if (currentView === 'drill') drawScoreOnly(); });
  for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) document.addEventListener(type, () => Sound.unlock(), { capture: true });
  window.addEventListener('pagehide', () => Sound.stopAll());
  qwertyInfo();
  const vol = document.getElementById('piano-vol');
  vol.value = settings.pianoVol;
  // The piano's own control may have moved since last time, so only send when the slider moves.
  vol.addEventListener('input', () => { settings.pianoVol = +vol.value; Store.save(); Midi.setVolume(settings.pianoVol); });
  Midi.init();
  window.addEventListener('hashchange', openRoute);
  document.addEventListener('visibilitychange', () => Wake.update());
  openRoute();
}
if (typeof document !== 'undefined') boot();
</script>
