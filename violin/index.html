   ========================================================================= */
function onKeyDown(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && !(e.target.type === 'range' || e.target.type === 'checkbox')) return;
  if (currentView === 'editor' && ED) {
    // A button keeps focus after a click; let Space go to the editor, not click it again.
    if (e.key === ' ' && e.target.tagName === 'BUTTON') e.target.blur();
    if (editorKey(e)) e.preventDefault();
    return;
  }
  if (currentView !== 'drill' || !D || e.target.tagName === 'BUTTON' && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === ' ') {
    e.preventDefault();
    if (D.running === 'wait' || D.running === 'tempo') { stopRun(); resetRun(); renderView(); }
    else if (D.mode === 'wait') beginWait(); else startTimeline(false);
  } else if (k === 'l') listen();
  else if (k === 'r') restartRun();
}

function boot() {
  Store.load();
  if (window.__vfFailed || !window.Vex) {
    const el = document.getElementById('load-error');
    el.hidden = false;
    el.textContent = 'The notation library (vendor/vexflow/vexflow.min.js) did not load, so music cannot be drawn. The tuner still works.';
  }
  // Old links: ?mode=sheet&piece=<id>
  const qs = new URLSearchParams(location.search);
  if (qs.get('piece')) {
    const id = qs.get('piece');
    const track = WARMUP_IDS.includes(id) ? 'warmups' : 'pieces';
    history.replaceState(null, '', location.pathname + `#drill/${track}/${encodeURIComponent(id)}`);
  } else if (location.search) history.replaceState(null, '', location.pathname + location.hash);

  updateRefChip();
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav)));
  document.getElementById('chip-mic').addEventListener('click', async () => {
    if (Mic.on) { Mic.stop(); if (currentView !== 'drill') renderView(); return; }
    if (currentView === 'drill' && D) return D.mode === 'wait' ? beginWait() : startTimeline(false);
    if (currentView === 'tuner') return tunerStart();
    if (!MIC_VIEWS.includes(currentView)) go('tuner');
    if (await Mic.start()) renderView();
  });
  window.addEventListener('keydown', onKeyDown);
  let resizeT = null;
  window.addEventListener('resize', () => {
    Halo.resize();
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (currentView === 'drill') drawScore(); if (currentView === 'editor') drawEditor(); }, 120);
  });
  document.addEventListener('pointerdown', () => Sound.ctx(), { once: true });
  document.addEventListener('visibilitychange', () => { Live.resetSmoothing(); if (Mic.on) Mic.lastT = null; Wake.update(); });
  window.addEventListener('pagehide', () => { Sound.stopAll(); Store.save(); });

  // Drop MusicXML files anywhere to add them to My pieces.
  const drop = document.getElementById('drop');
  let depth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; drop.classList.add('show'); } });
  window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; drop.classList.remove('show'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', async e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0; drop.classList.remove('show');
    const files = [...e.dataTransfer.files].filter(f => /\.(musicxml|xml|mxl)$/i.test(f.name));
    if (!files.length) return toast('Drop MusicXML files (.musicxml, .xml or .mxl).');
    const last = await importFiles(files);
    if (!last) return;
    if (currentView === 'home') renderView();
    else if (files.length === 1) { const idx = TRACK_BY_ID.mine.levels.findIndex(l => l.id === last.id); if (idx >= 0) openLevel('mine', idx); }
  });

  window.addEventListener('hashchange', openRoute);
  openRoute();
}
if (typeof document !== 'undefined') boot();
</script>
</body>
</html>
