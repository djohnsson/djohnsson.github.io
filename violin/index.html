   ========================================================================= */
const STORE_KEY = 'violin-trainer.v1';
const SENSITIVITY = { easy: { green: 20, yellow: 45 }, medium: { green: 5, yellow: 15 }, hard: { green: 2, yellow: 8 } };
const DEFAULT_SETTINGS = {
  sensitivity: 'medium', a4: 440, waitAccept: 'tune', waitGiveUp: false,
  showFingers: true, showNames: false, halo: true, combos: true, synthVol: 0.8, metroVol: 0.5, editorBpm: 90,
};
const PASS_ACC = 0.8;
let settings = { ...DEFAULT_SETTINGS };

const Store = {
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { /* first run or blocked storage */ }
    this.data = Object.assign({ version: 1, settings: {}, levels: {}, days: {}, theorySeen: {}, pieces: [], draft: null, tunerBest: 0 }, d || {});
    if (!d) this.migrateOld();
    settings = { ...DEFAULT_SETTINGS, ...this.data.settings };
    refreshMine();
  },
  /** One-time import of what the previous version of the app kept in localStorage. */
  migrateOld() {
    const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const sens = get('violinTrainerSensitivity');
    if (SENSITIVITY[sens]) this.data.settings.sensitivity = sens;
    const adv = get('violinTrainerAdvanceMode');
    if (adv === 'any') this.data.settings.waitAccept = 'any';
    if (adv === 'timeout') this.data.settings.waitGiveUp = true;
    try {
      for (const e of JSON.parse(get('violinTrainerPracticeLog')) || []) {
        const day = new Date(e.date).toLocaleDateString('sv-SE');
        const rec = this.data.days[day] = this.data.days[day] || { secs: 0, exercises: 0 };
        rec.secs += Math.min((e.durationMs || 0) / 1000, 3600);
      }
    } catch (e) { /* nothing to migrate */ }
    try {
      const hs = JSON.parse(get('violinTrainerHighScoresV2')) || {};
      for (const [key, list] of Object.entries(hs)) {
        if (!key.startsWith('lib:') || !Array.isArray(list)) continue;
        const id = key.slice(4);
        const track = WARMUP_IDS.includes(id) ? 'warmups' : 'pieces';
        const best = Math.max(...list.map(s => (s.maxScore ? s.score / s.maxScore : 0)));
        if (best > 0) this.data.levels[`${track}:${id}`] = { attempts: list.length, passes: 0, bestAcc: Math.min(1, best) };
      }
    } catch (e) { /* nothing to migrate */ }
  },
  save() {
    this.data.settings = settings;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { toast('Could not save: ' + e.message); }
  },
  day() { return this.data.days[today()] = this.data.days[today()] || { secs: 0, exercises: 0 }; },
  level(key) { return this.data.levels[key] || { attempts: 0, passes: 0 }; },
  record(key, res) {
    const r = this.data.levels[key] = this.level(key);
    r.attempts++;
    if (res.pass) r.passes++;
    r.bestAcc = Math.max(r.bestAcc || 0, res.acc);
    const newBest = res.score > (r.bestScore || 0);
    if (newBest) r.bestScore = res.score;
    if (res.pass && res.mode === 'tempo') r.bestTempo = Math.max(r.bestTempo || 0, res.bpm);
    r.last = today();
    this.day().exercises++;
    this.save();
    return newBest;
  },
  streak() {
    let n = 0;
    const dt = new Date();
    if (!this.data.days[today()]) dt.setDate(dt.getDate() - 1);
    while (this.data.days[dt.toLocaleDateString('sv-SE')]) { n++; dt.setDate(dt.getDate() - 1); }
    return n;
  },
  addPiece(entry) {
    entry.id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    entry.date = today();
    this.data.pieces.push(entry);
    this.save();
    refreshMine();
    return entry;
  },
  updatePiece(id, fields) {
    const p = this.data.pieces.find(x => x.id === id);
    if (!p) return null;
    Object.assign(p, fields);
    this.save();
    refreshMine();
    return p;
  },
  deletePiece(id) {
    this.data.pieces = this.data.pieces.filter(p => p.id !== id);
    delete this.data.levels['mine:' + id];
    this.save();
    refreshMine();
  },
};
const levelKey = (trackId, level) => `${trackId}:${level.id}`;
function currentLevelIdx(track) {
  const i = track.levels.findIndex(l => Store.level(levelKey(track.id, l)).passes < 3);
  return i === -1 ? Math.max(0, track.levels.length - 1) : i;
}
const isUnlocked = (track, i) => track.free || i === 0 || Store.level(levelKey(track.id, track.levels[i - 1])).passes > 0;
const stars = passes => '★'.repeat(Math.min(3, passes)) + '☆'.repeat(Math.max(0, 3 - passes));

/** Saves a file (or a list of files) as My pieces. Returns the last one added. */
async function importFiles(files) {
  let last = null;
  for (const file of files) {
    try {
      const { xml, parsed } = await readScoreFile(file);
      last = Store.addPiece({ title: parsed.title || file.name.replace(/\.(musicxml|xml|mxl)$/i, ''), composer: parsed.composer, xml, source: 'import' });
      const pitched = parsed.notes.filter(n => !n.isRest).length;
      toast(`Added "${last.title}" to My pieces (${pitched} notes${parsed.partNote ? ', ' + parsed.partNote : ''})`);
    } catch (e) {
      toast(`Couldn't read ${file.name}: ${e.message}. Export MusicXML (.musicxml/.xml) or compressed MusicXML (.mxl) from your notation program.`, 6000);
    }
  }
  return last;
}

/* =========================================================================
   Sound out: a small bowed-string synth for Listen, and metronome clicks
   ========================================================================= */
const Sound = {
  _ctx: null, nodes: [],
  ctx() {
    if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this._ctx.state === 'suspended') this._ctx.resume();
    return this._ctx;
  },
  /** AudioContext time for a performance.now() time. */
  at(tPerf) { const c = this.ctx(); return Math.max(c.currentTime, c.currentTime + (tPerf - performance.now()) / 1000); },
  click(tPerf, accent) {
    const c = this.ctx(), t = this.at(tPerf);
    const o = c.createOscillator(), g = c.createGain();
    // Low and short, so the pitch detector doesn't mistake it for a note.
    o.frequency.value = accent ? 220 : 165;
    o.type = 'square';
    g.gain.setValueAtTime(settings.metroVol * (accent ? 0.5 : 0.3), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.04);
    this.nodes.push(o);
  },
  /**
   * One bow stroke over {freq, durSec} segments: two detuned sawtooths through a lowpass and a
   * "violin formant" peak, with vibrato that fades in. Inside a slur the pitch glides into
   * each new note while the bow (the volume envelope) keeps going.
   */
  phrase(segments, tPerf) {
    const c = this.ctx(), startTime = this.at(tPerf);
    const total = segments.reduce((s, x) => s + x.durSec, 0);
    const attack = Math.min(0.05, total * 0.35), release = Math.min(0.05, total * 0.35);
    const end = startTime + total, level = 0.16 * settings.synthVol, glide = 0.03;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(clamp(segments[0].freq * 6, 1800, 6000), startTime);
    const peak = c.createBiquadFilter();
    peak.type = 'peaking'; peak.frequency.value = 1500; peak.Q.value = 1.1; peak.gain.value = 6;
    const g = c.createGain();
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(level, startTime + attack);
    g.gain.setValueAtTime(level, Math.max(startTime + attack, end - release));
    g.gain.linearRampToValueAtTime(0, end);
    lp.connect(peak).connect(g).connect(c.destination);
    const oscs = [-5, 5].map(cents => {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.detune.value = cents;
      o.frequency.setValueAtTime(segments[0].freq, startTime);
      o.connect(lp);
      return o;
    });
    let segStart = startTime;
    for (let i = 1; i < segments.length; i++) {
      const prev = segments[i - 1].freq, target = segments[i].freq;
      segStart += segments[i - 1].durSec;
      const gs = Math.max(startTime, segStart - glide);
      for (const o of oscs) { o.frequency.setValueAtTime(prev, gs); o.frequency.linearRampToValueAtTime(target, segStart); }
      lp.frequency.setValueAtTime(clamp(prev * 6, 1800, 6000), gs);
      lp.frequency.linearRampToValueAtTime(clamp(target * 6, 1800, 6000), segStart);
    }
    const vib = c.createOscillator(), depth = c.createGain();
    vib.frequency.value = 5.5;
    depth.gain.setValueAtTime(0, startTime);
    depth.gain.linearRampToValueAtTime(12, startTime + Math.min(0.2, total * 0.5));
    vib.connect(depth);
    for (const o of oscs) depth.connect(o.detune);
    const stop = end + 0.05;
    for (const o of [...oscs, vib]) { o.start(startTime); o.stop(stop); this.nodes.push(o); }
  },
  /** Plays notes from tPerf; slurred notes share one bow. Returns note start times in beats. */
  playNotes(notes, slurs, bpm, tPerf) {
    const secPerBeat = 60 / bpm;
    const slurEnd = new Map((slurs || []).map(s => [s.start, s.stop]));
    const starts = [];
    let beat = 0;
    for (const n of notes) { starts.push(beat); beat += noteBeats(n); }
    let i = 0;
    while (i < notes.length) {
      const n = notes[i];
      if (n.isRest) { i++; continue; }
      let last = i;
      if (!n.staccato && slurEnd.has(i)) {
        const stop = Math.min(slurEnd.get(i), notes.length - 1);
        let j = i + 1;
        while (j <= stop && !notes[j].isRest && !notes[j].staccato) j++;
        last = j - 1;
      }
      const segs = [];
      for (let k = i; k <= last; k++) segs.push({ freq: settings.a4 * 2 ** ((notes[k].midi - 69) / 12), durSec: noteBeats(notes[k]) * secPerBeat });
      segs[segs.length - 1].durSec *= notes[last].staccato ? 0.5 : (segs.length > 1 ? 0.85 : 0.9);
      this.phrase(segs, tPerf + starts[i] * secPerBeat * 1000);
      i = last + 1;
    }
    return { starts, totalBeats: beat };
  },
  stopAll() {
    for (const n of this.nodes) { try { n.stop(); } catch (e) { /* already stopped */ } }
    this.nodes = [];
  },
};

/* =========================================================================
   Listening: microphone → YIN pitch → smoothing → a colour state, every animation frame
   ========================================================================= */
const MIN_FREQ = 150, MAX_FREQ = 5000, MIN_AMPLITUDE = 0.01, MIN_CONFIDENCE = 0.85, YIN_THRESHOLD = 0.12;
const GATE_RESET_FRAMES = 3, CENTS_EMA_ALPHA = 0.28, GRADE_WINDOW_MS = 220;

function yinPitchDetect(buffer, sampleRate) {
  const maxLag = Math.floor(buffer.length / 2);
  const d = new Float32Array(maxLag);
  for (let tau = 1; tau < maxLag; tau++) {
    let sum = 0;
    for (let i = 0; i < maxLag; i++) { const x = buffer[i] - buffer[i + tau]; sum += x * x; }
    d[tau] = sum;
  }
  const cmndf = new Float32Array(maxLag);
  cmndf[0] = 1;
  let run = 0;
  for (let tau = 1; tau < maxLag; tau++) { run += d[tau]; cmndf[tau] = run > 0 ? d[tau] * tau / run : 1; }
  let tauEst = -1;
  for (let tau = 2; tau < maxLag; tau++) {
    if (cmndf[tau] < YIN_THRESHOLD) {
      while (tau + 1 < maxLag && cmndf[tau + 1] < cmndf[tau]) tau++;
      tauEst = tau;
      break;
    }
  }
  if (tauEst === -1) return { frequency: null, confidence: 0 };
  let better = tauEst;
  if (tauEst > 0 && tauEst + 1 < maxLag) {
    const s0 = cmndf[tauEst - 1], s1 = cmndf[tauEst], s2 = cmndf[tauEst + 1];
    const denom = 2 * (2 * s1 - s2 - s0);
    if (denom !== 0) { const adj = (s2 - s0) / denom; if (isFinite(adj)) better += adj; }
  }
  return { frequency: sampleRate / better, confidence: 1 - cmndf[tauEst] };
}

const midiFloatOf = freq => 69 + 12 * Math.log2(freq / settings.a4);
const centsFrom = (freq, targetMidi) => (midiFloatOf(freq) - targetMidi) * 100;
function nearestNote(freq) {
  const mf = midiFloatOf(freq), m = Math.round(mf);
  return { midi: m, cents: (mf - m) * 100 };
}
/** Nearest open-string pitch in any octave (Tune strings grades against G/D/A/E only). */
function nearestOpenString(freq) {
  const mf = midiFloatOf(freq);
  let best = { midi: OPEN_STRING_MIDI[0], cents: Infinity };
  for (const base of OPEN_STRING_MIDI) {
    const t = base + Math.round((mf - base) / 12) * 12;
    const c = (mf - t) * 100;
    if (Math.abs(c) < Math.abs(best.cents)) best = { midi: t, cents: c };
  }
  return best;
}
function colorStateFor(cents) {
  const s = SENSITIVITY[settings.sensitivity] || SENSITIVITY.medium;
  const a = Math.abs(cents);
  return a <= s.green ? 'green' : a <= s.yellow ? 'yellow' : 'red';
}

/** Rolling, time-weighted average of cents: vibrato swings evenly around the pitch, so it averages out. */
const Grade = {
  hist: [],
  push(cents, dt) {
    this.hist.push({ cents, dt });
    let total = this.hist.reduce((a, e) => a + e.dt, 0);
    while (this.hist.length > 1 && total - this.hist[0].dt >= GRADE_WINDOW_MS) total -= this.hist.shift().dt;
  },
  avg() {
    let ws = 0, w = 0;
    for (const e of this.hist) { ws += e.cents * e.dt; w += e.dt; }
    return w ? ws / w : 0;
  },
  /** Pushes a reading and returns the colour of the averaged pitch. */
  state(cents, dt) { this.push(cents, dt); return colorStateFor(this.avg()); },
  reset() { this.hist = []; },
};

/** Vibrato: several direction changes in half a second, 8–70 cents wide. Rewarded with sparks, never graded. */
const Vibrato = {
  samples: [], cooldown: 0,
  track(cents, state, dt) {
    this.samples.push({ cents, dt });
    let total = this.samples.reduce((a, e) => a + e.dt, 0);
    while (this.samples.length > 1 && total - this.samples[0].dt >= 500) total -= this.samples.shift().dt;
    this.cooldown = Math.max(0, this.cooldown - dt);
    if (this.samples.length < 6 || (state !== 'green' && state !== 'yellow')) return;
    let lo = Infinity, hi = -Infinity, rev = 0, dirPrev = 0;
    for (const s of this.samples) { lo = Math.min(lo, s.cents); hi = Math.max(hi, s.cents); }
    for (let i = 1; i < this.samples.length; i++) {
      const d = this.samples[i].cents - this.samples[i - 1].cents;
      if (Math.abs(d) < 0.5) continue;
      const dir = d > 0 ? 1 : -1;
      if (dirPrev && dir !== dirPrev) rev++;
      dirPrev = dir;
    }
    if (rev >= 3 && hi - lo >= 8 && hi - lo <= 70 && this.cooldown <= 0) { this.cooldown = 350; Halo.flare(); }
  },
  reset() { this.samples = []; this.cooldown = 0; },
};

/** Points for time in tune, with a multiplier that grows every 2 s of unbroken green. */
const Scoring = {
  active: false, score: 0, greenMs: 0, mult: 1, bestMult: 1, bestGreenMs: 0,
  reset() { Object.assign(this, { score: 0, greenMs: 0, mult: 1, bestMult: 1, bestGreenMs: 0 }); this.paint(); },
  update(state, dt) {
    if (!this.active) return;
    const prev = this.mult;
    if (state === 'green') {
      this.greenMs += dt;
      this.mult = Math.min(8, 1 + Math.floor(this.greenMs / 2000));
      this.score += 20 * this.mult * dt / 1000;
      this.bestGreenMs = Math.max(this.bestGreenMs, this.greenMs);
      this.bestMult = Math.max(this.bestMult, this.mult);
      if (this.mult > prev && settings.combos) combo(this.mult + '× Combo!');
    } else { this.greenMs = 0; this.mult = 1; }
    this.paint(prev !== this.mult);
  },
  paint(bump) {
    for (const el of document.querySelectorAll('[data-hud=score]')) el.textContent = Math.floor(this.score);
    for (const el of document.querySelectorAll('[data-hud=mult]')) {
      el.textContent = '×' + this.mult;
      el.classList.toggle('hot', this.mult > 1);
      if (bump && this.mult > 1) { el.classList.remove('hot'); void el.offsetWidth; el.classList.add('hot'); }
    }
  },
};
function combo(text) {
  const el = document.getElementById('combo');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth; // restart the animation
  el.classList.add('show');
}

/**
 * The microphone. While it's on, every animation frame reads the pitch and hands it to the
 * current page's handler (Live.handler), which grades it and returns { state, cents, label }.
 */
const Live = {
  handler: null,
  midiHist: [], ema: 0, emaInit: false, gated: 0,
  freq: null, conf: 0, rms: 0, valid: false, smoothedMidi: null,
  resetSmoothing() { this.midiHist = []; this.emaInit = false; this.gated = 0; Grade.reset(); Vibrato.reset(); },
};
const Mic = {
  on: false, starting: false, stream: null, source: null, analyser: null, buf: null, fbuf: null, raf: null, lastT: null, unsaved: 0,
  async start() {
    if (this.on || this.starting) return this.on;
    this.starting = true;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    } catch (err) {
      this.starting = false;
      let msg = 'Could not use the microphone.';
      if (err && err.name === 'NotAllowedError') msg = 'Microphone access was denied. Allow it in the browser (the icon in the address bar) and try again.';
      else if (err && err.name === 'NotFoundError') msg = 'No microphone was found.';
      else if (!window.isSecureContext) msg = 'The microphone needs HTTPS (or localhost).';
      toast(msg, 6000);
      return false;
    }
    const c = Sound.ctx();
    this.source = c.createMediaStreamSource(this.stream);
    this.analyser = c.createAnalyser();
    this.analyser.fftSize = 2048;
    this.buf = new Float32Array(this.analyser.fftSize);
    this.fbuf = new Uint8Array(this.analyser.frequencyBinCount);
    this.source.connect(this.analyser); // never to the speakers: that would howl
    this.on = true; this.starting = false; this.lastT = null;
    Live.resetSmoothing();
    Halo.init();
    this.raf = requestAnimationFrame(t => this.frame(t));
    updateMicChip();
    Wake.update();
    return true;
  },
  stop() {
    if (!this.on) return;
    cancelAnimationFrame(this.raf);
    if (this.source) this.source.disconnect();
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = this.source = this.analyser = null;
    this.on = false;
    Store.save();
    Halo.clear();
    paintMeters({ state: 'silence' });
    updateMicChip();
    Wake.update();
    if (Live.onStop) Live.onStop();
  },
  frame(now) {
    if (!this.on) return;
    const dt = this.lastT == null ? 16 : Math.min(now - this.lastT, 100);
    this.lastT = now;
    // Practice time counts while the microphone listens.
    Store.day().secs += dt / 1000;
    this.unsaved += dt;
    if (this.unsaved > 15000) { this.unsaved = 0; Store.save(); }

    this.analyser.getFloatTimeDomainData(this.buf);
    let ss = 0;
    for (const x of this.buf) ss += x * x;
    Live.rms = Math.sqrt(ss / this.buf.length);
    let freq = null, conf = 0;
    if (Live.rms >= MIN_AMPLITUDE) ({ frequency: freq, confidence: conf } = yinPitchDetect(this.buf, Sound.ctx().sampleRate));
    Live.freq = freq; Live.conf = conf;
    Live.valid = !!freq && conf >= MIN_CONFIDENCE && freq >= MIN_FREQ && freq <= MAX_FREQ;
    Live.silent = Live.rms < MIN_AMPLITUDE;
    if (!Live.valid) {
      if (++Live.gated >= GATE_RESET_FRAMES) Live.resetSmoothing();
    } else Live.gated = 0;

    const r = (Live.handler || tunerGrade)(dt, now) || { state: Live.silent ? 'silence' : 'nopitch' };
    Scoring.update(r.state, dt);
    paintMeters(r);
    if (settings.halo) Halo.draw(r.state, dt, r.cents); else Halo.clear();
    if (Live.debug) Live.debug();
    if (this.on) this.raf = requestAnimationFrame(t => this.frame(t));
  },
};

/** Smoothed reading against the nearest note (or open string): the default way to grade. */
function smoothedReading(nearest = nearestNote) {
  if (!Live.valid) return null;
  const n = nearest(Live.freq);
  Live.midiHist.push(n.midi);
  if (Live.midiHist.length > 5) Live.midiHist.shift();
  const sorted = Live.midiHist.slice().sort((a, b) => a - b);
  const midi = sorted[Math.floor(sorted.length / 2)];
  Live.ema = Live.emaInit ? CENTS_EMA_ALPHA * n.cents + (1 - CENTS_EMA_ALPHA) * Live.ema : n.cents;
  Live.emaInit = true;
  Live.smoothedMidi = midi;
  return { midi, cents: n.cents, ema: Live.ema };
}
function tunerGrade(dt) {
  const rd = smoothedReading();
  if (!rd) return { state: Live.silent ? 'silence' : 'nopitch' };
  const state = Grade.state(rd.cents, dt);
  Vibrato.track(rd.cents, state, dt);
  return { state, cents: rd.ema, label: noteLabel(rd.midi), midi: rd.midi + rd.ema / 100 };
}

function updateMicChip() {
  const c = document.getElementById('chip-mic');
  c.textContent = Mic.on ? '🎤 Mic on' : '🎤 Mic off';
  c.className = 'chip' + (Mic.on ? ' on' : '');
}

/** Updates every live pitch display on the page (big meter on Tuner/Tune strings, the dock in a piece). */
const BADGE_TEXT = { silence: '—', nopitch: '?', red: 'OFF', yellow: 'CLOSE', green: 'IN TUNE' };
function paintMeters(r) {
  for (const b of document.querySelectorAll('[data-m=badge]')) {
    const cls = 'pbadge ' + r.state;
    if (b.className !== cls) { b.className = cls; b.textContent = BADGE_TEXT[r.state] || '—'; }
  }
  const voiced = r.state !== 'silence' && r.state !== 'nopitch' && Live.valid;
  for (const el of document.querySelectorAll('[data-m=note]')) el.textContent = voiced && r.label ? r.label : '—';
  for (const el of document.querySelectorAll('[data-m=hz]')) el.textContent = voiced ? Live.freq.toFixed(1) + ' Hz' : '— Hz';
  for (const el of document.querySelectorAll('[data-m=needle]')) el.style.left = (voiced && r.cents != null ? 50 + clamp(r.cents, -50, 50) : 50) + '%';
  for (const el of document.querySelectorAll('[data-m=cents]')) {
    el.textContent = voiced && r.cents != null ? `${r.cents >= 0 ? '+' : ''}${r.cents.toFixed(1)} cents${r.target ? ' from ' + r.target : ''}` : '— cents';
  }
}

/* =========================================================================
   The particle halo: orbits the main readout, tightens and speeds up as you play in tune
   ========================================================================= */
const Halo = {
  canvas: null, cx: null, parts: [], sparks: [], radius: 220, speed: 0.3,
  init() {
    this.canvas = document.getElementById('halo');
    this.cx = this.canvas.getContext('2d');
    this.resize();
    this.parts = Array.from({ length: 160 }, () => ({
      angle: Math.random() * Math.PI * 2, speed: (0.0009 + Math.random() * 0.0012) * (Math.random() < 0.5 ? 1 : -1),
      jitter: (Math.random() - 0.5) * 170, size: 3 + Math.random() * 4.5, phase: Math.random() * Math.PI * 2, tw: 0.002 + Math.random() * 0.004,
    }));
  },
  resize() { if (this.canvas) { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; } },
  center() {
    const a = document.querySelector('[data-halo]');
    if (a) {
      const r = a.getBoundingClientRect();
      if (r.width) return { x: r.left + r.width / 2, y: clamp(r.top + r.height / 2, 80, window.innerHeight - 80) };
    }
    return { x: window.innerWidth / 2, y: Math.min(window.innerHeight * 0.42, 420) };
  },
  flare() {
    if (!settings.halo || !this.canvas) return;
    const { x, y } = this.center();
    const n = 18 + Math.floor(Math.random() * 10);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.15 + Math.random() * 0.25, r0 = this.radius * 0.3;
      this.sparks.push({ x: x + Math.cos(a) * r0, y: y + Math.sin(a) * r0 * 0.82, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: 500 + Math.random() * 300, size: 2 + Math.random() * 2.5, hue: 40 + Math.random() * 30 });
    }
  },
  draw(state, dt, cents) {
    if (!this.canvas) return;
    const { x: cx, y: cy } = this.center();
    const off = Math.min(Math.abs(cents || 0), 50);
    const voiced = state !== 'silence' && state !== 'nopitch';
    const scale = Math.min(1, Math.min(window.innerWidth, window.innerHeight) / 900);
    const targetR = (voiced ? 190 + off / 50 * 280 : 260) * Math.max(0.55, scale);
    this.radius += (targetR - this.radius) * 0.04;
    const targetSp = state === 'green' ? 2.2 + Math.min(Scoring.mult * 0.35, 2.5) : state === 'yellow' ? 1 : state === 'red' ? 0.45 : 0.2;
    this.speed += (targetSp - this.speed) * 0.06;
    const rgb = { green: '62,207,106', yellow: '232,179,57', red: '229,72,77' }[state] || '120,124,136';
    const c = this.cx;
    c.clearRect(0, 0, this.canvas.width, this.canvas.height);
    c.save();
    for (const p of this.parts) {
      p.angle += p.speed * this.speed * dt;
      p.phase += p.tw * dt;
      const r = this.radius + p.jitter * Math.max(0.55, scale);
      c.beginPath();
      c.arc(cx + Math.cos(p.angle) * r, cy + Math.sin(p.angle) * r * 0.82, p.size, 0, Math.PI * 2);
      c.fillStyle = `rgba(${rgb}, ${Math.max(0.5 + Math.sin(p.phase) * 0.3, 0.15)})`;
      c.shadowColor = `rgba(${rgb}, 0.95)`;
      c.shadowBlur = 14;
      c.fill();
    }
    this.sparks = this.sparks.filter(s => {
      s.life += dt;
      if (s.life >= s.max) return false;
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 0.00025 * dt;
      const t = s.life / s.max;
      c.beginPath();
      c.arc(s.x, s.y, s.size * (1 - t * 0.4), 0, Math.PI * 2);
      c.fillStyle = `hsla(${s.hue}, 100%, 65%, ${1 - t})`;
      c.shadowColor = `hsla(${s.hue}, 100%, 70%, ${1 - t})`;
      c.shadowBlur = 12;
      c.fill();
      return true;
    });
    c.restore();
  },
  clear() { if (this.cx) this.cx.clearRect(0, 0, this.canvas.width, this.canvas.height); this.sparks = []; },
};

/* =========================================================================
   Keep the screen on while practising
   ========================================================================= */
const Wake = {
  lock: null, pending: false,
  wanted() { return document.visibilityState === 'visible' && (Mic.on || (currentView === 'drill' && !!D)); },
  async update() {
    if (!navigator.wakeLock || this.pending) return;
    if (this.wanted() && !this.lock) {
      this.pending = true;
      try {
        const lock = await navigator.wakeLock.request('screen');
        this.lock = lock;
        lock.addEventListener('release', () => { if (this.lock === lock) this.lock = null; this.show(); });
      } catch (e) { /* refused (battery saver, permissions): the chip stays hidden */ }
      this.pending = false;
      if (!this.wanted()) return this.update();
    } else if (!this.wanted() && this.lock) {
      const lock = this.lock;
      this.lock = null;
      lock.release().catch(() => {});
    }
    this.show();
  },
  show() { document.getElementById('chip-awake').hidden = !this.lock; },
};

/* =========================================================================
   Notation (VexFlow)
   ========================================================================= */
const NOTE_COLORS = {
  current: '#5b8dee', clean: '#3ecf6a', retry: '#e8b339', missed: '#e5484d',
  'current-green': '#3ecf6a', 'current-yellow': '#e8b339', 'current-red': '#e5484d',
};
const INK = '#e8e9ec';
const VF_DUR = { w: 'w', h: 'h', q: 'q', 8: '8', 16: '16', 32: '32', 64: '64' };
const SYS_H = 150;     // height of one line of music
const STAVE_Y = 22;    // room above the staff for finger numbers and "III"
const PAD_L = 10;

/** Splits a piece's notes into bars, using real <measure> lengths when they add up. */
function barsOf(notes, measureLengths, barBeats) {
  if (measureLengths && measureLengths.reduce((a, b) => a + b, 0) === notes.length) {
    const out = [];
    let i = 0;
    for (const len of measureLengths) { out.push({ start: i, notes: notes.slice(i, i + len) }); i += len; }
    return out.filter(b => b.notes.length);
  }
  let i = 0;
  return groupNotesByBeats(notes, barBeats).map(ns => { const b = { start: i, notes: ns }; i += ns.length; return b; });
}

/**
 * Draws a piece into `host` (inside the scrolling `wrap`), wrapping bars onto lines that fit.
 * o: { notes, piece (key/time/clef), measureLengths, slurs, states, firstBar, cursor }
 * Returns the layout: vexNotes, the line each note is on, and each line's staff geometry.
 */
function renderScore(wrap, host, o) {
  const VF = Vex.Flow;
  const p = o.piece;
  const LW = Math.max(300, Math.floor(wrap.clientWidth) - 2);
  const keySig = keyName(p.fifths || 0), timeSig = `${p.beats || 4}/${p.beatType || 4}`, clef = p.clef || 'treble';
  const keyMap = keyAccidentalMap(p.fifths || 0);
  const header = 45 + Math.abs(p.fifths || 0) * 11;
  const bars = barsOf(o.notes, o.measureLengths, barBeatsOf(p));
  const lay = { vexNotes: [], lineOf: [], lines: [], LW, scale: 1 };

  const minW = b => {
    const accs = b.notes.filter(n => !n.isRest && (n.alter || 0) !== (keyMap[n.step] || 0)).length;
    const fing = b.notes.filter(n => n.position === 3).length;
    return 40 + b.notes.length * 30 + accs * 9 + b.notes.filter(n => n.dotted).length * 6 + fing * 2;
  };
  const lines = [];
  let line = [], used = 0;
  bars.forEach((b, i) => {
    const w = minW(b) + (line.length ? 0 : header + (i === 0 ? 30 : 0));
    if (line.length && (used + w > LW - PAD_L - 10 || line.length >= 4)) {
      lines.push(line); line = []; used = minW(b) + header;
    } else used += w;
    line.push(i);
  });
  if (line.length || !bars.length) lines.push(line);

  const H = lines.length * SYS_H + 10;
  host.innerHTML = '';
  const renderer = new VF.Renderer(host, VF.Renderer.Backends.SVG);
  renderer.resize(LW, H);
  const ctx = renderer.getContext();
  ctx.setFillStyle(INK);
  ctx.setStrokeStyle(INK);

  lines.forEach((idxs, li) => {
    const y = 5 + li * SYS_H;
    if (!idxs.length) { // an empty piece (the editor before the first note)
      const s = new VF.Stave(PAD_L, y + STAVE_Y, LW - PAD_L - 10);
      s.addClef(clef).addKeySignature(keySig).addTimeSignature(timeSig);
      s.setContext(ctx).draw();
      lay.lines.push({ y, top: s.getYForLine(0), spacing: s.getSpacingBetweenLines(), x0: PAD_L, x1: LW - 10 });
      return;
    }
    const widths = idxs.map((bi, j) => minW(bars[bi]) + (j === 0 ? header + (bi === 0 ? 30 : 0) : 0));
    const total = widths.reduce((a, b) => a + b, 0);
    const avail = LW - PAD_L - 10;
    const stretch = li === lines.length - 1 && total < avail * 0.6 ? 1 : avail / total;
    let x = PAD_L;
    idxs.forEach((bi, j) => {
      const bar = bars[bi], w = widths[j] * stretch;
      const s = new VF.Stave(x, y + STAVE_Y, w);
      if (j === 0) {
        s.addClef(clef).addKeySignature(keySig);
        if (bi === 0) s.addTimeSignature(timeSig);
        s.setMeasure((o.firstBar || 1) + bi);
      } else s.setBegBarType(VF.Barline.type.NONE);
      if (bi === bars.length - 1 && o.finalBar !== false) s.setEndBarType(VF.Barline.type.END);
      s.setContext(ctx).draw();
      if (j === 0) lay.lines.push({ y, top: s.getYForLine(0), spacing: s.getSpacingBetweenLines(), x0: x, x1: x });
      lay.lines[li].x1 = x + w;

      const inBar = {}; // accidentals carry to the end of the bar
      const vns = bar.notes.map((n, k) => {
        const gi = bar.start + k;
        const d = VF_DUR[n.vexDuration] || 'q';
        let vn;
        if (n.isRest) vn = new VF.StaveNote({ clef, keys: ['b/4'], duration: d + (n.dotted ? 'd' : '') + 'r' });
        else {
          const acc = { 1: '#', 2: '##', '-1': 'b', '-2': 'bb' }[n.alter || 0] || '';
          vn = new VF.StaveNote({ clef, keys: [`${n.step.toLowerCase()}${acc}/${n.octave}`], duration: d + (n.dotted ? 'd' : ''), auto_stem: true });
          const slot = n.step + n.octave;
          const cur = slot in inBar ? inBar[slot] : (keyMap[n.step] || 0);
          if ((n.alter || 0) !== cur) { vn.addModifier(new VF.Accidental((n.alter || 0) === 0 ? 'n' : acc), 0); inBar[slot] = n.alter || 0; }
          const top = VF.Annotation.VerticalJustify.TOP, bottom = VF.Annotation.VerticalJustify.BOTTOM;
          if (n.position === 3) {
            const prev = prevPitchedNote(o.notes, gi);
            if (!prev || prev.position !== 3) vn.addModifier(new VF.Annotation('III').setFont('Times', 13, 'bold').setVerticalJustification(top), 0);
            const f = settings.showFingers ? thirdPositionFingering(n) : null;
            if (f) vn.addModifier(new VF.Annotation(String(f.finger)).setFont('Arial', 11, 'bold').setVerticalJustification(top), 0);
          }
          if (settings.showNames) vn.addModifier(new VF.Annotation(pretty(n.step + ({ 1: '#', '-1': 'b' }[n.alter] || ''))).setFont('Arial', 10).setVerticalJustification(bottom), 0);
          if (n.staccato) { try { vn.addModifier(new VF.Articulation('a.').setPosition(VF.Modifier.Position.BELOW), 0); } catch (e) { /* cosmetic */ } }
        }
        if (n.dotted) VF.Dot.buildAndAttach([vn], { all: true });
        const color = o.states && NOTE_COLORS[o.states[gi]];
        if (color) vn.setStyle({ fillStyle: color, strokeStyle: color });
        lay.vexNotes[gi] = vn;
        lay.lineOf[gi] = li;
        return vn;
      });
      const voice = new VF.Voice({ num_beats: p.beats || 4, beat_value: p.beatType || 4 });
      voice.setMode(VF.Voice.Mode.SOFT);
      voice.addTickables(vns);
      let beams = [];
      if (bar.notes.some(n => DUR_BEATS[n.vexDuration] < 1)) {
        try { beams = VF.Beam.generateBeams(vns, { groups: VF.Beam.getDefaultBeamGroups(timeSig) }); } catch (e) { /* unbeamed still reads fine */ }
      }
      new VF.Formatter().joinVoices([voice]).format([voice], Math.max(20, x + w - s.getNoteStartX() - 12));
      // Cursor: a soft band behind the current note.
      if (o.cursor != null && o.cursor >= bar.start && o.cursor < bar.start + bar.notes.length) {
        voice.draw(ctx, s); // positions are only known after drawing, so draw, then put the band behind
        const vn = lay.vexNotes[o.cursor];
        const svg = host.querySelector('svg');
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('x', vn.getAbsoluteX() - 8); r.setAttribute('y', y + 8);
        r.setAttribute('width', 28); r.setAttribute('height', SYS_H - 18);
        r.setAttribute('rx', 6); r.setAttribute('fill', 'rgba(91,141,238,0.16)');
        svg.insertBefore(r, svg.firstChild);
      } else voice.draw(ctx, s);
      beams.forEach(b => b.setContext(ctx).draw());
      x += w;
    });
  });

  for (const sl of o.slurs || []) {
    const a = lay.vexNotes[sl.start], b = lay.vexNotes[sl.stop];
    if (!a || !b || lay.lineOf[sl.start] !== lay.lineOf[sl.stop]) continue;
    try { new VF.Curve(a, b, {}).setContext(ctx).draw(); } catch (e) { /* cosmetic */ }
  }
  const svg = host.querySelector('svg');
  if (svg) {
    svg.setAttribute('viewBox', `0 0 ${LW} ${H}`);
    svg.style.width = LW + 'px';
    svg.style.height = H + 'px';
  }
  return lay;
}

/** Size the score box to the space left on screen, so the page itself doesn't need to scroll. */
function fitScoreHeight(wrap) {
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const dock = document.getElementById('dock');
  const dockH = dock.hidden ? 0 : dock.offsetHeight;
  wrap.style.maxHeight = Math.max(240, Math.floor(window.innerHeight - top - dockH - 16)) + 'px';
}

/* =========================================================================
   Practising a piece. Two ways to play, as in the piano trainer:
     Wait for me: each note waits until you hold it in tune for about its written length.
     In tempo:    one bar of count-in, then the music moves with the metronome.
   ========================================================================= */
let D = null;          // the open piece, or null
let session = null;    // today's suggested session while working through it
const HOLD_MIN_MS = 350, HOLD_MAX_MS = 2500, GIVE_UP_MS = 4000, FAR_CENTS = 150;

function openLevel(trackId, idx) {
  stopRun();
  const track = TRACK_BY_ID[trackId];
  const level = track && track.levels[idx];
  if (!level) return go('home');
  let piece;
  try { piece = levelScore(level); } catch (e) { toast(`Couldn't open "${level.name}": ${e.message}`, 5000); return go('home'); }
  const key = levelKey(trackId, level);
  const rec = Store.level(key);
  const nBars = barsOf(piece.notes, piece.measureLengths, barBeatsOf(piece)).length;
  D = { track, level, idx, key, piece, nBars, mode: 'wait', bpm: rec.bestTempo || piece.bpm || 80, from: 1, to: nBars, finished: null };
  if (D.bpm > 160) D.bpm = 160;
  currentView = 'drill';
  Live.handler = drillHandler;
  Live.onStop = () => { if (D && D.running && D.running !== 'demo') { stopRun(); resetRun(); renderView(); } else renderDock(); };
  newSection();
  // With the microphone already on, Wait for me starts listening straight away.
  if (Mic.on && D.mode === 'wait') beginWait();
}

/** Cuts the bars from..to out of the piece. */
function newSection() {
  stopRun();
  const p = D.piece;
  const bars = barsOf(p.notes, p.measureLengths, barBeatsOf(p));
  D.to = clamp(D.to, 1, bars.length);
  D.from = clamp(D.from, 1, D.to);
  const s = bars[D.from - 1].start;
  const e = D.to < bars.length ? bars[D.to].start : p.notes.length;
  D.notes = p.notes.slice(s, e);
  D.measureLengths = bars.slice(D.from - 1, D.to).map(b => b.notes.length);
  D.slurs = (p.slurs || []).filter(x => x.start >= s && x.stop < e).map(x => ({ start: x.start - s, stop: x.stop - s }));
  D.finished = null;
  resetRun();
  renderView();
}

function resetRun() {
  D.states = D.notes.map(n => (n.isRest ? 'rest' : 'upcoming'));
  D.i = 0; D.cursor = -1; D.running = null; D.lastLine = -1;
  D.clean = 0; D.retry = 0; D.missed = 0;
  resetNote();
  skipRests();
  if (D.i < D.notes.length) D.states[D.i] = 'current';
  Scoring.active = false;
  Scoring.reset();
  hideLine();
}
function resetNote() { D.hold = 0; D.redMs = 0; D.slipped = false; D.elapsed = 0; D.liveState = null; Grade.reset(); }
function skipRests() { while (D.i < D.notes.length && D.notes[D.i].isRest) D.i++; }

function stopRun() {
  if (!D) return;
  cancelAnimationFrame(D.raf);
  clearTimeout(D.listenTimer);
  Sound.stopAll();
  D.running = null;
  Scoring.active = false;
  hideLine();
}

/** Wait for me: start listening (turns the microphone on if needed). */
async function beginWait() {
  if (!(await Mic.start())) return;
  if (!D || currentView !== 'drill') return;
  stopRun();
  resetRun();
  D.running = 'wait';
  Scoring.active = true;
  renderView();
}

const pitchedCount = () => D.notes.filter(n => !n.isRest).length;
const noteMs = n => noteBeats(n) * 60000 / D.bpm;
/** Hold time scales with the written length (a half note stays green longer than an eighth). */
const requiredHoldMs = n => Math.max(HOLD_MIN_MS, Math.min(noteMs(n), HOLD_MAX_MS) * 0.85);

function advance(result) {
  D.states[D.i] = result;
  D[result]++;
  D.i++;
  resetNote();
  skipRests();
  if (D.i >= D.notes.length) return finishRun();
  D.states[D.i] = 'current';
  drawScore();
  drawStatus();
}

/** Called for every microphone frame while a piece is open. */
function drillHandler(dt, now) {
  if (!D) return null;
  if (D.running === 'wait') return waitFrame(dt);
  if (D.running === 'tempo') return tempoFrame(dt, now);
  return tunerGrade(dt); // idle or Listen: just show what's being played
}

function liveReading(n, dt) {
  const cents = centsFrom(Live.freq, n.midi);
  const state = Grade.state(cents, dt);
  Vibrato.track(cents, state, dt);
  const played = Math.round(midiFloatOf(Live.freq));
  return { state, cents, label: noteLabel(played), target: spelled(n) };
}

function waitFrame(dt) {
  const n = D.notes[D.i];
  if (!n) return null;
  D.elapsed += dt;
  if (!Live.valid) {
    D.hold = 0;
    Grade.reset();
    setLive(null);
    hideLine();
    if (settings.waitGiveUp && D.elapsed >= GIVE_UP_MS) advance('missed');
    return { state: Live.silent ? 'silence' : 'nopitch', target: spelled(n) };
  }
  const r = liveReading(n, dt);
  setLive(r.state);
  showLine(r.cents, r.state);
  // A clearly wrong note held for a moment means it wasn't right the first time. The note
  // you just finished doesn't count: the music moves on while you're still bowing it.
  const prev = prevPitchedNote(D.notes, D.i);
  const stillOnPrev = prev && Math.abs(centsFrom(Live.freq, prev.midi)) < 50;
  if (r.state === 'red' && !stillOnPrev) { D.redMs += dt; if (D.redMs > 400) D.slipped = true; }
  const holding = settings.waitAccept === 'any' || r.state === 'green';
  if (holding) {
    D.hold += dt;
    if (D.hold >= requiredHoldMs(n)) { advance(r.state === 'green' && !D.slipped ? 'clean' : 'retry'); return r; }
  } else {
    if (D.hold > 0) D.slipped = true;
    D.hold = 0;
  }
  if (settings.waitGiveUp && D.elapsed >= GIVE_UP_MS) advance('missed');
  else drawStatus();
  return r;
}

/** Paints the live colour on the note being played; redraws only when the colour changes. */
function setLive(state) {
  if (D.liveState === state) return;
  D.liveState = state;
  D.states[D.i] = state ? 'current-' + state : 'current';
  drawScore();
}

/* ---------- In tempo (and Listen, which is the same timeline without grading) ---------- */
async function startTimeline(demo) {
  if (!demo && !(await Mic.start())) return;
  if (!D || currentView !== 'drill') return;
  stopRun();
  resetRun();
  D.finished = demo ? D.finished : null;
  Sound.ctx();
  const mpb = 60000 / D.bpm;
  const barBeats = barBeatsOf(D.piece);
  const countIn = demo ? 0 : Math.ceil(barBeats);
  D.starts = [];
  let beat = 0;
  for (const n of D.notes) { D.starts.push(beat); beat += noteBeats(n); }
  D.totalBeats = beat;
  D.mpb = mpb;
  D.t0 = performance.now() + 400 + countIn * mpb;
  D.endT = D.t0 + beat * mpb + 200;
  for (let b = -countIn; b < Math.ceil(beat); b++) Sound.click(D.t0 + b * mpb, mod(b, barBeats) === 0);
  if (demo) Sound.playNotes(D.notes, D.slurs, D.bpm, D.t0);
  D.acc = D.notes.map(() => ({ green: 0, close: 0 }));
  D.done = D.notes.map(n => n.isRest);
  D.running = demo ? 'demo' : 'tempo';
  Scoring.active = !demo;
  D.cursor = -1;
  D.states[D.i] = 'upcoming';
  D.raf = requestAnimationFrame(tick);
  renderView();
}

function tick() {
  if (!D || (D.running !== 'tempo' && D.running !== 'demo')) return;
  const now = performance.now();
  const beat = (now - D.t0) / D.mpb;
  let cur = -1;
  for (let i = 0; i < D.notes.length; i++) { if (D.starts[i] <= beat + 1e-6) cur = i; else break; }
  let dirty = false;
  if (D.running === 'tempo') {
    // A note is marked once its time is over: mostly in tune = clean, close = amber, else missed.
    for (let j = 0; j < D.notes.length; j++) {
      if (D.done[j] || D.starts[j] + noteBeats(D.notes[j]) > beat) continue;
      D.done[j] = true;
      const len = noteMs(D.notes[j]), a = D.acc[j];
      const res = a.green >= len * 0.4 ? 'clean' : a.green + a.close >= len * 0.4 ? 'retry' : 'missed';
      D.states[j] = res;
      D[res]++;
      dirty = true;
    }
  }
  if (cur !== D.cursor) {
    D.cursor = cur;
    if (cur >= 0) {
      D.i = cur;
      if (!D.notes[cur].isRest) D.states[cur] = 'current';
      D.liveState = null;
      Grade.reset();
      hideLine();
    }
    dirty = true;
  }
  if (dirty) drawScore();
  drawStatus(now);
  if (now > D.endT) {
    if (D.running === 'demo') { stopRun(); resetRun(); renderView(); } else finishRun();
    return;
  }
  D.raf = requestAnimationFrame(tick);
}

function tempoFrame(dt, now) {
  const i = D.cursor;
  const n = i >= 0 ? D.notes[i] : null;
  if (!n || n.isRest || D.done[i] || now < D.t0) return tunerGrade(dt);
  if (!Live.valid) { setLive(null); hideLine(); return { state: Live.silent ? 'silence' : 'nopitch', target: spelled(n) }; }
  const r = liveReading(n, dt);
  if (r.state === 'green') D.acc[i].green += dt;
  else if (r.state === 'yellow') D.acc[i].close += dt;
  setLive(r.state);
  showLine(r.cents, r.state);
  return r;
}

/** Listen: the app plays the section (with the cursor following); pressing it again stops. */
function listen() {
  if (D.running === 'demo') { stopRun(); resetRun(); renderView(); return; }
  if (D.running === 'tempo') return;
  startTimeline(true);
}
function restartRun() {
  if (D.mode === 'tempo') return startTimeline(false);
  D.finished = null;
  if (Mic.on) beginWait(); else { stopRun(); resetRun(); renderView(); }
}

function finishRun() {
  const mode = D.running;
  cancelAnimationFrame(D.raf);
  D.running = null;
  Scoring.active = false;
  hideLine();
  const total = pitchedCount() || 1;
  const res = { mode, bpm: D.bpm, clean: D.clean, retry: D.retry, missed: D.missed, total,
    score: Math.floor(Scoring.score), bestMult: Scoring.bestMult };
  res.acc = mode === 'wait' ? D.clean / total : (D.clean + 0.5 * D.retry) / total;
  res.pass = res.acc >= PASS_ACC;
  // Practising a few bars counts as practice time, not as a pass.
  res.partial = D.from !== 1 || D.to !== D.nBars;
  res.newBest = Store.record(D.key, res.partial ? { ...res, pass: false } : res);
  D.finished = res;
  drawScore();
  // Wait for me starts over from the top right away; the results stay on screen above the music.
  if (mode === 'wait' && Mic.on) {
    resetRun();
    D.running = 'wait';
    Scoring.active = true;
    D.restarted = true;
  }
  renderView();
}

/* ---------- The live pitch line on the staff ---------- */
function showLine(cents, state) {
  const el = document.getElementById('pitch-line');
  const lay = D.layout;
  const vn = lay && lay.vexNotes[D.i];
  if (!el || !vn) return;
  const ys = vn.getYs && vn.getYs();
  const L = lay.lines[lay.lineOf[D.i]];
  if (!ys || !ys.length || !L) return hideLine();
  const far = Math.abs(cents) >= FAR_CENTS;
  const off = -(clamp(cents, -60, 60) / 60) * L.spacing * 1.6; // sharp = above the note
  el.style.top = (ys[0] + off) + 'px';
  el.style.left = L.x0 + 'px';
  el.style.width = (L.x1 - L.x0) + 'px';
  el.className = 'pitch-line show ' + (far ? 'far' : state);
  el.firstChild.textContent = far ? noteLabel(Math.round(midiFloatOf(Live.freq))) + (cents > 0 ? ' ↑' : ' ↓') : '';
}
function hideLine() {
  const el = document.getElementById('pitch-line');
  if (el) el.className = 'pitch-line';
}

/* ---------- Drawing ---------- */
function drawScore() {
  const wrap = document.getElementById('score');
  if (!wrap || !D) return;
  if (!window.Vex) { wrap.innerHTML = '<p class="empty">The notation library did not load. See the message at the top.</p>'; return; }
  fitScoreHeight(wrap);
  const host = wrap.querySelector('.host');
  const showCursor = D.running || !D.finished ? (D.running === 'tempo' || D.running === 'demo' ? D.cursor : D.i) : null;
  try {
    D.layout = renderScore(wrap, host, { notes: D.notes, piece: D.piece, measureLengths: D.measureLengths, slurs: D.slurs,
      states: D.states, firstBar: D.from, cursor: showCursor != null && showCursor >= 0 ? showCursor : null, finalBar: D.to === D.nBars });
  } catch (e) {
    console.error(e);
    host.innerHTML = `<p class="empty">Could not draw this piece: ${e.message}</p>`;
    return;
  }
  // Keep the current line at the top, so the next one is already in view.
  const li = D.layout.lineOf[Math.max(0, showCursor == null ? 0 : showCursor)] || 0;
  if (li !== D.lastLine) {
    D.lastLine = li;
    const L = D.layout.lines[li];
    if (L) wrap.scrollTo({ top: Math.max(0, L.y - 4), behavior: 'smooth' });
  }
}

function drawStatus(now) {
  const el = document.getElementById('status');
  if (!el || !D) return;
  let html = '';
  const n = D.notes[D.i];
  if (D.running === 'wait' && n) {
    const pos = D.notes.slice(0, D.i + 1).filter(x => !x.isRest).length;
    const pct = Math.min(100, Math.round(D.hold / requiredHoldMs(n) * 100));
    html = `Play <b>${spelled(n)}</b>${n.position === 3 ? ' (3rd position)' : ''} · note ${pos} / ${pitchedCount()}` +
      (pct > 0 ? ` · holding ${pct}%` : '') + (D.retry ? ` · ${D.retry} not first time` : '') + (D.missed ? ` · ${D.missed} skipped` : '');
  } else if (D.running === 'tempo' || D.running === 'demo') {
    if (now && now < D.t0) html = `Count-in: <b>${Math.ceil((D.t0 - now) / D.mpb)}</b>`;
    else html = D.running === 'demo' ? 'Listening…' : 'Play!' + (n && !n.isRest ? ` <b>${spelled(n)}</b>` : '');
  } else if (!D.finished) {
    html = D.mode === 'tempo' ? `Press <b>Start</b>. You get one bar of count-in at ${D.bpm} bpm.`
      : 'Press <b>Start</b> to turn on the microphone. The music waits for you on every note.';
  }
  if (el.innerHTML !== html) el.innerHTML = html;
}

function renderDock() {
  const dock = document.getElementById('dock');
  const show = currentView === 'drill' && Mic.on;
  dock.hidden = !show;
  if (!show) { dock.innerHTML = ''; return; }
  if (dock.childElementCount) return;
  dock.append(
    h('div', { class: 'pbadge silence', 'data-m': 'badge' }, '—'),
    h('div', { class: 'pnote', 'data-m': 'note' }, '—'),
    h('div', { class: 'gauge' }, h('div', { class: 'gauge-track' }, h('div', { class: 'gauge-needle', 'data-m': 'needle' })), h('div', { class: 'pcents', 'data-m': 'cents' }, '— cents')),
    h('span', { class: 'spacer' }),
    hud());
  Scoring.paint();
}
const hud = () => h('div', { class: 'hud' },
  h('div', {}, h('span', {}, 'Score'), h('b', { 'data-hud': 'score' }, Math.floor(Scoring.score))),
  h('div', {}, h('span', {}, 'Multiplier'), h('b', { 'data-hud': 'mult' }, '×' + Scoring.mult)));

function drillView() {
  const { track, level, idx } = D;
  const rec = Store.level(D.key);
  const root = h('div');
  root.append(h('div', { class: 'drill-head' },
    h('button', { onclick: () => go('home') }, '← Home'),
    h('div', { style: 'flex:1;min-width:200px' },
      h('div', { class: 'muted small' }, `${track.name} · ${idx + 1} of ${track.levels.length}`),
      h('h2', {}, level.name),
      h('div', { class: 'muted small' }, [level.desc, D.piece.partNote, `${keyName(D.piece.fifths)} major · ${D.piece.beats}/${D.piece.beatType}`].filter(Boolean).join(' · '))),
    h('div', { class: 'muted small', style: 'text-align:right' }, h('span', { class: 'stars' }, stars(rec.passes)), h('br'),
      rec.bestAcc != null ? `Best ${Math.round(rec.bestAcc * 100)}%` : '', rec.bestScore ? ` · ${rec.bestScore} pts` : '')));

  const theoryId = level.theory || (D.piece.notes.some(n => n.position === 3) ? 'third' : D.piece.slurs.length ? 'slurs' : null);
  if (theoryId && (!Store.data.theorySeen[theoryId] || D.showTheory)) {
    const card = THEORY[theoryId];
    root.append(h('div', { class: 'card theory', style: 'margin-top:12px' }, h('h3', {}, card.title), h('div', { html: card.html }),
      h('button', { class: 'primary', onclick: () => { Store.data.theorySeen[theoryId] = true; Store.save(); D.showTheory = false; renderView(); } }, 'Got it')));
  }

  const busy = D.running === 'tempo' || D.running === 'demo';
  const controls = h('div', { class: 'row', style: 'margin-top:12px' });
  controls.append(h('div', { class: 'seg' }, ['wait', 'tempo'].map(m => h('button', {
    class: D.mode === m ? 'sel' : '', title: m === 'wait' ? 'The music waits on each note until you play it in tune' : 'Play in time with the metronome',
    onclick: () => { stopRun(); D.mode = m; D.finished = null; resetRun(); renderView(); if (m === 'wait' && Mic.on) beginWait(); } },
  m === 'wait' ? 'Wait for me' : 'In tempo'))));
  const bpmOut = h('span', { style: 'min-width:60px' }, `${D.bpm} bpm`);
  controls.append(h('label', { class: 'row' }, 'Tempo', h('input', { type: 'range', min: 30, max: 160, step: 5, value: D.bpm, disabled: busy,
    oninput: e => { D.bpm = +e.target.value; bpmOut.textContent = `${D.bpm} bpm`; drawStatus(); } }), bpmOut));
  if (D.nBars > 1) {
    const num = (val, set) => h('input', { type: 'number', min: 1, max: D.nBars, value: val, style: 'width:56px', disabled: busy,
      onchange: e => { set(clamp(+e.target.value || 1, 1, D.nBars)); if (D.from > D.to) D.to = D.from; newSection(); if (Mic.on && D.mode === 'wait') beginWait(); } });
    controls.append(h('label', { class: 'row', title: 'Practise just these bars; Wait for me loops them' }, 'Bars', num(D.from, v => { D.from = v; }), 'to', num(D.to, v => { D.to = v; }),
      D.from !== 1 || D.to !== D.nBars ? h('button', { class: 'ghost small', onclick: () => { D.from = 1; D.to = D.nBars; newSection(); if (Mic.on && D.mode === 'wait') beginWait(); } }, 'All') : null));
  }
  controls.append(h('span', { class: 'spacer' }));
  if (theoryId && Store.data.theorySeen[theoryId] && !D.showTheory) controls.append(h('button', { onclick: () => { D.showTheory = true; renderView(); } }, '? Theory'));
  controls.append(D.running === 'demo'
    ? h('button', { class: 'on', onclick: listen, title: 'Keyboard: L' }, '■ Stop')
    : h('button', { disabled: D.running === 'tempo', onclick: listen, title: 'Hear it played at this tempo (keyboard: L)' }, '▶ Listen'));
  controls.append(h('button', { onclick: restartRun, title: 'Start over (keyboard: R)' }, '↺ Restart'));
  controls.append(h('button', { onclick: () => editLevel(D.track.id, D.level), title: D.level.mine ? 'Edit this piece' : 'Edit a copy in the editor' }, '✎ Edit'));
  if (idx + 1 < track.levels.length) controls.append(h('button', { onclick: () => openLevel(track.id, idx + 1) }, 'Next →'));
  if (D.mode === 'wait') {
    controls.append(D.running === 'wait'
      ? h('button', { class: 'primary', onclick: () => { stopRun(); resetRun(); renderView(); }, title: 'Keyboard: Space' }, '■ Stop')
      : h('button', { class: 'primary', disabled: busy, onclick: beginWait, title: 'Keyboard: Space' }, '🎤 Start'));
  } else {
    controls.append(D.running === 'tempo'
      ? h('button', { class: 'primary', onclick: () => { stopRun(); resetRun(); renderView(); }, title: 'Keyboard: Space' }, '■ Stop')
      : h('button', { class: 'primary', disabled: D.running === 'demo', onclick: () => startTimeline(false), title: 'Keyboard: Space' }, '🎤 Start'));
  }
  root.append(controls);

  // Results go above the music: the music fills the space down to the bottom of the window.
  if (D.finished) root.append(resultsCard(D.finished));
  root.append(h('div', { class: 'status', id: 'status' }));
  root.append(h('div', { class: 'score-wrap', id: 'score', 'data-halo': '' }, h('div', { class: 'host' }), h('div', { class: 'pitch-line', id: 'pitch-line' }, h('span'))));
  return root;
}

function resultsCard(res) {
  const pct = Math.round(res.acc * 100);
  const stats = [h('div', {}, h('span', {}, 'Accuracy'), `${pct}%`),
    h('div', {}, h('span', {}, res.mode === 'wait' ? 'In tune first time' : 'In tune'), `${res.clean} / ${res.total}`)];
  if (res.retry) stats.push(h('div', {}, h('span', {}, res.mode === 'wait' ? 'Needed another go' : 'Close'), res.retry));
  if (res.missed) stats.push(h('div', {}, h('span', {}, res.mode === 'wait' ? 'Skipped' : 'Missed'), res.missed));
  stats.push(h('div', {}, h('span', {}, 'Score'), res.score), h('div', {}, h('span', {}, 'Best multiplier'), '×' + res.bestMult));
  if (res.mode === 'tempo') stats.push(h('div', {}, h('span', {}, 'Tempo'), `${res.bpm} bpm`));
  let msg;
  if (res.partial) msg = 'Section done. Play the whole piece to earn a star.';
  else if (res.pass) msg = res.mode === 'wait' ? 'Passed! Next challenge: play it in tempo.' : 'Passed!';
  else msg = res.mode === 'tempo' ? 'Not quite. Lower the tempo, or practise it with Wait for me first.' : 'Not quite. Listen for each note before you move on.';
  const inSession = session && session.items[session.n] && session.items[session.n].trackId === D.track.id && session.n + 1 < session.items.length;
  return h('div', { class: 'card results ' + (res.pass ? 'pass' : 'fail'), style: 'margin-top:12px' },
    h('div', { class: 'big' }, (res.pass ? '✓ ' : '') + msg, res.newBest && res.score > 0 ? h('span', { class: 'badge-new' }, 'New best score') : null),
    h('div', { class: 'stats' }, stats),
    D.running === 'wait' ? h('p', { class: 'muted small' }, 'Starting over from the top. Keep playing, or change the bars or tempo above.') : null,
    h('div', { class: 'row' },
      D.running === 'wait' ? null : h('button', { onclick: restartRun }, 'Same again'),
      D.idx + 1 < D.track.levels.length ? h('button', { class: res.pass && !inSession ? 'primary' : '', onclick: () => openLevel(D.track.id, D.idx + 1) }, 'Next piece →') : null,
      inSession ? h('button', { class: 'primary', onclick: () => nextInSession() }, 'Next in session →') : null,
      h('button', { class: 'ghost', onclick: () => { D.finished = null; renderView(); } }, 'Hide')));
}

/* =========================================================================
   Tuner: any note, scored on time in tune
   ========================================================================= */
const T = { history: [], lastSample: -Infinity, last: null };
const HISTORY_MS = 30000;

function tunerHandler(dt, now) {
  const r = tunerGrade(dt);
  if (now - T.lastSample >= 150) {
    T.history.push({ t: now, state: r.state, midi: r.midi == null ? null : r.midi });
    T.lastSample = now;
  }
  while (T.history.length && T.history[0].t < now - HISTORY_MS) T.history.shift();
  drawHistory(now);
  return r;
}

function drawHistory(now) {
  const cv = document.getElementById('history');
  if (!cv) return;
  const w = cv.clientWidth, hgt = cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, hgt);
  const yOf = m => hgt - (clamp(m, 53, 96) - 53) / (96 - 53) * hgt;
  const rgb = s => ({ green: '62,207,106', yellow: '232,179,57', red: '229,72,77' }[s] || '120,124,136');
  c.lineWidth = 2.5; c.lineCap = 'round';
  let prev = null;
  for (const s of T.history) {
    if (s.midi == null) { prev = null; continue; }
    const pt = { x: w - (now - s.t) / HISTORY_MS * w, y: yOf(s.midi) };
    c.strokeStyle = c.fillStyle = `rgb(${rgb(s.state)})`;
    if (prev) { c.beginPath(); c.moveTo(prev.x, prev.y); c.lineTo(pt.x, pt.y); c.stroke(); }
    c.beginPath(); c.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2); c.fill();
    prev = pt;
  }
}

/** The debug panel: raw numbers, waveform and spectrum, drawn only while it's open. */
function drawDebug() {
  const det = document.getElementById('debug');
  if (!det || !det.open || !Mic.on) return;
  document.getElementById('dbg-nums').textContent =
    `Raw frequency: ${Live.freq ? Live.freq.toFixed(2) + ' Hz' : '—'} · confidence ${Live.conf.toFixed(3)} · RMS ${Live.rms.toFixed(4)}`;
  const plot = (id, draw) => {
    const cv = document.getElementById(id);
    const w = cv.clientWidth, hgt = cv.clientHeight;
    if (cv.width !== w) { cv.width = w; cv.height = hgt; }
    const c = cv.getContext('2d');
    c.clearRect(0, 0, w, hgt);
    draw(c, w, hgt);
  };
  plot('dbg-wave', (c, w, hgt) => {
    c.strokeStyle = '#3ecf6a'; c.beginPath();
    const buf = Mic.buf, step = buf.length / w;
    for (let x = 0; x < w; x++) { const y = hgt / 2 - (buf[Math.floor(x * step)] || 0) * hgt / 2 * 0.95; x ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
  });
  plot('dbg-spec', (c, w, hgt) => {
    Mic.analyser.getByteFrequencyData(Mic.fbuf);
    const nyq = Sound.ctx().sampleRate / 2, maxBin = Math.floor(Math.min(8000, nyq) / nyq * Mic.fbuf.length);
    c.beginPath(); c.moveTo(0, hgt);
    for (let x = 0; x < w; x++) c.lineTo(x, hgt - (Mic.fbuf[Math.floor(x / w * maxBin)] || 0) / 255 * hgt);
    c.lineTo(w, hgt); c.closePath();
    c.fillStyle = 'rgba(91,141,238,.25)'; c.fill(); c.strokeStyle = '#5b8dee'; c.stroke();
  });
}

/* =========================================================================
   Tune strings: G D A E, each held in tune once
   ========================================================================= */
const S = { done: {}, holdMs: 0, held: null, active: null, complete: false };
function resetStrings() { Object.assign(S, { done: { G: false, D: false, A: false, E: false }, holdMs: 0, held: null, active: null, complete: false }); }
resetStrings();

function stringsHandler(dt) {
  const rd = smoothedReading(nearestOpenString);
  if (!rd) { S.holdMs = 0; S.held = null; paintStrings(null); return { state: Live.silent ? 'silence' : 'nopitch' }; }
  const state = Grade.state(rd.cents, dt);
  Vibrato.track(rd.cents, state, dt);
  const letter = OPEN_STRING_LETTER[mod(rd.midi, 12)];
  if (state === 'green') {
    S.holdMs = S.held === letter ? S.holdMs + dt : dt;
    S.held = letter;
    if (S.holdMs >= HOLD_MIN_MS && !S.done[letter]) S.done[letter] = true;
  } else { S.holdMs = 0; S.held = null; }
  paintStrings(letter);
  if (!S.complete && Object.values(S.done).every(Boolean)) {
    S.complete = true;
    Store.day().strings = true;
    Store.save();
    setTimeout(() => { Mic.stop(); if (currentView === 'strings') renderView(); }, 0);
  }
  return { state, cents: rd.ema, label: noteLabel(rd.midi), target: letter + ' string' };
}
function paintStrings(active) {
  for (const b of document.querySelectorAll('.sbox')) {
    b.classList.toggle('done', !!S.done[b.dataset.s]);
    b.classList.toggle('active', b.dataset.s === active);
  }
}

          ? h('button', { class: 'primary', onclick: nextInSession }, 'Next in session →') : null,
        h('button', { onclick: () => { resetStrings(); renderView(); } }, 'Again'))));
    return root;
  }
  root.append(h('div', { class: 'card' },
    h('h2', {}, 'Tune strings'),
    h('p', { class: 'muted small', style: 'margin-top:0' }, `Play each open string and hold it in tune for a moment. A4 = ${settings.a4} Hz; change it in Settings.`),
    h('div', { class: 'strings' }, ['G', 'D', 'A', 'E'].map(s => h('div', { class: 'sbox' + (S.done[s] ? ' done' : ''), 'data-s': s }, s))),
    meter(),

      Mic.on ? h('button', { class: 'primary', onclick: () => Mic.stop() }, '■ Stop') : h('button', { class: 'primary', onclick: async () => { if (await Mic.start()) renderView(); } }, '🎤 Start'),

  return root;
}

/* =========================================================================
   Editor: write or change a piece; it's saved to My pieces
   ========================================================================= */
let ED = null;
const ED_DURS = [['w', '𝅝', 'Whole'], ['h', '𝅗𝅥', 'Half'], ['q', '♩', 'Quarter'], ['8', '♪', 'Eighth'], ['16', '𝅘𝅥𝅯', '16th']];
const ED_MIN_MIDI = 53, ED_MAX_MIDI = 96; // F3 to C7
const TREBLE_TOP_DIATONIC = 5 * 7 + 3;   // F5, the top line of the treble staff

function blankEditor() {
  return { pieceId: null, title: '', composer: '', fifths: 0, beats: 4, beatType: 4, bpm: settings.editorBpm, notes: [], slurs: [], measureLengths: null,
    slurOpen: null, pos3: false, dur: 'q', dotted: false, pitch: 69, snapshot: null, dirty: false };
}
function loadEditorState() {
  if (ED) return;
  const d = Store.data.draft;
  ED = d && Array.isArray(d.notes) ? { ...blankEditor(), ...d, snapshot: null } : blankEditor();
}
function saveDraft() {
  const { snapshot, ...rest } = ED;
  Store.data.draft = rest;
  Store.save();
}
function edChanged() { ED.dirty = true; saveDraft(); drawEditor(); }

/** Opens a level's piece in the editor: My pieces are edited in place, library pieces as a copy. */
function editLevel(trackId, level) {
  let p;
  try { p = levelScore(level); } catch (e) { toast(`Couldn't open it: ${e.message}`); return; }
  if (ED && ED.dirty && ED.notes.length) toast('Your unsaved editor piece was replaced. (Saved pieces are safe in My pieces.)', 4000);
  ED = { ...blankEditor(), pieceId: level.mine ? level.id : null, title: level.mine ? level.name : `${level.name} (my copy)`,
    composer: p.composer, fifths: p.fifths, beats: p.beats, beatType: p.beatType, bpm: p.bpm || settings.editorBpm,
    notes: p.notes.map(n => ({ ...n })), slurs: p.slurs.map(s => ({ ...s })), measureLengths: p.measureLengths.slice() };
  saveDraft();
  go('editor');
}

/** Bar lengths: the piece's own bars while they're intact, then new notes grouped by the time signature. */
function editorMeasureLengths() {
  const out = [];
  let sum = 0;
  for (const l of ED.measureLengths || []) {
    if (sum + l > ED.notes.length) break;
    out.push(l); sum += l;
  }
  for (const g of groupNotesByBeats(ED.notes.slice(sum), barBeatsOf(ED))) out.push(g.length);
  return out;
}
function barStatus() {
  const lens = editorMeasureLengths(), bb = barBeatsOf(ED);
  if (!lens.length) return { bar: 1, used: 0, bb };
  const last = ED.notes.slice(ED.notes.length - lens[lens.length - 1]);
  const used = last.reduce((a, n) => a + noteBeats(n), 0);
  return used >= bb - 1e-6 ? { bar: lens.length + 1, used: 0, bb } : { bar: lens.length, used, bb };
}
const fmtBeats = n => String(Math.round(n * 100) / 100);
const edSlurs = () => ED.slurs.concat(ED.slurOpen != null && ED.notes.length - 1 > ED.slurOpen ? [{ start: ED.slurOpen, stop: ED.notes.length - 1 }] : []);
const edPiece = () => ({ title: ED.title.trim() || 'Untitled', composer: ED.composer.trim(), fifths: ED.fifths, beats: ED.beats, beatType: ED.beatType,
  bpm: ED.bpm, clef: 'treble', notes: ED.notes, slurs: edSlurs(), measureLengths: editorMeasureLengths() });

function edStatus(msg, error) {
  const el = document.getElementById('ed-msg');
  if (el) { el.textContent = msg || ''; el.style.color = error ? 'var(--bad)' : ''; }
}

/** Adds a note (pitch from a staff click or a letter key, else the Pitch menu) or a rest. */
function addNote(isRest, pitch) {
  const dur = DUR_BEATS[ED.dur] * (ED.dotted ? 1.5 : 1);
  const st = barStatus();
  if (st.used > 0 && dur > st.bb - st.used + 1e-6) {
    const left = st.bb - st.used;
    return edStatus(`Only ${fmtBeats(left)} beat${left === 1 ? '' : 's'} left in bar ${st.bar}. Pick a shorter note, or undo.`, true);
  }
  let n;
  if (isRest) n = { isRest: true, midi: null, vexDuration: ED.dur, dotted: ED.dotted };
  else {
    if (!pitch) {
      const m = ED.pitch, i = mod(m, 12);
      // Spell black keys the way the key signature leans (B♭ in F major, F♯ in G major).
      const flat = ED.fifths < 0 && NOTE_NAMES[i].length > 1;
      const name = flat ? NOTE_NAMES_FLAT[i] : NOTE_NAMES[i];
      pitch = { midi: m, step: name[0], alter: name.length > 1 ? (flat ? -1 : 1) : 0, octave: Math.floor(m / 12) - 1 };
      if (flat && name[0] === 'C') pitch.octave = Math.floor((m + 1) / 12) - 1; // C♭ belongs to the next octave up
    }
    n = { isRest: false, vexDuration: ED.dur, dotted: ED.dotted, ...pitch };
    if (ED.pos3) n.position = 3;
    ED.pitch = n.midi;
  }
  ED.notes.push(n);
  edStatus('');
  if (!isRest) Sound.playNotes([{ ...n, vexDuration: '8', dotted: false }], [], 120, performance.now() + 20);
  edChanged();
}

function undoNote() {
  if (!ED.notes.length) return;
  ED.notes.pop();
  const n = ED.notes.length;
  ED.slurs = ED.slurs.filter(s => s.start < n).map(s => ({ start: s.start, stop: Math.min(s.stop, n - 1) })).filter(s => s.stop > s.start);
  if (ED.slurOpen != null && ED.slurOpen >= n) ED.slurOpen = null;
  edChanged();
}

function toggleSlur() {
  if (ED.slurOpen != null) {
    if (ED.notes.length - 1 > ED.slurOpen) ED.slurs.push({ start: ED.slurOpen, stop: ED.notes.length - 1 });
    ED.slurOpen = null;
  } else ED.slurOpen = ED.notes.length;
  edChanged();
  renderView();
}

function letterNote(step) {
  let ref = ED.pitch;
  for (let i = ED.notes.length - 1; i >= 0; i--) if (!ED.notes[i].isRest) { ref = ED.notes[i].midi; break; }
  const alter = keyAccidentalMap(ED.fifths)[step] || 0;
  let best = null;
  for (let octave = 2; octave <= 7; octave++) {
    const midi = midiOfNote(step, alter, octave);
    if (midi < ED_MIN_MIDI || midi > ED_MAX_MIDI) continue;
    if (!best || Math.abs(midi - ref) < Math.abs(best.midi - ref)) best = { midi, step, alter, octave };
  }
  if (best) addNote(false, best);
}

/** Staff click/hover: snap to the nearest line or space of the nearest staff, read in the key. */
function pitchAtPointer(e) {
  const wrap = document.getElementById('edscore');
  const svg = wrap && wrap.querySelector('svg');
  if (!svg || !ED.layout || !ED.layout.lines.length) return null;
  const rect = svg.getBoundingClientRect();
  const y = e.clientY - rect.top;
  let g = null, best = Infinity;
  for (const L of ED.layout.lines) { const d = Math.abs(y - (L.top + 2 * L.spacing)); if (d < best) { best = d; g = L; } }
  const half = g.spacing / 2;
  let d = TREBLE_TOP_DIATONIC - Math.round((y - g.top) / half);
  const km = keyAccidentalMap(ED.fifths);
  const at = dd => {
    const step = DIATONIC_STEPS[mod(dd, 7)], octave = Math.floor(dd / 7), alter = km[step] || 0;
    return { midi: midiOfNote(step, alter, octave), step, alter, octave };
  };
  let p = at(d);
  while (p.midi < ED_MIN_MIDI) p = at(++d);
  while (p.midi > ED_MAX_MIDI) p = at(--d);
  return { pitch: p, y: g.top + (TREBLE_TOP_DIATONIC - d) * half, rect };
}

/* ---------- Whole-piece changes ---------- */
function shiftNote(n, steps, semitones, keyMap) {
  if (n.isRest) return { ...n };
  const d = n.octave * 7 + DIATONIC_STEPS.indexOf(n.step) + steps;
  const octave = Math.floor(d / 7), step = DIATONIC_STEPS[mod(d, 7)];
  let alter, midi;
  if (semitones == null) {
    // Same key: keep any accidental the note had relative to the key signature.
    alter = (keyMap[step] || 0) + ((n.alter || 0) - (keyMap[n.step] || 0));
    midi = midiOfNote(step, 0, octave) + alter;
  } else {
    midi = n.midi + semitones;
    alter = midi - midiOfNote(step, 0, octave);
  }
  if (Math.abs(alter) > 2) {
    const i = mod(midi, 12);
    return { ...n, midi, step: NOTE_NAMES[i][0], alter: NOTE_NAMES[i].length > 1 ? 1 : 0, octave: Math.floor(midi / 12) - 1, position: 3, openString: false };
  }
  return { ...n, midi, step, alter, octave, position: 3, openString: false };
}
function wholePiece(kind) {
  if (!ED.notes.length) return edStatus('Add or load some notes first.', true);
  ED.snapshot = { notes: ED.notes.map(n => ({ ...n })), fifths: ED.fifths, pos3: ED.pos3 };
  const km = keyAccidentalMap(ED.fifths);
  let msg;
  if (kind === 'third') {
    ED.notes.forEach(n => { if (!n.isRest) n.position = 3; });
    const far = ED.notes.filter(n => !n.isRest && !thirdPositionFingering(n)).length;
    msg = 'Every note marked 3rd position.' + (far ? ` ${far} note${far === 1 ? ' is' : 's are'} out of 3rd position's reach and show no finger.` : '');
  } else if (kind === 'first') {
    ED.notes.forEach(n => { delete n.position; delete n.openString; });
    msg = 'Every note back in 1st position.';
  } else if (kind === 'fingers') {
    // Same fingers, hand moved up: fingered notes go up two letter names; open strings stay open.
    ED.notes = ED.notes.map(n => (!n.isRest && OPEN_STRING_MIDI.includes(n.midi) && !n.alter) ? { ...n, position: 3, openString: true } : shiftNote(n, 2, null, km));
    msg = 'Moved into 3rd position with the same fingers. It now sounds higher, in the same key.';
  } else if (kind === 'fourth') {
    let f = ED.fifths - 1;
    if (f < -7) f += 12;
    ED.notes = ED.notes.map(n => shiftNote(n, 3, 5));
    ED.fifths = f;
    msg = `Transposed up a 4th to ${pretty(keyName(f))} major, in 3rd position.`;
  }
  ED.pos3 = kind !== 'first';
  edChanged();
  renderView();
  edStatus(msg);
}
function revertWhole() {
  if (!ED.snapshot) return;
  Object.assign(ED, { notes: ED.snapshot.notes, fifths: ED.snapshot.fifths, pos3: ED.snapshot.pos3, snapshot: null });
  edChanged();
  renderView();
  edStatus('Reverted.');
}

/* ---------- Saving ---------- */
function saveEditor(asNew) {
  if (!ED.notes.length) { edStatus('Add at least one note first.', true); return null; }
  if (ED.slurOpen != null) toggleSlur();
  const p = edPiece();
  const xml = notesToMusicXML(p);
  let entry;
  if (ED.pieceId && !asNew && Store.data.pieces.some(x => x.id === ED.pieceId)) entry = Store.updatePiece(ED.pieceId, { title: p.title, composer: p.composer, xml });
  else { entry = Store.addPiece({ title: p.title, composer: p.composer, xml, source: 'editor' }); ED.pieceId = entry.id; }
  ED.title = p.title;
  ED.dirty = false;
  saveDraft();
  toast(`Saved "${entry.title}" in My pieces`);
  renderView();
  return entry;
}
function practiseEditor() {
  const entry = ED.dirty || !ED.pieceId ? saveEditor(false) : Store.data.pieces.find(x => x.id === ED.pieceId);
  if (!entry) return;
  const idx = TRACK_BY_ID.mine.levels.findIndex(l => l.id === entry.id);
  if (idx >= 0) openLevel('mine', idx);
}

function edListen(btn) {
  if (ED.playing) { Sound.stopAll(); clearTimeout(ED.playing); ED.playing = null; btn.textContent = '▶ Listen'; return; }
  if (!ED.notes.length) return;
  const { totalBeats } = Sound.playNotes(ED.notes, edSlurs(), ED.bpm, performance.now() + 80);
  btn.textContent = '■ Stop';
  ED.playing = setTimeout(() => { ED.playing = null; btn.textContent = '▶ Listen'; }, totalBeats * 60000 / ED.bpm + 300);
}

function drawEditor() {
  const wrap = document.getElementById('edscore');
  if (!wrap || !window.Vex) return;
  try {

function editorKey(e) {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'ArrowDown') { ED.pitch = clamp(ED.pitch + (k === 'ArrowUp' ? 1 : -1), ED_MIN_MIDI, ED_MAX_MIDI); saveDraft(); drawEditor(); return true; }
  if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const i = ED_DURS.findIndex(d => d[0] === ED.dur);
    ED.dur = ED_DURS[clamp(i + (k === 'ArrowRight' ? 1 : -1), 0, ED_DURS.length - 1)][0];
    saveDraft(); renderView(); return true;
  }
  if (k === ' ') { addNote(false); return true; }
  if (k === 'Backspace') { undoNote(); return true; }
  if (k === '.') { ED.dotted = !ED.dotted; saveDraft(); renderView(); return true; }
  if (k === '3') { ED.pos3 = !ED.pos3; saveDraft(); renderView(); return true; }
  if (/^[rR]$/.test(k)) { addNote(true); return true; }
  if (/^[sS]$/.test(k)) { toggleSlur(); return true; }
  if (/^[lL]$/.test(k)) { const b = [...document.querySelectorAll('#view .toolbar button')].find(x => /Listen|Stop/.test(x.textContent)); if (b) edListen(b); return true; }
  if (/^[a-gA-G]$/.test(k)) { letterNote(k.toUpperCase()); return true; }
  return false;
}

    const idx = mine.levels.map((l, i) => ({ i, last: Store.level(levelKey('mine', l)).last || '' })).sort((a, b) => a.last.localeCompare(b.last))[0].i;

/* =========================================================================
   Views and routing. The hash names the page, so reload and Back land in the same place:
     #home #tuner #strings #editor #theory #settings #drill/<track>/<piece>
   ========================================================================= */
let currentView = 'home';
const MIC_VIEWS = ['drill', 'tuner', 'strings'];

function renderView() {
  const view = document.getElementById('view');
  view.innerHTML = '';
  for (const b of document.querySelectorAll('[data-nav]')) b.classList.toggle('primary', b.dataset.nav === currentView);
  renderDock();
  if (currentView === 'home') view.append(homeView());
  else if (currentView === 'drill' && D) { view.append(drillView()); drawScore(); drawStatus(); }
  else if (currentView === 'tuner') view.append(tunerView());
  else if (currentView === 'strings') view.append(stringsView());
  else if (currentView === 'editor') { view.append(editorView()); drawEditor(); }
  else if (currentView === 'theory') view.append(theoryView());
  else if (currentView === 'settings') view.append(settingsView());
  Scoring.paint();
  syncRoute();
  Wake.update();
}

function go(v) {
  if (v !== 'drill') { stopRun(); D = null; }
  if (!MIC_VIEWS.includes(v)) Mic.stop();
  if (ED && ED.playing) { Sound.stopAll(); clearTimeout(ED.playing); ED.playing = null; }
  Live.handler = v === 'tuner' ? tunerHandler : v === 'strings' ? stringsHandler : null;
  Live.onStop = v === 'tuner' ? tunerStopped : v === 'strings' ? () => { if (currentView === 'strings') renderView(); } : null;
  Live.debug = v === 'tuner' ? drawDebug : null;
  Scoring.active = v === 'tuner' && Mic.on;
  currentView = v;
  renderView();
  window.scrollTo(0, 0);
}

function currentRoute() {
  if (currentView === 'drill' && D) return `drill/${D.track.id}/${encodeURIComponent(D.level.id)}`;
  return currentView;
}
function syncRoute() {
  const r = '#' + currentRoute();
  if (location.hash !== r) location.hash = r;
}
function openRoute() {
  const r = location.hash.slice(1);
  if (r === currentRoute() && document.getElementById('view').childElementCount) return;
  const [view, trackId, raw = ''] = r.split('/');
  if (view === 'drill') {
    const track = TRACK_BY_ID[trackId];
    const idx = track ? track.levels.findIndex(l => l.id === decodeURIComponent(raw)) : -1;
    if (idx >= 0) { session = null; return openLevel(trackId, idx); }
  }
  go(['tuner', 'strings', 'editor', 'theory', 'settings'].includes(view) ? view : 'home');
}

/* =========================================================================
