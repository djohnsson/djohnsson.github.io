<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daniel's violin trainer</title>
<style>
:root {
  --bg: #0f1115; --panel: #1a1d24; --card: rgba(26,29,36,0.82); --ink: #e8e9ec; --muted: #8b8f9a; --line: #2a2f3a;
  --accent: #5b8dee; --accent-soft: rgba(91,141,238,0.18); --ok: #3ecf6a; --warn: #e8b339; --bad: #e5484d; --gray: #4a4e58;
  --staff-bg: rgba(17,20,26,0.9);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; border-color: transparent; }
button.on { border-color: var(--accent); background: var(--accent-soft); }
button:disabled { opacity: .5; cursor: default; }
select, input[type=number], input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 6px; }
input[type=text] { padding: 6px 8px; }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
h2 { font-size: 20px; } h3 { font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* The orbiting particle halo sits behind everything; cards are translucent so it shows through. */
#halo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
header.top, main, #dock { position: relative; z-index: 1; }

header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .brand { font-weight: 700; font-size: 17px; margin-right: 8px; }
header.top nav { display: flex; gap: 4px; flex-wrap: wrap; }
header.top .chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: transparent; }
.chip.on { color: var(--ok); border-color: var(--ok); }
.chip.warn { color: var(--warn); border-color: var(--warn); }

main { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.levels { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.lvl { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; padding: 6px 10px; }
.lvl .n { width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .t { flex: 1; }
.lvl .stars, .stars { color: #e0a800; letter-spacing: 1px; font-size: 13px; }
.lvl.locked { opacity: .55; }
.lvl.current { border-color: var(--accent); background: var(--accent-soft); }
.mine-row { display: flex; gap: 6px; align-items: center; }
.mine-row .lvl { flex: 1; }
.mine-row > button:not(.lvl) { padding: 6px 8px; }

.session li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.session li:last-child { border-bottom: 0; }
.session ol { list-style: none; margin: 0; padding: 0; }
.session .done { color: var(--ok); font-weight: 700; width: 18px; }

.drill-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.sel { background: var(--accent); color: #fff; }
.status { font-size: 16px; min-height: 24px; margin: 8px 0; }
.status b { color: var(--accent); }

.score-wrap { background: var(--staff-bg); border-radius: 10px; border: 1px solid var(--line); overflow: auto; position: relative; }
.score-wrap svg { display: block; }
.score-wrap .empty { padding: 30px; text-align: center; color: var(--muted); }
/* Live pitch on the staff: a line across the current system, nudged above/below the target
   notehead by how sharp/flat you are. Dashed with the played note's name when you're a whole
   note or more away (usually the wrong string or finger). */
.pitch-line { position: absolute; height: 3px; margin-top: -1px; pointer-events: none; display: none; z-index: 2; border-radius: 2px; }
.pitch-line.show { display: block; }
.pitch-line.green { background: var(--ok); box-shadow: 0 0 10px rgba(62,207,106,.6); }
.pitch-line.yellow { background: var(--warn); box-shadow: 0 0 10px rgba(232,179,57,.55); }
.pitch-line.red { background: var(--bad); box-shadow: 0 0 10px rgba(229,72,77,.55); }
.pitch-line.far { height: 0; margin-top: 0; background: none; box-shadow: none; border-top: 2px dashed var(--bad); }
.pitch-line span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 800; color: var(--bad);
  background: #11141a; padding: 1px 5px; border-radius: 4px; display: none; white-space: nowrap; }
.pitch-line.far span { display: block; }

.theory { border-left: 4px solid var(--accent); }
.theory p, .theory ul { margin: 6px 0; }
.results { border: 2px solid var(--line); }
.results.pass { border-color: var(--ok); }
.results.fail { border-color: var(--warn); }
.results .big { font-size: 28px; font-weight: 700; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 8px 0; }
.stats div span { display: block; font-size: 12px; color: var(--muted); }
.badge-new { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: #241a00; background: linear-gradient(90deg, #ffd66b, #ffb020); vertical-align: middle; }

/* Live pitch readout: big on the Tuner and Tune strings pages, a slim dock at the bottom while practising a piece. */
.meter { text-align: center; }
.pbadge { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 10px; background: var(--gray); border: 4px solid var(--gray);
  display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s, box-shadow .2s;
  font-size: 12px; font-weight: 700; letter-spacing: .05em; color: rgba(0,0,0,.6); }
.pbadge.silence, .pbadge.nopitch { color: rgba(255,255,255,.7); }
.pbadge.red { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 24px rgba(229,72,77,.5); }
.pbadge.yellow { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 24px rgba(232,179,57,.4); }
.pbadge.green { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 24px rgba(62,207,106,.5); }
.pnote { font-size: 42px; font-weight: 700; line-height: 1.1; }
.phz { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.gauge { margin: 0 auto; max-width: 360px; }
.gauge-track { position: relative; height: 10px; border-radius: 6px; margin-bottom: 6px;
  background: linear-gradient(to right, var(--bad) 0%, var(--warn) 30%, var(--ok) 45%, var(--ok) 55%, var(--warn) 70%, var(--bad) 100%); }
.gauge-needle { position: absolute; top: -4px; left: 50%; width: 4px; height: 18px; background: #fff; border-radius: 2px;
  transform: translateX(-50%); transition: left .08s linear; box-shadow: 0 0 4px rgba(0,0,0,.6); }
.pcents { font-size: 13px; color: var(--muted); }
.hud { display: flex; gap: 24px; justify-content: center; margin: 10px 0 4px; }
.hud div { text-align: center; }
.hud span { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hud b { font-size: 22px; }
.hud b.hot { color: var(--ok); text-shadow: 0 0 14px rgba(62,207,106,.8); animation: multPulse .5s ease; }
@keyframes multPulse { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }

#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--panel); border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#dock[hidden] { display: none; }
#dock .pbadge { width: 46px; height: 46px; margin: 0; border-width: 3px; font-size: 9px; }
#dock .pnote { font-size: 24px; min-width: 64px; }
#dock .gauge { margin: 0; flex: 1; min-width: 160px; max-width: 320px; }
#dock .hud { margin: 0; gap: 16px; }
#dock .hud b { font-size: 18px; }

.history { width: 100%; height: 90px; display: block; border-radius: 8px; background: #11141a; margin-top: 12px; }
.history-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
details.debug { margin-top: 14px; font-size: 13px; color: var(--muted); }
details.debug canvas { width: 100%; height: 60px; display: block; border-radius: 6px; background: #11141a; margin-top: 6px; }

/* Tune strings */
.strings { display: flex; gap: 12px; justify-content: center; margin: 4px 0 18px; }
.sbox { width: 58px; height: 58px; border-radius: 12px; border: 2px solid var(--gray); display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: var(--muted); transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
.sbox.active { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 10px rgba(91,141,238,.5); }
.sbox.done { background: var(--ok); border-color: var(--ok); color: #06210f; box-shadow: 0 0 14px rgba(62,207,106,.6); }
.complete { text-align: center; }
.complete .check { width: 72px; height: 72px; margin: 4px auto 12px; border-radius: 50%; background: var(--ok); color: #06210f; display: flex;
  align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 0 30px rgba(62,207,106,.7); animation: checkPop .5s ease .1s both; }
@keyframes checkPop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.complete.card { animation: cardPop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes cardPop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }

/* Editor */
.ed-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ed-meta label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .sep { width: 1px; align-self: stretch; background: var(--line); }
.seg.dur button { min-width: 38px; font-size: 18px; line-height: 1; padding: 6px 8px; }
.ed-score { min-height: 170px; cursor: crosshair; }
.hover-pitch { position: absolute; display: none; pointer-events: none; transform: translate(12px, -50%); padding: 1px 6px; border-radius: 4px;
  font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); white-space: nowrap; z-index: 3; }
.hover-pitch.show { display: block; }
.bar-status { color: var(--accent); font-weight: 600; font-size: 13px; }
.bar-status.full { color: var(--ok); }

/* Drag a MusicXML file anywhere onto the page to add it to My pieces. */
#drop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; pointer-events: none;
  background: rgba(15,17,21,.8); border: 3px dashed var(--accent); font-size: 22px; font-weight: 700; }
#drop.show { display: flex; }

#combo { position: fixed; top: 28%; left: 50%; z-index: 6; font-size: 2.2rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ok); text-shadow: 0 0 20px rgba(62,207,106,.9), 0 0 6px rgba(255,255,255,.6); pointer-events: none; opacity: 0; }
#combo.show { animation: comboPop 1.1s ease forwards; }
@keyframes comboPop {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%, -14px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -36px) scale(.92); }
}

#load-error { position: relative; z-index: 6; background: #4a1416; color: #ffd7d7; padding: 12px 16px; border-bottom: 1px solid var(--bad); }
.toast { position: fixed; top: 64px; right: 16px; z-index: 30; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; max-width: 80vw; }
table.set { border-collapse: collapse; width: 100%; }
table.set td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.set td:first-child { width: 40%; }
.fingers { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.fingers td, .fingers th { border: 1px solid var(--line); padding: 3px 8px; text-align: center; }
@media (max-width: 600px) {
  header.top { gap: 6px; padding: 8px 10px; }
  header.top nav button { padding: 4px 8px; }
  main { padding: 10px; }
  .pnote { font-size: 34px; }
}
</style>
</head>
<body>
<div id="load-error" hidden></div>
<canvas id="halo"></canvas>
<div id="combo"></div>
<div id="drop">Drop a MusicXML file to add it to My pieces</div>
<header class="top">
  <span class="brand">🎻 Daniel's violin trainer</span>
  <nav>
    <button class="ghost" data-nav="home">Home</button>
    <button class="ghost" data-nav="tuner">Tuner</button>
    <button class="ghost" data-nav="strings">Tune strings</button>
    <button class="ghost" data-nav="editor">Editor</button>
    <button class="ghost" data-nav="theory">Theory</button>
    <button class="ghost" data-nav="settings">Settings</button>
  </nav>
  <div class="chips">
    <span class="chip on" id="chip-awake" hidden title="The screen will not dim or lock while you practise">☀ Screen stays on</span>
    <span class="chip" id="chip-ref" title="Reference pitch, change it in Settings">A4 = 440 Hz</span>
    <button class="chip" id="chip-mic" title="Turn the microphone on or off">🎤 Mic off</button>
  </div>
</header>
<main id="view"></main>
<div id="dock" hidden></div>

<script>window.__vfFailed = false;</script>
<script src="vendor/vexflow/vexflow.min.js" onerror="window.__vfFailed = true"></script>
<script src="vendor/jszip/jszip.min.js"></script>
<script>
'use strict';
/* =========================================================================
   Utilities
   ========================================================================= */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mod = (a, n) => ((a % n) + n) % n;
const today = () => new Date().toLocaleDateString('sv-SE');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : String(kid));
  }
  return el;
}

function toast(msg, ms = 2600) {
  const t = h('div', { class: 'toast' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

/** A button that needs a second click to do something destructive. */
function armedButton(label, armedLabel, action) {
  let armed = false;
  const b = h('button', { onclick: () => {
    if (!armed) { armed = true; b.textContent = armedLabel; setTimeout(() => { armed = false; b.textContent = label; }, 4000); return; }
    action();
  } }, label);
  return b;
}

/* =========================================================================
   Music theory
   ========================================================================= */
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const NOTE_NAMES_FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const STEP_SEMITONE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const DIATONIC_STEPS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const MAJOR_KEYS_BY_FIFTHS = ['Cb', 'Gb', 'Db', 'Ab', 'Eb', 'Bb', 'F', 'C', 'G', 'D', 'A', 'E', 'B', 'F#', 'C#'];
const SHARP_ORDER_STEPS = ['F', 'C', 'G', 'D', 'A', 'E', 'B'];
const FLAT_ORDER_STEPS = ['B', 'E', 'A', 'D', 'G', 'C', 'F'];
const pretty = s => String(s).replace(/#/g, '♯').replace(/([A-G])b/g, '$1♭');

/** Accidentals get both spellings shown together (e.g. "C♯/D♭4"); naturals just show once. */
function noteLabel(midi) {
  const i = mod(midi, 12), oct = Math.floor(midi / 12) - 1;
  const s = NOTE_NAMES[i], f = NOTE_NAMES_FLAT[i];
  return pretty(s === f ? s : s + '/' + f) + oct;
}
const midiOfNote = (step, alter, octave) => (octave + 1) * 12 + STEP_SEMITONE[step] + (alter || 0);
const spelled = n => pretty(n.step + (n.alter === 1 ? '#' : n.alter === 2 ? '##' : n.alter === -1 ? 'b' : n.alter === -2 ? 'bb' : '')) + n.octave;
const keyName = fifths => MAJOR_KEYS_BY_FIFTHS[fifths + 7] || 'C';

/** Which letters the key signature sharpens (+1) or flattens (-1). */
function keyAccidentalMap(fifths) {
  const map = {};
  if (fifths > 0) for (let i = 0; i < Math.min(fifths, 7); i++) map[SHARP_ORDER_STEPS[i]] = 1;
  else if (fifths < 0) for (let i = 0; i < Math.min(-fifths, 7); i++) map[FLAT_ORDER_STEPS[i]] = -1;
  return map;
}

// Note lengths in quarter beats. 32nds and 64ths only come from imported files.
const DUR_BEATS = { w: 4, h: 2, q: 1, 8: 0.5, 16: 0.25, 32: 0.125, 64: 0.0625 };
const noteBeats = n => (DUR_BEATS[n.vexDuration] || 1) * (n.dotted ? 1.5 : 1);

/* ---------- Violin geometry: open strings and 3rd position ---------- */
const OPEN_STRING_MIDI = [55, 62, 69, 76]; // G3 D4 A4 E5
const OPEN_STRING_LETTER = { 7: 'G', 2: 'D', 9: 'A', 4: 'E' };
const OPEN_STRING_DIATONIC = [
  { name: 'G', d: 3 * 7 + 4 }, { name: 'D', d: 4 * 7 + 1 }, { name: 'A', d: 4 * 7 + 5 }, { name: 'E', d: 5 * 7 + 2 },
];

/**
 * 3rd position: which string and finger plays this note. The four fingers sit 3–6 letter
 * names above the open string, and with strings a 5th apart exactly one string fits.
 */
function thirdPositionFingering(n) {
  if (n.isRest || !n.step) return null;
  const d = n.octave * 7 + DIATONIC_STEPS.indexOf(n.step);
  if (n.openString) {
    const open = OPEN_STRING_DIATONIC.find(s => s.d === d);
    if (open) return { string: open.name, finger: 0 };
  }
  for (const s of OPEN_STRING_DIATONIC) {
    const offset = d - s.d;
    if (offset === 0 && !n.alter) return { string: s.name, finger: 0 };
    if (offset >= 3 && offset <= 6) return { string: s.name, finger: offset - 2 };
  }
  if (d - OPEN_STRING_DIATONIC[3].d === 7) return { string: 'E', finger: 4 }; // 4th-finger extension
  return null;
}

/** Position runs ("III" … "I") are judged by pitched notes only, so a rest doesn't end one. */
function prevPitchedNote(notes, idx) {
  for (let i = idx - 1; i >= 0; i--) if (!notes[i].isRest) return notes[i];
  return null;
}

/** "III", "3rd pos." … → 3; "I", "1st pos", "pos. ord." → null; anything else → undefined. */
function parsePositionWords(text) {
  const t = (text || '').trim().toLowerCase();
  if (/^(iii|3rd( pos(ition|\.)?)?|3\.? ?(läget|lägret|grepp))$/.test(t)) return 3;
  if (/^(i|1st( pos(ition|\.)?)?|pos\.? ?ord\.?|1\.? ?(läget|lägret|grepp))$/.test(t)) return null;
  return undefined;
}

/* =========================================================================
   MusicXML in and out
   A piece is { title, composer, fifths, beats, beatType, clef, bpm, measureLengths, slurs, notes }
   and a note is { midi, isRest, vexDuration, dotted, step, alter, octave, staccato, position, openString }.
   ========================================================================= */
const TYPE_TO_DUR = { whole: 'w', half: 'h', quarter: 'q', eighth: '8', '16th': '16', '32nd': '32', '64th': '64' };
const DUR_TO_TYPE = { w: 'whole', h: 'half', q: 'quarter', 8: 'eighth', 16: '16th', 32: '32nd', 64: '64th' };

/** Nearest written value for a length in quarter beats, for notes that carry no <type>. */
function durationForBeats(beats) {
  let best = { vexDuration: 'q', dotted: false }, bestErr = Infinity;
  for (const [d, b] of Object.entries(DUR_BEATS)) {
    for (const dotted of [false, true]) {
      const err = Math.abs(b * (dotted ? 1.5 : 1) - beats);
      if (err < bestErr - 1e-9) { bestErr = err; best = { vexDuration: d, dotted }; }
    }
  }
  return best;
}

function mapClef(sign, line) {
  const s = (sign || 'G').toUpperCase();
  if (s === 'F') return 'bass';
  if (s === 'C') return parseInt(line, 10) === 4 ? 'tenor' : 'alto';
  return 'treble';
}

function parseMusicXML(xmlText) {
  const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (xmlDoc.querySelector('parsererror')) throw new Error("this file isn't valid XML");
  if (xmlDoc.querySelector('score-timewise')) throw new Error('timewise MusicXML is not supported; export it as "partwise" (the usual kind)');
  const title = ((xmlDoc.querySelector('work-title') || xmlDoc.querySelector('movement-title') || {}).textContent || '').trim();

async function mxlToXmlText(arrayBuffer) {
  if (typeof JSZip === 'undefined') throw new Error('zip support failed to load');
  const zip = await JSZip.loadAsync(arrayBuffer);
  const container = zip.file('META-INF/container.xml');
  let rootPath = null;
  if (container) {
    const doc = new DOMParser().parseFromString(await container.async('text'), 'application/xml');
    const rf = doc.querySelector('rootfile');
    rootPath = rf && rf.getAttribute('full-path');
  }
  // Some .mxl files skip container.xml; fall back to the first score file inside.
  if (!rootPath || !zip.file(rootPath)) rootPath = Object.keys(zip.files).find(n => /\.(xml|musicxml)$/i.test(n) && !/^META-INF\//.test(n));
  if (!rootPath) throw new Error("couldn't find the score inside this .mxl file");
  return zip.file(rootPath).async('text');
}

/** Reads a .musicxml / .xml / .mxl file into MusicXML text, and checks that it parses. */
async function readScoreFile(file) {
  const isZip = /\.mxl$/i.test(file.name);
  const xml = isZip ? await mxlToXmlText(await file.arrayBuffer()) : await file.text();
  const parsed = parseMusicXML(xml);
  return { xml, parsed };
}

const scoreCache = new Map();
/** The parsed piece for a level (cached by its MusicXML). Throws if the MusicXML is broken. */
function levelScore(level) {

  return scoreCache.get(level.xml);
}

/* =========================================================================
